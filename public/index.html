<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>EmmArk 小秘書 Dashboard</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#f0f2f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/img/mascot.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="小秘書">
  <link rel="stylesheet" href="/app.css">
  <style>
    #main { display: none; }
    /* 總覽：一行摘要，不做大數字卡片 */
    .overview { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .stats { display: flex; flex-wrap: wrap; gap: 6px; }
    @media (max-width: 600px) {
      .stat-pill { height: 28px; padding: 0 10px; font-size: 12px; }
      .stat-pill b { font-size: 14px; }
      .overview { flex-wrap: nowrap; }
      /* 數字膠囊變多了：窄螢幕一行橫向捲動，右邊的「列表｜日曆」不被擠成直書 */
      .stats { flex-wrap: nowrap; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 20px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 20px), transparent); padding-right: 16px; }
      .stats::-webkit-scrollbar { display: none; }
      .stat-pill { flex: none; white-space: nowrap; padding: 0 8px; }
      .stat-pill.sum { display: none; } /* 窄螢幕先讓位給過期／今天／明天／這七天 */
      .overview .view-tabs { flex: none; white-space: nowrap; }
      .overview .view-tab { padding-left: 10px; padding-right: 10px; font-size: 13px; }
    }
    .stat-pill { display: inline-flex; align-items: baseline; gap: 6px; height: 30px; padding: 0 12px; border-radius: 9999px; background: var(--fill); font-size: 13px; color: var(--ink-2); }
    .stat-pill b { font-size: 15px; color: var(--ink); font-weight: 700; }
    .stat-pill.late { background: var(--red-tint); color: var(--red); }
    .stat-pill.late b { color: var(--red); }
    button.stat-pill { border: none; cursor: pointer; font-family: inherit; }
    button.stat-pill.late:hover { background: var(--red-hover); }
    .stat-pill.late[aria-pressed="true"] { background: var(--red); color: #fff; }
    .stat-pill.late[aria-pressed="true"] b { color: #fff; }
    .trunc-warn { background: var(--amber-tint); color: var(--amber); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; }
    /* 列表／日曆切換 */
    /* 專案膠囊 */
    /* 看哪一類：該做的事（預設）／筆記與紀錄（含週報）／已完成／全部。舊的東西都在這裡找得到 */
    .scope-tabs { display: flex; width: 100%; margin-bottom: 10px; }
    .scope-tabs .view-tab { flex: 1; padding: 0 8px; white-space: nowrap; }
    .list-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .project-tags { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
    /* 手機：分頁只放 待辦／服事表／詩歌庫，其餘收進「更多」，不再被切掉 */
    .tab-more { display: none; }
    @media (max-width: 640px) {
      .tab-more { display: block; }
      .tabbar:not(.show-extra) .tab-extra { display: none; }
      .tabbar.show-extra { flex-wrap: wrap; overflow-x: visible; -webkit-mask-image: none; mask-image: none; }
    }
    @media (min-width: 641px) { .project-tags { flex-wrap: wrap; overflow: visible; } }
    @media (max-width: 640px) { .project-tags { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); padding-right: 24px; } }
    .project-tags::-webkit-scrollbar { display: none; }
    .project-tag { border: none; flex: none; height: 32px; padding: 0 14px; border-radius: 16px; background: var(--fill); font-size: 14px; color: var(--ink); white-space: nowrap; cursor: pointer; display: inline-flex; align-items: center; }
    .project-tag:hover { background: var(--fill-hover); }
    .project-tag.active { background: var(--ink); color: var(--on-ink); }
    .filters { margin-bottom: 10px; }
    .filter-row { display: flex; gap: 6px; align-items: center; }
    .filter-row input[type=search] { flex: 1; min-width: 0; height: 38px; min-height: 38px; border-radius: 9999px; padding: 0 14px; font-size: 14px; }
    .chip-btn { flex: none; position: relative; height: 38px; padding: 0 12px; border-radius: 9999px; border: none; background: var(--fill); color: var(--ink); font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    .chip-btn:hover { background: var(--fill-hover); }
    .project-pick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .chip-btn .icon { width: 16px; height: 16px; }
    .chip-btn[aria-expanded="true"], .chip-btn[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
    .chip-btn .dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
    .filter-panel { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-end; margin-top: 8px; padding: 12px; }
    .filter-panel[hidden] { display: none; }
    .filter-panel label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--ink-2); flex: 1 1 140px; }
    .filter-panel select { height: 38px; min-height: 38px; border-radius: 10px; font-size: 14px; }
    .select-all { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    /* 選取模式：批次列浮在輸入列上方 */
    #bulkBar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 45; width: min(868px, calc(100% - 24px)); display: none; align-items: center; gap: 6px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 6px 24px rgba(0,0,0,.14); border-radius: 9999px; padding: 6px 6px 6px 14px; }
    body.selecting #bulkBar { display: flex; }
    body.selecting .composer { display: none; }
    body.selecting #bulkBar { bottom: calc(16px + env(safe-area-inset-bottom)); }
    #bulkCount { font-weight: 700; flex: 1; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #bulkBar .btn-sm { background: var(--fill); color: var(--ink); }
    #bulkBar .btn-sm:hover { background: var(--fill-hover); }
    #bulkBar .btn-del { background: var(--red-tint); color: var(--red); }
    #bulkBar .btn-done { background: var(--green-btn); color: #fff; }
    /* LINE 聊天列表式的記錄列 */
    .note-list { padding: 4px 0; }
    .note-list .row + .row { background-image: linear-gradient(var(--line), var(--line)); background-repeat: no-repeat; background-size: calc(100% - 98px) 1px; background-position: 98px 0; }
    .note-list .row:first-child { border-radius: 16px 16px 0 0; }
    .note-list .row:last-child { border-radius: 0 0 16px 16px; }
    .row { display: flex; align-items: center; gap: 10px; padding: 6px 4px 6px 12px; transition: background-color .16s var(--ease); }
    .row:hover { background: var(--row-hover); }
    .row .sel { flex: none; width: 24px; display: none; justify-content: center; }
    body.selecting .row .sel { display: inline-flex; }
    body.selecting .row .check { visibility: hidden; }
    .row-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; cursor: pointer; border-radius: 8px; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; flex: none; display: inline-flex; align-items: center; justify-content: center; }
    .avatar.task { background: var(--task-bg); color: var(--task-ink); }
    .duty { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 12px; margin-bottom: 8px; color: inherit; text-decoration: none; font-size: 14px; }
    .duty-text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .duty-text b { font-weight: 600; }
    .duty-text span { color: var(--ink-2); margin-left: 6px; }
    .duty[hidden] { display: none; }
    .due-ic { width: 12px; height: 12px; vertical-align: -1px; margin-right: 3px; }
    .due-preview { font-size: 13px; color: var(--ink-2); margin-top: 4px; min-height: 0; }
    .due-preview:empty { display: none; }
    .duty-av { width: 28px; height: 28px; background: var(--fill); color: var(--ink); }
    .duty-av .icon { width: 16px; height: 16px; }
    .duty-go { width: 18px; height: 18px; color: var(--ink-3); flex: none; }
    @media (hover: hover) { .duty:hover { background: var(--row-hover); } }
    .avatar.reminder { background: var(--amber-tint); color: var(--amber); }
    .avatar.note { background: var(--blue-tint); color: var(--blue); }
    .avatar.project_update { background: var(--purple-tint); color: var(--purple); }
    .row-text { flex: 1; min-width: 0; }
    .row-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 15px; font-weight: 600; line-height: 1.35; word-break: break-word; white-space: pre-wrap; }
    .row-sub { display: block; font-size: 13px; color: var(--ink-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-sub .late { color: var(--red); font-weight: 600; }
    /* 卡片總覽：一個時段一張卡（跟 LINE 小秘書的海報卡同一個語法：標題＋大數字＋幾筆重點） */
    .note-list.as-cards { background: none; border: none; box-shadow: none; padding: 0; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
    @media (max-width: 640px) { .cards { grid-template-columns: 1fr; } }
    .cgroup { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px 6px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .chead { display: flex; align-items: center; gap: 8px; min-height: 32px; margin-bottom: 2px; }
    .cname { font-size: 15px; font-weight: 700; color: var(--ink); }
    .cnum { min-width: 24px; height: 24px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; border-radius: 9999px; background: var(--fill); color: var(--ink-2); font-size: 13px; font-weight: 700; }
    .cgroup.overdue { border-color: var(--red); }
    .cgroup.overdue .cname { color: var(--red); }
    .cgroup.overdue .cnum { background: var(--red-tint); color: var(--red); }
    .cgroup.today .cnum { background: var(--green-tint); color: var(--green-ink); }
    .cgo, .cmore { border: none; background: none; font: inherit; font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; border-radius: 9999px; }
    .cgo { margin-left: auto; min-height: 44px; padding: 0 8px 0 12px; display: inline-flex; align-items: center; gap: 2px; margin-top: -6px; margin-bottom: -6px; }
    .cgo .icon { width: 14px; height: 14px; }
    .cgo:hover, .cmore:hover { background: var(--row-hover); }
    .cmore { width: 100%; min-height: 44px; margin-top: 2px; }
    .citem { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-top: 1px solid var(--line); }
    .chead + .citem { border-top: none; }
    .ctext { flex: 1; min-width: 0; text-align: left; border: none; background: none; font: inherit; padding: 6px 0; cursor: pointer; border-radius: 8px; }
    .ct { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 15px; font-weight: 600; line-height: 1.35; color: var(--ink); }
    .cm { display: block; margin-top: 2px; font-size: 12.5px; color: var(--ink-2); }
    .citem.done .ct { color: var(--ink-3); text-decoration: line-through; }
    .citem.done .check i { background: var(--green-btn); border-color: var(--green-btn); }
    .citem.done .check i svg { opacity: 1; }
    .check { margin-left: 0; margin-right: 0; }
    .cempty { margin: 4px 0 10px; font-size: 14px; color: var(--ink-2); }
    .cminis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 12px; }
    .cmini { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 9999px; background: var(--surface); font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); cursor: pointer; }
    .cmini b { margin-left: auto; font-size: 13px; color: var(--ink-2); }
    .cmini .icon { width: 14px; height: 14px; color: var(--ink-2); }
    .cmini:hover { background: var(--row-hover); }
    .backbar { padding: 4px 8px 0; }
    .backbar button { min-height: 44px; display: inline-flex; align-items: center; gap: 4px; border: none; background: none; font: inherit; font-size: 14px; font-weight: 600; color: var(--ink-2); cursor: pointer; border-radius: 9999px; padding: 0 12px 0 6px; }
    .backbar button:hover { background: var(--row-hover); }
    .stats:empty { display: none; }
    @media (max-width: 640px) { #layoutBtn .lbl { display: none; } #layoutBtn { padding: 0 10px; } } /* 窄螢幕只留圖示，搜尋框才有地方 */
    /* 筆記：一則一張卡，由左到右、由上到下，新的在前 */
    .notes-projects { margin-bottom: 12px; flex: none; }
    .notes-projects .project-tag .num { margin-left: 6px; font-size: 12.5px; opacity: .7; }
    #panel-notes .toolbar input { min-width: 0; }
    #panel-notes .toolbar .btn { flex: none; }
    .notes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
    @media (max-width: 640px) { .notes-grid { grid-template-columns: 1fr; } }
    .ncard { margin: 0; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04); cursor: pointer; }
    .ncard:hover { background: var(--row-hover); }
    .nt { margin: 0; font-size: 15.5px; font-weight: 700; line-height: 1.35; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
    .np { margin: 6px 0 0; font-size: 14px; line-height: 1.5; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
    .nmeta { margin-top: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
    .nproj, .nbadge { padding: 2px 8px; border-radius: 9999px; background: var(--fill); font-weight: 600; color: var(--ink-2); }
    .nbadge { background: var(--blue-tint); color: var(--blue); }
    .ndate { margin-left: auto; }
    .more { display: flex; justify-content: center; padding: 2px 0 8px; }
    .more button { min-height: 44px; display: inline-flex; align-items: center; gap: 4px; padding: 0 16px; border: none; background: none; border-radius: 9999px; font: inherit; font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
    .more button:hover { background: var(--row-hover); }
    .more button .icon { width: 14px; height: 14px; }
    .stat-pill[aria-pressed="true"] { background: var(--ink); color: #fff; }
    .stat-pill[aria-pressed="true"] b { color: #fff; }
    .row .read { flex: none; font-size: 12px; font-weight: 600; color: var(--green-ink); }
    .check { width: 36px; height: 36px; margin-left: 6px; flex: none; display: inline-flex; align-items: center; justify-content: center; border: none; background: none; cursor: pointer; border-radius: 50%; }
    .check i { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--ring); display: inline-flex; align-items: center; justify-content: center; color: #fff; transition: background-color .16s var(--ease), border-color .16s var(--ease); }
    .check i svg { width: 14px; height: 14px; stroke-width: 3; opacity: 0; transition: opacity .16s var(--ease); }
    .check:hover i { border-color: var(--green-btn); }
    .row.done .check i { background: var(--green-btn); border-color: var(--green-btn); }
    .row.done .check i svg { opacity: 1; }
    .row.done .row-title { color: var(--ink-3); font-weight: 400; }
    .row.done .avatar { filter: grayscale(1); opacity: .55; }
    .raw-toggle { margin-top: 4px; cursor: pointer; }
    .raw-label { display: inline-block; font-size: 12px; color: var(--ink-2); background: var(--fill); border-radius: 10px; padding: 1px 8px; }
    .raw-text { display: none; margin-top: 6px; padding: 8px 10px; background: var(--fill); border-radius: 8px; font-size: 13px; color: var(--ink-2); white-space: pre-wrap; word-break: break-word; }
    .raw-toggle.open .raw-text { display: block; }
    /* 日曆 */
    .cal-head { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 10px; }
    .cal-head h2 { font-size: 17px; font-weight: 700; min-width: 140px; text-align: center; }
    .cal-nav { width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--fill); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); }
    .cal-nav:hover { background: var(--fill-hover); }
    .cal-showdone-row { text-align: center; margin: 0 0 10px; }
    .cal-showdone { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 13px; color: var(--ink-2); cursor: pointer; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 8px; }
    .cal-wd { text-align: center; font-size: 12px; font-weight: 600; color: var(--ink-3); padding: 4px 0; }
    .cal-cell { min-height: 64px; border-radius: 10px; padding: 6px; cursor: pointer; position: relative; }
    .cal-cell:hover { background: var(--fill); }
    .cal-cell.empty { cursor: default; background: none; }
    .cal-cell.today .cal-date { background: var(--ink); color: var(--on-ink); }
    .cal-cell.selected { background: var(--fill); box-shadow: inset 0 0 0 2px var(--ink); }
    .cal-date { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; border-radius: 12px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .cal-dots { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 4px; padding-left: 4px; }
    .cal-dot { width: 6px; height: 6px; border-radius: 50%; }
    .cal-dot.reminder { background: var(--amber); }
    .cal-dot.task { background: var(--task-ink); }
    .cal-dot.worship { background: var(--blue); }
    .cal-count { font-size: 11px; color: var(--ink-2); margin-top: 2px; padding-left: 4px; }
    .day-detail { margin-top: 12px; padding: 8px 16px; }
    .day-detail h3 { font-size: 15px; font-weight: 700; margin: 8px 0; }
    .day-item:last-child { border-bottom: none; }
    .day-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; flex-wrap: wrap; }
    .day-item .dtime { font-variant-numeric: tabular-nums; color: var(--ink-2); min-width: 44px; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .type-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
    .type-task { background: var(--task-bg); color: var(--task-ink); }
    .type-reminder { background: var(--amber-tint); color: var(--amber); }
    .type-note { background: var(--blue-tint); color: var(--blue); }
    .type-project_update { background: var(--purple-tint); color: var(--purple); }
    /* 詩歌庫／敬拜順序／會議記錄／收藏：扁平列表，不做卡片 */
    .toolbar { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .toolbar input { flex: 1; }
    .add-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .add-row input { flex: 1; }
    .link-filters { display: flex; gap: 6px; margin-bottom: 6px; }
    .list-panel:empty { display: none; }
    .list-panel { padding: 0 16px; }
    .list-panel .card:last-child { border-bottom: none; }
    .card { border-bottom: 1px solid var(--line); padding: 12px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .card.done { opacity: .55; }
    .card-head { flex: 1 1 100%; display: flex; align-items: center; gap: 10px; cursor: pointer; min-height: 32px; }
    .card-head .title { font-weight: 600; flex: 1; min-width: 0; }
    .card-head .date { font-weight: 700; flex: none; font-variant-numeric: tabular-nums; }
    .card-head .meeting-title { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-head .tag { font-size: 12px; color: var(--ink-2); background: var(--fill); padding: 2px 8px; border-radius: 10px; margin-left: auto; flex: none; }
    .card-body { display: none; flex: 1 1 100%; padding-top: 8px; }
    .card-body.open { display: block; }
    .lyrics, .content-pre { white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; font-size: 14px; line-height: 1.6; margin-bottom: 10px; }
    .history { font-size: 13px; color: var(--ink-2); margin-bottom: 10px; }
    .action-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 14px; }
    .action-item.done { opacity: .5; }
    .action-item span { flex: 1; }
    .card .content { flex: 1; min-width: 0; word-break: break-word; }
    .card a { color: var(--blue); font-weight: 600; text-decoration: none; }
    .card a:hover { text-decoration: underline; }

    #orderFContent { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
    #songsFSection { min-height: 120px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    /* 相簿 */
    .album-hint { color: var(--ink-2); font-size: 14px; margin: 0 0 12px; }
    .album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 4px; }
    .album-item { position: relative; border-radius: 8px; overflow: hidden; background: var(--fill); aspect-ratio: 1; }
    .album-item img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
    .album-item .album-meta { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 8px 6px; background: linear-gradient(transparent, rgba(0,0,0,.6)); color: #fff; font-size: 12px; }
    .album-item .album-del { position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; border: none; border-radius: 50%; background: rgba(0,0,0,.5); color: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .album-item .album-del:hover { background: var(--red); }
    .album-item .album-del .icon { width: 16px; height: 16px; }
    .album-empty { color: var(--ink-2); text-align: center; padding: 48px 16px; }
    .lightbox { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.88); display: flex; align-items: center; justify-content: center; padding: 20px; cursor: zoom-out; }
    .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
    /* 底部輸入列：跟 LINE 一樣打一句話就送出 */
    .composer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; pointer-events: none; }
    .composer-inner { pointer-events: auto; max-width: 900px; margin: 0 auto; display: flex; align-items: center; gap: 6px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); }
    @media (min-width: 900px) { .composer-inner { border: 1px solid var(--line); border-bottom: none; border-radius: 16px 16px 0 0; background: var(--surface); } }
    .composer-input { flex: 1; min-width: 0; height: 44px; min-height: 44px; border-radius: 9999px !important; padding: 0 16px !important; font-size: 15px; background: var(--fill); }
    .icon-btn { width: 44px; height: 44px; flex: none; border: none; background: none; border-radius: 50%; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .icon-btn:hover { background: var(--fill); }
    .send { width: 44px; height: 44px; flex: none; border: none; border-radius: 50%; background: var(--green-btn); color: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .send:hover { background: var(--green-press); }
    .send:disabled { background: var(--fill-hover); color: var(--ink-3); cursor: default; }
    .send.busy { opacity: .6; }
    body.no-composer .composer { display: none; }
  </style>
</head>

// ---- 分頁籤切換（取代原本 5 個獨立頁面互跳，共用同一個登入 session） ----
const TABS = ['dashboard', 'notes', 'songs', 'order', 'meetings', 'links', 'album'];
let currentTab = 'dashboard';
const loadedTabs = new Set(['dashboard']);
let hashTabApplied = false;

const EXTRA_TABS = ['order', 'meetings', 'links', 'album'];
function setMoreTabs(open) {
  document.getElementById('tabbar').classList.toggle('show-extra', open);
  const b = document.getElementById('tabMore');
  b.setAttribute('aria-expanded', String(open));
  b.textContent = open ? '收起' : '更多';
}
function toggleMoreTabs() { setMoreTabs(!document.getElementById('tabbar').classList.contains('show-extra')); }

function switchTab(name) {
  if (!TABS.includes(name)) name = 'dashboard';
  currentTab = name;
  setMoreTabs(EXTRA_TABS.includes(name)); // 目前分頁在「更多」裡就保持展開，才看得到底線在哪
  TABS.forEach(t => {
    document.getElementById('panel-' + t).style.display = t === name ? 'block' : 'none';
    document.getElementById('tabBtn-' + t).classList.toggle('active', t === name);
  });
  // 相簿只能從 LINE 傳圖進來，後台沒有「新增」這個動作，所以把 ＋ 收起來
  // 輸入列只在待辦分頁出現；其他分頁用各自的新增按鈕
  document.body.classList.toggle('no-composer', name !== 'dashboard');
  if (name !== 'dashboard') setSelectMode(false);

  // 相簿的圖片網址是簽出來的、一小時後會失效，
  // 所以每次切過來都重新抓，不做快取
  if (name === 'album') { Album.load(); return; }
  // 筆記直接用已經載好的全部記錄，每次切過來重畫就好
  if (name === 'notes') { Notes.render(); return; }

  if (!loadedTabs.has(name)) {
    loadedTabs.add(name);
    if (name === 'songs') Songs.load();
    else if (name === 'order') Order.load();
    else if (name === 'meetings') Meetings.load();
    else if (name === 'links') Links.load();
  }
}

// ---- 提示（可帶「復原」） ----
let toastTimer = null;
let toastExpire = null; // 被下一則提示蓋掉時也要執行（例如送出延後的刪除）
function toast(msg, opts = {}) {
  hideToast();
  toastExpire = opts.onExpire || null;
  const el = document.getElementById('toast');
  const btn = document.getElementById('toastAction');
  document.getElementById('toastText').textContent = msg;
  el.classList.toggle('error', !!opts.error);
  btn.hidden = !opts.action;
  btn.textContent = opts.action ? opts.action.label : '';
  btn.onclick = opts.action ? () => { hideToast(true); opts.action.run(); } : null;
  el.hidden = false;
  toastTimer = setTimeout(() => hideToast(), opts.ms || (opts.action ? 5000 : 3000));
}
function toastErr(msg) { toast(msg, { error: true }); }
function hideToast(undone) {
  clearTimeout(toastTimer);
  document.getElementById('toast').hidden = true;
  const f = toastExpire; toastExpire = null;
  if (f && !undone) f();
}

// ---- 輸入列：跟 LINE 一樣打一句話就送出（同一套 AI 分類與指令） ----
async function sendText() {
  const input = document.getElementById('composerInput');
  const btn = document.getElementById('sendBtn');
  const text = input.value.trim();
  if (!text || btn.classList.contains('busy')) return;
  btn.classList.add('busy'); btn.disabled = true;
  const data = await api('POST', { text });
  btn.classList.remove('busy');
  if (!data) { btn.disabled = false; return; }
  input.value = '';
  const msg = (data.reply || '收到了') + (data.needs_line ? '\n（這一步要到 LINE 按「確定」才會生效）' : '');
  const before = new Set(allNotes.map(n => n.id));
  toast(msg, { ms: 6000 });
  await loadNotes();
  // 這句話新建了記錄（AI 分錯類也一樣）就給「復原」；查詢類的話不會有新記錄
  const added = allNotes.filter(n => !before.has(n.id)).map(n => n.id);
  if (added.length) toast(msg, { ms: 6000, action: { label: '復原', run: () => deleteNotes(added) } });
  else toast(msg, { ms: 120000, action: { label: '關閉', run: () => {} } });
}

// 待辦上方一列「下一次服事」，點了到服事表；沒排到或沒設定名字就不顯示
// ── 功能模組：設定精靈裡沒勾的功能，後台對應的分頁和區塊就不顯示 ──
// 還沒讀到設定（或讀不到）就當作全開，不會因為網路問題把分頁藏起來。
let modulesOn = null;
function moduleOn(id) { return !modulesOn || modulesOn.has(id); }
async function applyModules() {
  if (modulesOn) return;
  try {
    const res = await fetch('/api/setup/status?action=modules', { headers: { 'x-dashboard-token': token } });
    if (!res.ok) return;
    modulesOn = new Set((await res.json()).enabled);
  } catch (e) { return; }
  const show = (el, on) => { if (el) el.style.display = on ? '' : 'none'; };
  show(document.querySelector('[data-tour="worship-link"]'), moduleOn('worship'));
  show(document.getElementById('tabBtn-songs'), moduleOn('songs'));
  show(document.getElementById('tabBtn-order'), moduleOn('songs'));
  show(document.getElementById('tabBtn-meetings'), moduleOn('meetings'));
  show(document.getElementById('tabBtn-links'), moduleOn('links'));
  show(document.getElementById('tabBtn-album'), moduleOn('album'));
  show(document.querySelector('[data-tour="view-tabs"]'), moduleOn('calendar'));
  // 「更多」收著的四個分頁都被關掉時，「更多」按鈕也不用留
  const anyExtra = moduleOn('songs') || moduleOn('meetings') || moduleOn('links') || moduleOn('album');
  const more = document.getElementById('tabMore');
  if (more && !anyExtra) more.style.setProperty('display', 'none', 'important');
}

async function loadNextDuty() {
  if (!moduleOn('worship')) { document.getElementById('nextDuty').hidden = true; return; }
  const el = document.getElementById('nextDuty');
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const from = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
  let rows = null;
  try {
    const res = await fetch(`/api/worship/schedule?mine=1&from=${from}`, { headers: { 'x-dashboard-token': token } });
    if (res.ok) rows = await res.json();
  } catch (e) { /* 服事表讀不到不影響待辦 */ }
  if (!Array.isArray(rows) || !rows.length) { el.hidden = true; return; }
  const date = rows[0].service_date;
  const roles = [...new Set(rows.filter(r => r.service_date === date).map(r => r.role))];
  const d = new Date(date + 'T00:00:00');
  const days = Math.round((d - today) / 86400000);
  const when = days === 0 ? '今天' : days === 1 ? '明天' : `${d.getMonth() + 1}/${d.getDate()}（${'日一二三四五六'[d.getDay()]}）`;
  document.getElementById('nextDutyTitle').textContent = `下一次服事：${when}`;
  document.getElementById('nextDutySub').textContent = roles.join('、');
  el.hidden = false;
}

// 日期欄位的顯示格式跟著瀏覽器語系走（可能出現 AM/PM），下面再用中文寫一次
function duePreview(id) {
  const v = document.getElementById(id).value;
  const out = document.getElementById(id + 'Preview');
  if (!v) { out.textContent = ''; return; }
  const d = new Date(v);
  out.textContent = `${d.getMonth() + 1}/${d.getDate()}（${'日一二三四五六'[d.getDay()]}）${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

// 內容欄位打出日期時間 → 自動填到期時間（解析交給伺服器，跟 LINE 同一套規則）
const autoDue = {};
function autoFillDue(prefix) {
  const st = autoDue[prefix] = autoDue[prefix] || { timer: null, last: null };
  clearTimeout(st.timer);
  st.timer = setTimeout(async () => {
    const type = document.getElementById(prefix + 'Type').value;
    if (type !== 'task' && type !== 'reminder') return;
    const text = document.getElementById(prefix + 'Content').value.trim();
    if (!text) return;
    let due = null;
    try {
      const res = await fetch('/api/dashboard/notes?parse=' + encodeURIComponent(text), { headers: { 'x-dashboard-token': token } });
      if (res.ok) due = (await res.json()).due;
    } catch (e) { return; }
    if (!due || due === st.last) return;
    st.last = due;
    const local = new Date(due);
    local.setMinutes(local.getMinutes() - local.getTimezoneOffset());
    const el = document.getElementById(prefix + 'DueDate');
    el.value = local.toISOString().slice(0, 16);
    duePreview(prefix + 'DueDate');
    toast('已幫你填好到期時間');
  }, 600);
}

function goPage(page) {
  window.location.href = '/' + page;
}

function formatLeadMinutes(min) {
  if (min % 1440 === 0) return `${min / 1440}天`;
  if (min % 60 === 0) return `${min / 60}小時`;
  return `${min}分鐘`;
}

// 把分鐘數拆成「數值＋單位」給下拉選單用（挑最大能整除的單位）
function minutesToUnit(min) {
  if (min == null) return { value: '', unit: 1 };
  if (min % 1440 === 0) return { value: min / 1440, unit: 1440 };
  if (min % 60 === 0) return { value: min / 60, unit: 60 };
  return { value: min, unit: 1 };
}

function doLogin() {
  token = document.getElementById('tokenInput').value.trim();
  if (!token) return toast('請輸入密碼');
  localStorage.setItem('dashboardToken', token);
  loadNotes();
}

// 記住密碼：網址帶 token（頁面互跳）或之前登入存過的 token，都自動略過登入畫面
async function tryStoredLogin() {
  const saved = new URLSearchParams(location.search).get('token') || localStorage.getItem('dashboardToken');
  if (!saved) return;
  document.getElementById('login').style.display = 'none'; // 先隱藏，避免驗證期間閃一下登入畫面
  const res = await fetch(`/api/dashboard/notes?limit=1`, { headers: { 'x-dashboard-token': saved } });
  if (res.status === 401) {
    localStorage.removeItem('dashboardToken');
    document.getElementById('login').style.display = 'flex'; // 驗證失敗才顯示登入畫面
    return;
  }
  token = saved;
  localStorage.setItem('dashboardToken', token);
  loadNotes();
}
tryStoredLogin();

// 後台列表/日曆/統計都吃這份資料，所以要一次撈足。
// 沒帶 limit 的話 API 預設只給 100 筆 —— 實測 268 筆時，7/14 以前的
// 168 筆在後台完全看不到，看起來就像資料不見了。
const NOTES_LIMIT = 2000;

async function api(method, body) {
  const url = method === 'GET' ? `/api/dashboard/notes?limit=${NOTES_LIMIT}` : `/api/dashboard/notes`;
  let res;
  try {
    res = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json', 'x-dashboard-token': token },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (e) {
    toast('連不上伺服器，請確認網路後再試一次', { error: true });
    return null;
  }
  if (res.status === 401) { toast('密碼錯誤', { error: true }); return null; }
  let data = null;
  try { data = await res.json(); } catch (e) { /* 沒有內容 */ }
  if (!res.ok || (data && data.error)) {
    toast('沒有存成功，請再試一次' + (data && data.error ? `（${data.error}）` : ''), { error: true });
    return null;
  }
  return data;
}

async function getJSON(url) {
  let res;
  try { res = await fetch(url, { headers: { 'x-dashboard-token': token } }); }
  catch (e) { toastErr('連不上伺服器，請確認網路後再試一次'); return null; }
  if (res.status === 401) { toastErr('密碼錯誤'); return null; }
  let data = null;
  try { data = await res.json(); } catch (e) { /* 沒有內容 */ }
  if (!res.ok || (data && data.error)) { toastErr('讀取失敗，請稍後再試' + (data && data.error ? `（${data.error}）` : '')); return null; }
  return data;
}

async function loadNotes() {
  if (!token) return; // 還沒登入時，不要讓自動刷新的 60 秒計時器一直跳密碼錯誤
  await applyModules();
  loadNextDuty();
  const data = await api('GET');
  if (!data) return;
  allNotes = data;

  // 萬一哪天真的撈滿了，要講出來，不要又變成無聲截斷
  const warn = document.getElementById('truncWarn');
  if (warn) {
    const hit = Array.isArray(data) && data.length >= NOTES_LIMIT;
    warn.style.display = hit ? 'block' : 'none';
    if (hit) warn.textContent = `記錄已超過 ${NOTES_LIMIT} 筆，這裡只顯示最新的 ${NOTES_LIMIT} 筆。`;
  }

  // 一併載入主日服事表，疊進月曆
  worshipByDate = {};
  try {
    const wres = await fetch(`/api/worship/schedule`, { headers: { 'x-dashboard-token': token } });
    if (wres.ok) {
      const wd = await wres.json();
      (wd || []).forEach(w => { (worshipByDate[w.service_date] = worshipByDate[w.service_date] || []).push(w); });
    }
  } catch (e) { /* 服事表載入失敗不影響其他功能 */ }

  document.getElementById('login').style.display = 'none';
  document.getElementById('main').style.display = 'block';
  document.getElementById('lastRefresh').textContent = '更新 ' + new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
  renderStats();
  renderProjectTags();
  updateProjectList();
  applyFilters();
  if (currentView === 'calendar') {
    renderCalendar();
    if (selectedKey) showDay(selectedKey);
  }

  // 網址帶 #songs / #order / #meetings / #links（例如從服事表頁面跳過來）第一次登入完成後自動切過去
  if (!hashTabApplied) {
    hashTabApplied = true;
    const h = (location.hash || '').replace('#', '');
    if (h && TABS.includes(h) && h !== 'dashboard') switchTab(h);
  }
}

// 點上方「過期／今天／明天／這七天」：只看那一區；再點一次回到全部
let focusKey = '';
function toggleFocus(key) {
  focusKey = focusKey === key ? '' : key;
  if (focusKey) {
    switchView('list');
    // 只看某一區是照到期時間分區的，所以先回到「該做的事」
    const sc = SCOPES.todo;
    document.getElementById('filterType').value = sc.type;
    document.getElementById('filterDone').value = sc.done;
    document.getElementById('sortBy').value = sc.sort;
    activeProject = '';
    document.getElementById('search').value = '';
  }
  renderStats();
  applyFilters();
}
function isOverdue(n) { return !n.is_done && n.due_date && isActionable(n) && new Date(n.due_date) < new Date(); }

// 版面偏好：卡片（預設，一區一張卡、每張最多 3 筆）或列表（全部條列）。記在這台裝置，讀不到就用卡片。
let layoutPref = 'cards';
try { if (localStorage.getItem('todoLayout') === 'list') layoutPref = 'list'; } catch (e) { /* 沒有也沒關係 */ }
function toggleLayout() {
  layoutPref = layoutPref === 'cards' ? 'list' : 'cards';
  try { localStorage.setItem('todoLayout', layoutPref); } catch (e) { /* 沒有也沒關係 */ }
  focusKey = '';
  renderStats();
  applyFilters();
}
// 卡片總覽只用在「預設的待辦視圖」：有搜尋、專案篩選、改過篩選、選取模式時，一律回到列表
function cardsActive() {
  if (layoutPref !== 'cards' || focusKey || selectMode || activeProject) return false;
  if (document.getElementById('search').value) return false;
  return document.getElementById('filterType').value === DEFAULT_TYPE
    && !document.getElementById('filterDone').value
    && document.getElementById('sortBy').value === DEFAULT_SORT;
}

// 上方數字膠囊＝列表的捷徑：每一區有幾件、點了只看那一區
const STAT_GROUPS = [['overdue', '過期'], ['today', '今天'], ['tomorrow', '明天'], ['week', '這七天']];
function renderStats() {
  const open = allNotes.filter(n => !n.is_done && isActionable(n));
  const counts = Object.fromEntries(groupByDue(open).map(([key, , rows]) => [key, rows.length]));
  if (focusKey && !counts[focusKey]) focusKey = ''; // 那一區都處理完了，自動回到全部
  const cards = cardsActive();
  document.getElementById('stats').innerHTML = `
    <span class="stat-pill sum num">未完成 <b>${open.length}</b></span>
    ${cards ? '' : STAT_GROUPS.filter(([key]) => counts[key]).map(([key, label]) =>
      `<button type="button" class="stat-pill ${key === 'overdue' ? 'late' : ''} num" onclick="toggleFocus('${key}')" aria-pressed="${focusKey === key}" title="${focusKey === key ? '回到全部' : `只看${label}的`}">${label} <b>${counts[key]}</b></button>`).join('')}
  `;
}

function renderProjectTags() {
  const type = document.getElementById('filterType').value;
  const doneSel = document.getElementById('filterDone').value;
  // 「該做的事」只數還沒完成的；看已完成／筆記／全部時，各專案照實際有的記錄數
  const openOnly = doneSel === 'false' || (doneSel === '' && type === 'todo');
  const count = {};
  allNotes.forEach(n => {
    if (!n.project || !matchesType(n, type)) return;
    if (doneSel === 'true' ? !n.is_done : (openOnly && n.is_done)) return;
    count[n.project] = (count[n.project] || 0) + 1;
  });
  if (activeProject && !(activeProject in count)) count[activeProject] = 0; // 正在看的專案不能憑空消失
  const projects = Object.keys(count).sort((a, b) => count[b] - count[a]);
  const container = document.getElementById('projectTags');
  container.innerHTML = [''].concat(projects).map(p =>
    `<button class="project-tag ${activeProject === p ? 'active' : ''}" data-project="${esc(p)}">${p ? esc(p) : '全部'}</button>`).join('');
  container.onclick = e => { const b = e.target.closest('.project-tag'); if (b) setProject(b.dataset.project); };
}

function setProject(p) {
  activeProject = p;
  renderProjectTags();
  applyFilters();
}

function sortNotes(items, sortBy) {
  const byDue = (a, b, dir) => {
    if (!a.due_date && !b.due_date) return 0;
    if (!a.due_date) return 1; // 沒有到期時間的排最後
    if (!b.due_date) return -1;
    return dir * (new Date(a.due_date) - new Date(b.due_date));
  };
  const sorted = items.slice();
  if (sortBy === 'created_asc') sorted.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  else if (sortBy === 'due_asc') sorted.sort((a, b) => byDue(a, b, 1));
  else if (sortBy === 'due_desc') sorted.sort((a, b) => byDue(a, b, -1));
  else if (sortBy === 'content_asc') sorted.sort((a, b) => (a.content || '').localeCompare(b.content || '', 'zh-TW'));
  else sorted.sort((a, b) => new Date(b.created_at) - new Date(a.created_at)); // created_desc（預設）
  return sorted;
}

function applyFilters() {
  if (typeof Notes !== 'undefined') Notes.render(); // 筆記分頁也跟著重畫（新增、編輯、刪除、重新載入之後）
  renderProjectTags();
  renderScopeTabs();
  const type = document.getElementById('filterType').value;
  const done = document.getElementById('filterDone').value;
  const search = document.getElementById('search').value.toLowerCase();

  let filtered = allNotes.filter(n => {
    if (!matchesType(n, type)) return false;
    if (done !== '' && String(n.is_done) !== done) return false;
    if (activeProject && n.project !== activeProject) return false;
    if (search && !n.content.toLowerCase().includes(search) && !(n.project || '').toLowerCase().includes(search)) return false;
    return true;
  });
  filtered = sortNotes(filtered, document.getElementById('sortBy').value);

  const nonDefault = document.getElementById('filterType').value !== DEFAULT_TYPE || document.getElementById('filterDone').value || document.getElementById('sortBy').value !== DEFAULT_SORT;
  document.querySelector('#filterBtn .dot').hidden = !nonDefault;
  const list = document.getElementById('tableBody');
  if (filtered.length === 0) {
    list.classList.remove('as-cards');
    list.innerHTML = '<div class="empty">沒有符合的記錄</div>';
    renderedIds = [];
    updateBulkBar();
    return;
  }
  const sortBy = document.getElementById('sortBy').value;
  let groups = sortBy === 'due_asc' ? groupByDue(filtered)
    : sortBy.startsWith('created') ? groupByCreated(filtered)
    : [['all', '', filtered]];
  // 只看某一區（點上方數字）；篩選條件把那一區變空了就退回全部
  if (focusKey && groups.some(g => g[0] === focusKey && g[2].length)) groups = groups.filter(g => g[0] === focusKey);
  else focusKey = '';
  renderedIds = [];
  const asCards = cardsActive() && groups.some(g => g[0] === 'today' || g[2].length);
  list.classList.toggle('as-cards', asCards);
  document.getElementById('layoutBtn').innerHTML = asCards || layoutPref === 'cards' ? '<svg class="icon"><use href="#i-list"/></svg><span class="lbl">列表檢視</span>' : '<svg class="icon"><use href="#i-grid"/></svg><span class="lbl">卡片檢視</span>';
  if (asCards) {
    list.innerHTML = cardsHtml(groups);
    updateBulkBar();
    return;
  }
  const back = focusKey && layoutPref === 'cards'
    ? `<div class="backbar"><button type="button" onclick="toggleFocus('${focusKey}')"><svg class="icon" style="transform:rotate(180deg)" aria-hidden="true"><use href="#i-right"/></svg>回總覽</button></div>` : '';
  list.innerHTML = back + groups.filter(g => g[2].length).map(([key, label, rows]) => {
    if (key === 'done') {
      if (showDoneGroup) renderedIds.push(...rows.map(r => r.id));
      return `<div class="sep"><button onclick="showDoneGroup = !showDoneGroup; applyFilters()" aria-expanded="${showDoneGroup}">已完成 <span class="num">${rows.length}</span><svg class="icon" style="width:14px;height:14px;transform:rotate(${showDoneGroup ? 90 : 0}deg)"><use href="#i-right"/></svg></button></div>` +
        (showDoneGroup ? rows.map(noteRow).join('') : '');
    }
    // 次要的區（這七天、之後、重複提醒…）預設只露幾列，其餘收起來；點上方數字或「還有 N 筆」才全部展開
    const preview = GROUP_PREVIEW[key];
    const open = focusKey === key || expandedGroups.has(key) || preview === undefined;
    const shown = open ? rows : rows.slice(0, preview);
    renderedIds.push(...shown.map(r => r.id));
    const hidden = rows.length - shown.length;
    const more = hidden > 0
      ? `<div class="more"><button type="button" onclick="toggleGroup('${key}')" aria-expanded="false">${preview === 0 ? '展開' : '還有'} ${hidden} 筆<svg class="icon" aria-hidden="true"><use href="#i-right"/></svg></button></div>`
      : (preview !== undefined && !focusKey && rows.length > preview
        ? `<div class="more"><button type="button" onclick="toggleGroup('${key}')" aria-expanded="true">收起<svg class="icon" style="transform:rotate(-90deg)" aria-hidden="true"><use href="#i-right"/></svg></button></div>` : '');
    return (label ? `<div class="sep ${key === 'overdue' ? 'overdue' : ''}"><span>${label}</span></div>` : '') + shown.map(noteRow).join('') + more;
  }).join('');
  updateBulkBar();
}

// ── 卡片總覽：一個時段一張卡，每張最多 3 筆，其餘點「看全部」才展開成列表 ──
const CARD_ITEMS = 3;
const CARD_MAIN = [['overdue', '過期'], ['today', '今天'], ['tomorrow', '明天'], ['week', '這七天']];
const CARD_MINI = [['later', '之後'], ['recur', '重複提醒'], ['none', '未排時間'], ['past', '已過日期']];
function cardTime(n, key) {
  const t = hm(n.due_date);
  const clock = t === '00:00' || t === '24:00' ? '' : t;
  if (key === 'today' || key === 'tomorrow') return clock || '整天';
  return mdw(n.due_date) + (clock ? ' ' + clock : '');
}
function cardItem(n, key) {
  const meta = [n.project ? esc(n.project) : '', n.due_date ? cardTime(n, key) : '', n.recur ? '重複' : ''].filter(Boolean).join('・');
  return `<div class="citem ${n.is_done ? 'done' : ''}" data-id="${esc(n.id)}">
    <button class="check" onclick="tapDone('${esc(n.id)}', ${!n.is_done})" aria-pressed="${!!n.is_done}" aria-label="${n.is_done ? '標為未完成' : '標為完成'}"><i><svg class="icon"><use href="#i-check"/></svg></i></button>
    <button type="button" class="ctext" onclick="rowClick('${esc(n.id)}')"><span class="ct">${esc(n.content)}</span>${meta ? `<span class="cm num">${meta}</span>` : ''}</button>
  </div>`;
}
function cardsHtml(groups) {
  const by = Object.fromEntries(groups.map(g => [g[0], g[2]]));
  const main = CARD_MAIN.filter(([key]) => (by[key] || []).length || key === 'today').map(([key, label]) => {
    const rows = by[key] || [];
    const more = rows.length - CARD_ITEMS;
    return `<section class="cgroup ${key}">
      <div class="chead"><span class="cname">${label}</span><span class="cnum num">${rows.length}</span>${more > 0 ? `<button type="button" class="cgo" onclick="toggleFocus('${key}')">看全部<svg class="icon" aria-hidden="true"><use href="#i-right"/></svg></button>` : ''}</div>
      ${rows.length ? rows.slice(0, CARD_ITEMS).map(n => cardItem(n, key)).join('') : '<p class="cempty">今天沒有排事情</p>'}
      ${more > 0 ? `<button type="button" class="cmore" onclick="toggleFocus('${key}')">還有 ${more} 筆</button>` : ''}
    </section>`;
  }).join('');
  const mini = CARD_MINI.filter(([key]) => (by[key] || []).length).map(([key, label]) =>
    `<button type="button" class="cmini" onclick="toggleFocus('${key}')"><span>${label}</span><b class="num">${by[key].length}</b><svg class="icon" aria-hidden="true"><use href="#i-right"/></svg></button>`).join('');
  return `<div class="cards">${main}</div>${mini ? `<div class="cminis">${mini}</div>` : ''}`;
}

// 實際畫在畫面上的那些列（「全選」只選看得到的，收起來的不算）
let renderedIds = [];
const expandedGroups = new Set();
const GROUP_PREVIEW = { week: 3, later: 3, past: 3, none: 3, recur: 0 };
function toggleGroup(key) {
  if (expandedGroups.has(key)) expandedGroups.delete(key); else expandedGroups.add(key);
  applyFilters();
}

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function hm(iso) { return new Date(iso).toLocaleTimeString('zh-TW', { timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', hour12: false }); }
function mdw(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('zh-TW', { timeZone: 'Asia/Taipei', month: 'numeric', day: 'numeric' }) +
    '（' + d.toLocaleDateString('zh-TW', { timeZone: 'Asia/Taipei', weekday: 'narrow' }) + '）';
}
function addDaysKey(key, n) { const d = new Date(key + 'T12:00:00+08:00'); d.setDate(d.getDate() + n); return taipeiKey(d.toISOString()); }

// 依到期時間分組（LINE 的日期膠囊）；已完成的收在最後、預設收起來
let showDoneGroup = false;
function groupByDue(items) {
  const now = Date.now(), today = todayKey(), tomorrow = addDaysKey(today, 1), weekEnd = addDaysKey(today, 7);
  const g = { overdue: [], today: [], tomorrow: [], week: [], later: [], recur: [], past: [], none: [], done: [] };
  items.forEach(n => {
    if (n.is_done) return g.done.push(n);
    if (!n.due_date) return g.none.push(n);
    const k = taipeiKey(n.due_date);
    if (new Date(n.due_date).getTime() < now) (isActionable(n) ? g.overdue : g.past).push(n);
    else if (k === today) g.today.push(n);
    else if (k === tomorrow) g.tomorrow.push(n);
    else if (n.recur) g.recur.push(n); // 每週／每月會重複的提醒，下次不是今明兩天就先收在一起，不跟這週的事混著
    else if (k <= weekEnd) g.week.push(n);
    else g.later.push(n);
  });
  const lab = (text, key) => `${text} ${g[key].length}`;
  return [['overdue', lab('過期', 'overdue'), g.overdue], ['today', lab('今天', 'today'), g.today], ['tomorrow', lab('明天', 'tomorrow'), g.tomorrow],
    ['week', lab('這七天', 'week'), g.week], ['later', lab('之後', 'later'), g.later], ['recur', lab('重複提醒', 'recur'), g.recur],
    ['past', lab('已過日期', 'past'), g.past], ['none', lab('未排時間', 'none'), g.none], ['done', '已完成', g.done]];
}
function isActionable(n) { return n.type === 'task' || n.type === 'reminder'; }
// 預設只看「該做的事」：像祕書的行程本，依時間排；筆記、專案更新、週報等要看再切到「全部類型」
const DEFAULT_TYPE = 'todo';
const DEFAULT_SORT = 'due_asc';
function matchesType(n, type) {
  if (!type) return true;
  if (type === 'todo') return isActionable(n);
  if (type === 'records') return !isActionable(n);
  return n.type === type;
}
// 四個「看哪一類」按鈕＝下面三個篩選欄位的預設組合；欄位被「篩選」改成別的組合時，按鈕都不亮
const SCOPES = {
  todo:    { type: 'todo',    done: '',     sort: 'due_asc' },
  records: { type: 'records', done: '',     sort: 'created_desc' },
  done:    { type: 'todo',    done: 'true', sort: 'created_desc' }, // 完成的只有待辦和提醒
  all:     { type: '',        done: '',     sort: 'created_desc' },
};
function setScope(key) {
  const sc = SCOPES[key];
  if (!sc) return;
  document.getElementById('filterType').value = sc.type;
  document.getElementById('filterDone').value = sc.done;
  document.getElementById('sortBy').value = sc.sort;
  activeProject = '';
  focusKey = '';
  renderStats();
  applyFilters();
}
function renderScopeTabs() {
  const cur = [document.getElementById('filterType').value, document.getElementById('filterDone').value, document.getElementById('sortBy').value].join('|');
  document.querySelectorAll('#scopeTabs .view-tab').forEach(b => {
    const sc = SCOPES[b.dataset.scope];
    const on = [sc.type, sc.done, sc.sort].join('|') === cur;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', String(on));
  });
}
function groupByCreated(items) {
  const today = todayKey(), yesterday = addDaysKey(today, -1), map = new Map();
  items.forEach(n => {
    const k = taipeiKey(n.created_at);
    const label = (k === today ? '今天' : k === yesterday ? '昨天' : mdw(n.created_at)) + '建立';
    if (!map.has(k)) map.set(k, [k, label, []]);
    map.get(k)[2].push(n);
  });
  return [...map.values()];
}

function noteRow(n) {
  let due = '';
  if (n.due_date) {
    const k = taipeiKey(n.due_date), today = todayKey();
    const day = k === today ? '今天' : k === addDaysKey(today, 1) ? '明天' : mdw(n.due_date);
    // 小時鐘：標明這是到期時間（照建立時間分組時才不會跟「今天建立」搞混）
    // 整天的項目（會議議程、只給日期的提醒）存成 00:00，顯示「00:00」會誤以為是半夜的事，所以不顯示時間
    const t = hm(n.due_date);
    due = `<svg class="icon due-ic" aria-label="到期"><use href="#i-clock"/></svg>${day}${t === '00:00' || t === '24:00' ? '' : ' ' + t}`;
    if (n.remind_lead_minutes != null) due += `・提前${formatLeadMinutes(n.remind_lead_minutes)}`;
    if (!n.is_done && isActionable(n) && new Date(n.due_date) < new Date()) due = `<span class="late">${due}</span>`;
  }
  // 類型看頭像就知道；最常見的「待辦」不再重複寫一次
  const sub = [n.project ? esc(n.project) : '', due, n.type === 'task' ? '' : TYPE_LABEL[n.type]].filter(Boolean).join('・') || TYPE_LABEL[n.type];
  // AI 改寫過的記錄，把你原本打的話也留一個入口可以對照。
  // 不然 AI 改壞了在後台完全看不出來。
  const rewritten = n.raw_text && n.content && n.raw_text !== n.content;
  const rawBlock = rewritten
    ? `<div class="raw-toggle" onclick="event.stopPropagation(); this.classList.toggle('open')">
         <span class="raw-label">看原話</span>
         <div class="raw-text">${esc(n.raw_text)}</div>
       </div>`
    : '';
  // 「完成」只有待辦和提醒才有意義；筆記、專案更新、週報不顯示完成圓圈，也不套已完成的灰色
  const doable = isActionable(n);
  return `<div class="row ${doable && n.is_done ? 'done' : ''}" data-id="${esc(n.id)}">
    <label class="sel" onclick="event.stopPropagation()"><input type="checkbox" class="rowCheck" ${selectedIds.has(n.id) ? 'checked' : ''} onchange="toggleSelect('${esc(n.id)}', this.checked)" aria-label="選取" /></label>
    <div class="row-main" role="button" tabindex="0" onclick="rowClick('${esc(n.id)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();rowClick('${esc(n.id)}')}">
      <span class="avatar ${esc(n.type)}" title="${TYPE_LABEL[n.type] || ''}"><svg class="icon"><use href="#i-${esc(n.type)}"/></svg></span>
      <span class="row-text"><span class="row-title">${esc(n.content)}</span><span class="row-sub num">${sub}</span>${rawBlock}</span>
    </div>
    ${doable && n.is_done ? '<span class="read">已完成</span>' : ''}
    ${doable ? `<button class="check" onclick="tapDone('${esc(n.id)}', ${!n.is_done})" aria-pressed="${!!n.is_done}" aria-label="${n.is_done ? '標為未完成' : '標為完成'}"><i><svg class="icon"><use href="#i-check"/></svg></i></button>` : ''}
  </div>`;
}

function rowClick(id) {

// 手機滑動列表時手指常落在右邊的圓圈上：剛捲動完 0.4 秒內的點擊不算完成
let lastScrollAt = 0;
document.addEventListener('scroll', () => { lastScrollAt = Date.now(); }, { passive: true, capture: true });
function tapDone(id, is_done) {

  toggleDone(id, is_done);

async function toggleDone(id, is_done, quiet) {
  const note = allNotes.find(n => n.id === id);
  // 先讓那一列變成已完成（像訊息變已讀），再沉到「已完成」群組
  const row = document.querySelector(`.row[data-id="${CSS.escape(String(id))}"], .citem[data-id="${CSS.escape(String(id))}"]`);
  if (row) row.classList.toggle('done', is_done);
  const res = await api('PATCH', { id, is_done });
  if (!res) { if (row) row.classList.toggle('done', !is_done); return; } // 沒存成功就退回原狀（api 已提示）
  if (note) note.is_done = is_done;
  renderStats();
  setTimeout(applyFilters, row && is_done && currentView === 'list' ? 420 : 0);
  if (!quiet && note) toast(is_done ? `已完成：${note.content}` : `已改回未完成：${note.content}`,
    { action: { label: '復原', run: () => toggleDone(id, !is_done, true) } });
}

// 刪除先從畫面拿掉，5 秒內可以按「復原」；時間到才真的刪
const pendingDeletes = new Map(); // id -> note
function deleteNotes(ids) {
  const removed = allNotes.filter(n => ids.includes(n.id));
  if (!removed.length) return;
  removed.forEach(n => pendingDeletes.set(n.id, n));
  allNotes = allNotes.filter(n => !ids.includes(n.id));
  ids.forEach(id => selectedIds.delete(id));
  if (ids.includes(editingNoteId)) closeEditModal();
  renderStats(); renderProjectTags(); applyFilters();
  if (currentView === 'calendar') { renderCalendar(); if (selectedKey) showDay(selectedKey); }
  const label = removed.length === 1 ? `已刪除：${removed[0].content}` : `已刪除 ${removed.length} 筆`;
  toast(label, {
    action: { label: '復原', run: () => {
      removed.forEach(n => pendingDeletes.delete(n.id));
      allNotes = allNotes.concat(removed);
      renderStats(); renderProjectTags(); applyFilters();
      if (currentView === 'calendar') { renderCalendar(); if (selectedKey) showDay(selectedKey); }
    } },
    onExpire: () => flushDeletes(),
  });
}
async function flushDeletes() {
  const ids = [...pendingDeletes.keys()];
  pendingDeletes.clear();
  for (const id of ids) {
    const res = await api('DELETE', { id });
    if (!res) { const reload = deleteReloads.get(id) || loadNotes; reload(); } // 沒刪成功就重新載入，讓那一筆回到畫面上
    deleteReloads.delete(id);
  }
}
// 詩歌、敬拜順序、會議記錄、收藏：一樣先拿掉、5 秒內可復原
const deleteReloads = new Map(); // id -> 刪除失敗時要重新載入的函式
function deleteItem(store, key, id, label) {
  const list = store[key];
  const idx = list.findIndex(n => n.id === id);
  if (idx < 0) return;
  const item = list[idx];
  list.splice(idx, 1);
  store.render();
  pendingDeletes.set(id, item);
  deleteReloads.set(id, () => store.load());
  const name = label || String(item.content || '').replace(/https?:\/\/\S+/g, '').replace(/^[#\s]+/, '').split('\n')[0].trim().slice(0, 30);
  toast(name ? `已刪除：${name}` : '已刪除', {
    action: { label: '復原', run: () => {
      pendingDeletes.delete(id); deleteReloads.delete(id);
      store[key].splice(Math.min(idx, store[key].length), 0, item);
      store.render();
    } },
    onExpire: () => flushDeletes(),
  });
}
// 關掉分頁時還沒送出的刪除也要送出去
window.addEventListener('pagehide', () => {
  for (const id of pendingDeletes.keys()) {
    fetch('/api/dashboard/notes', { method: 'DELETE', keepalive: true, headers: { 'Content-Type': 'application/json', 'x-dashboard-token': token }, body: JSON.stringify({ id }) });
  }
  pendingDeletes.clear();
});

async function bulkDone() {
  // 只有待辦和提醒能標完成；選到的筆記跳過
  const ids = [...selectedIds].filter(id => { const n = allNotes.find(x => x.id === id); return n && isActionable(n); });
  if (ids.length === 0) return toast('選到的都是筆記，沒有可以標完成的待辦或提醒');
  const results = await Promise.all(ids.map(id => api('PATCH', { id, is_done: true })));
  const ok = ids.filter((id, i) => results[i]);
  ok.forEach(id => { const n = allNotes.find(x => x.id === id); if (n) n.is_done = true; });
  setSelectMode(false);
  renderStats();
  applyFilters();
  if (ok.length) toast(`已完成 ${ok.length} 筆`, { action: { label: '復原', run: async () => {
    await Promise.all(ok.map(id => api('PATCH', { id, is_done: false })));
    ok.forEach(id => { const n = allNotes.find(x => x.id === id); if (n) n.is_done = false; });
    renderStats(); applyFilters();
  } } });
}

async function submitNote() {
  const content = document.getElementById('newContent').value.trim();
  const type = document.getElementById('newType').value;
  const project = document.getElementById('newProject').value.trim();
  const dueDateLocal = document.getElementById('newDueDate').value;
  const leadRaw = document.getElementById('newLeadValue').value;
  const leadUnit = Number(document.getElementById('newLeadUnit').value);

  const due_date = dueDateLocal ? new Date(dueDateLocal).toISOString() : null;
  const remind_lead_minutes = leadRaw === '' ? null : Number(leadRaw) * leadUnit;

  document.getElementById('editContent').value = note.content || '';

  document.getElementById('editProject').value = note.project || '';
  if (note.due_date) {
    const local = new Date(note.due_date);
    local.setMinutes(local.getMinutes() - local.getTimezoneOffset());
    document.getElementById('editDueDate').value = local.toISOString().slice(0,16);
    duePreview('editDueDate');
  } else {
    document.getElementById('editDueDate').value = '';
    duePreview('editDueDate');
  }
  const leadSplit = minutesToUnit(note.remind_lead_minutes);
  document.getElementById('editLeadValue').value = leadSplit.value;
  document.getElementById('editLeadUnit').value = leadSplit.unit;
  document.getElementById('editModal').classList.add('open');
  document.getElementById('editContent').focus();
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('open');
  editingNoteId = null;
}

async function saveEdit() {
  const content = document.getElementById('editContent').value.trim();
  const type = document.getElementById('editType').value;
  const project = document.getElementById('editProject').value.trim();
  const dueDateLocal = document.getElementById('editDueDate').value;
  const leadRaw = document.getElementById('editLeadValue').value;
  const leadUnit = Number(document.getElementById('editLeadUnit').value);
  if (!content) return toast('請填寫內容');
  const due_date = dueDateLocal ? new Date(dueDateLocal).toISOString() : null;
  const remind_lead_minutes = leadRaw === '' ? null : Number(leadRaw) * leadUnit;
  const updated = await api('PATCH', { id: editingNoteId, content, type, project, due_date, remind_lead_minutes });
  if (!updated) return;
  const idx = allNotes.findIndex(n => n.id === editingNoteId);
  if (idx !== -1) Object.assign(allNotes[idx], { content, type, project: project || null, due_date, remind_lead_minutes });
  closeEditModal();
  renderStats();
  renderProjectTags();
  updateProjectList();
  applyFilters();
}

// ---- 日曆檢視 ----
let currentView = 'list';
let calYear = null, calMonth = null; // calMonth: 0-based
let selectedKey = null;
let worshipByDate = {}; // service_date -> [{role, person_name}]

function taipeiKey(iso) {
  // 回傳 due_date 在台北時區的 YYYY-MM-DD
  return new Date(iso).toLocaleDateString('en-CA', { timeZone: 'Asia/Taipei' });
}
function todayKey() {
  return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Taipei' });
}
function pad2(n) { return String(n).padStart(2, '0'); }

function switchView(view) {
  currentView = view;
  document.getElementById('tabList').classList.toggle('active', view === 'list');
  document.getElementById('tabCalendar').classList.toggle('active', view === 'calendar');
  document.getElementById('listView').style.display = view === 'list' ? 'block' : 'none';
  document.getElementById('calendarView').style.display = view === 'calendar' ? 'block' : 'none';
  if (view === 'calendar') {
    if (calYear === null) {
      const [y, m] = todayKey().split('-').map(Number);
      calYear = y; calMonth = m - 1;
    }
    renderCalendar();
  }
}

function calShift(delta) {
  calMonth += delta;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  selectedKey = null;
  document.getElementById('dayDetail').style.display = 'none';
  renderCalendar();
}

// 日曆預設只顯示未完成的項目。翻回過去的月份時，東西大多已經完成，
// 整個月看起來會像空的（實測 6 月的 25 筆 task/reminder 全部已完成），
// 很容易誤以為資料不見了。這個開關讓過去的記錄也看得到。
let calShowDone = false;
function toggleCalDone(on) {
  calShowDone = !!on;
  renderCalendar();
}

function renderCalendar() {
  document.getElementById('calTitle').textContent = `${calYear} 年 ${calMonth + 1} 月`;

  // 把有 due_date 的事項歸到日期
  const byDay = {};
  allNotes.forEach(n => {
    if (!n.due_date) return;
    if (n.is_done && !calShowDone) return;
    if (n.type !== 'task' && n.type !== 'reminder') return;
    const key = taipeiKey(n.due_date);
    (byDay[key] = byDay[key] || []).push(n);
  });

  const grid = document.getElementById('calGrid');
  let html = ['日', '一', '二', '三', '四', '五', '六']
    .map(w => `<div class="cal-wd">${w}</div>`).join('');

  const firstWd = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const tk = todayKey();

  for (let i = 0; i < firstWd; i++) html += '<div class="cal-cell empty"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${calYear}-${pad2(calMonth + 1)}-${pad2(d)}`;
    const items = byDay[key] || [];
    const classes = ['cal-cell'];
    if (key === tk) classes.push('today');
    if (key === selectedKey) classes.push('selected');
    const reminders = items.filter(n => n.type === 'reminder').length;
    const tasks = items.filter(n => n.type === 'task').length;
    const hasWorship = !!worshipByDate[key];
    let dots = '';
    if (reminders) dots += '<span class="cal-dot reminder"></span>';
    if (tasks) dots += '<span class="cal-dot task"></span>';
    if (hasWorship) dots += '<span class="cal-dot worship"></span>';
    let countTxt = items.length ? `${items.length} 項` : '';
    if (hasWorship) countTxt = countTxt ? `${countTxt}・服事` : '服事';
    const count = countTxt ? `<div class="cal-count">${countTxt}</div>` : '';
    html += `<div class="${classes.join(' ')}" onclick="showDay('${key}')">
      <div class="cal-date">${d}</div>
      <div class="cal-dots">${dots}</div>${count}
    </div>`;
  }
  grid.innerHTML = html;
}

function showDay(key) {
  selectedKey = key;
  renderCalendar();
  const items = allNotes
    // 跟月曆格子用同一套過濾條件，不然點下去會跟格子上顯示的數量對不起來
    .filter(n => n.due_date && (!n.is_done || calShowDone) && (n.type === 'task' || n.type === 'reminder') && taipeiKey(n.due_date) === key)
    .sort((a, b) => new Date(a.due_date) - new Date(b.due_date));

  const dateLabel2 = new Date(`${key}T00:00:00+08:00`).toLocaleDateString('zh-TW', {
    timeZone: 'Asia/Taipei', month: 'long', day: 'numeric', weekday: 'long',
  });

  const worship = worshipByDate[key] || [];

  let html = `<h3>${dateLabel2}</h3>`;
  if (items.length === 0 && worship.length === 0) {
    html += '<div class="empty" style="padding:16px">這天沒有排定事項</div>';
  } else {
    html += items.map(n => {
      const time = new Date(n.due_date).toLocaleTimeString('zh-TW', { timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', hour12: false });
      return `<div class="day-item">
        <span class="dtime">${time}</span>
        <span class="type-badge ${TYPE_CLASS[n.type]}">${TYPE_LABEL[n.type]}</span>
        <span style="flex:1;min-width:0">${esc(n.content)}</span>
        ${n.project ? `<span style="color:var(--ink-2);font-size:13px">${esc(n.project)}</span>` : ''}
        <div class="actions">
          <button class="btn-sm btn-done" onclick="dayToggleDone('${n.id}')">完成</button>
          <button class="btn-sm btn-del" onclick="dayDeleteNote('${n.id}')">刪除</button>
        </div>
      </div>`;
    }).join('');

    if (worship.length) {
      const byRole = {};
      worship.forEach(w => { (byRole[w.role] = byRole[w.role] || []).push(w.person_name); });
      html += `<h3 style="margin-top:16px">主日服事</h3>`;
      html += Object.entries(byRole).map(([role, ppl]) => `<div class="day-item">
        <span class="type-badge" style="background:var(--blue-tint);color:var(--blue)">${esc(role)}</span>
        <span>${ppl.map(esc).join('、')}</span>
      </div>`).join('');
    }
  }
  const detail = document.getElementById('dayDetail');
  detail.innerHTML = html;
  detail.style.display = 'block';
}

// 把 YouTube 網址（watch/youtu.be/shorts/embed 都支援）轉成可嵌入的 embed 網址，不是 YouTube 就回傳 null
function youtubeEmbedUrl(url) {
  let u;
  try { u = new URL(url); } catch (e) { return null; }
  const host = u.hostname.replace(/^www\./, '');
  let id = null;
  if (host === 'youtu.be') {
    id = u.pathname.slice(1);
  } else if (host === 'youtube.com' || host === 'm.youtube.com') {
    if (u.pathname === '/watch') id = u.searchParams.get('v');
    else if (u.pathname.startsWith('/embed/')) id = u.pathname.split('/')[2];
    else if (u.pathname.startsWith('/shorts/')) id = u.pathname.split('/')[2];
  }
  return id ? `https://www.youtube.com/embed/${id}` : null;
}

// 跟 lib/commands.js 的 parseSongEntry 邏輯一致：第一行 tab 分欄（舊資料用空白分欄也讀得懂），其餘原文保留
const SONG_KEY_RE = /^[A-G][#b♯♭]?(?:m|maj|min|M|sus|add|dim|aug)?\d*(?:\/[A-G][#b♯♭]?)?$/; // 看起來像調性（D、Am、F#m、C/E）
const SONG_ENGLISH_WORD = /^[A-Za-z][A-Za-z'’.\-]*$/;
function parseSongEntry(content) {
  const [main, ...histParts] = String(content).replace(/^\s+/, '').split(/｜版本紀錄[:：]/);
  const history = histParts.join('｜版本紀錄:');
  const nl = main.indexOf('\n');
  const first = (nl === -1 ? main : main.slice(0, nl)).replace(/\r$/, '');
  const rest = nl === -1 ? '' : main.slice(nl + 1);
  if (!first.trim()) return { title: '', key: '', bpm: '', link: '', section: '', history };
  // 新格式：第一行用 tab 分欄，歌名可以有空白（例如「無人能比 Nothing Like You」）
  if (first.includes('\t')) {
    const [title = '', key = '', bpm = '', link = ''] = first.split('\t').map(s => s.trim());
    return { title, key, bpm, link, section: rest.trim(), history };
  }
  // 舊格式：空白分欄。歌名後面接的英文單字（不像調性的）算歌名的一部分；欄位只在第一行找，不會把下一行的段落當調性
  let pos = 0;
  const peek = () => { const m = /^[ \t]*(\S+)/.exec(first.slice(pos)); return m ? m[1] : ''; };
  const take = () => { const m = /^[ \t]*(\S+)/.exec(first.slice(pos)); if (!m) return ''; pos += m[0].length; return m[1]; };
  let title = take();
  while (SONG_ENGLISH_WORD.test(peek()) && !SONG_KEY_RE.test(peek())) title += ' ' + take();
  const key = take(), bpm = take(), link = take();
  const section = [first.slice(pos).trim(), rest.trim()].filter(Boolean).join('\n');
  return { title, key, bpm, link, section, history };
}

// 存檔用的第一行：用 tab 分欄，歌名有空白時一定要用 tab 才不會被拆開
function songHeader(title, key, bpm, link) {
  const arr = [title, key, bpm, link].map(s => String(s || '').replace(/[\t\r\n]+/g, ' ').trim());
  while (arr.length > 1 && !arr[arr.length - 1]) arr.pop();
  if (arr.length === 1) return /\s/.test(arr[0]) ? arr[0] + '\t' : arr[0];
  return arr.join('\t');
}
