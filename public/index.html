// ---- 會議記錄 ----
// 跟 lib/commands.js 的 extractActionItems 邏輯一致
function extractActionItems(content) {
  const items = [];
  content.split('\n').forEach((line) => {
    const m = line.match(/^\s*(?:待辦|待辦事項|todo|to-?do|行動項目|action)[:：]\s*(.+)$/i);
    if (m && m[1].trim()) items.push(m[1].trim());
  });
  return items;
}

// 跟 lib/commands.js 的 meetingTitle 對應：標題就是內容第一行
function meetingTitle(content) {
  const first = String(content || '').split('\n').map(s => s.trim()).find(Boolean);
  if (!first) return '';
  return first
    .replace(/^\d{1,2}\s*[/月]\s*\d{1,2}\s*日?[\s,，、:：-]*/, '')
    .replace(/[\s:：,，、。.-]+$/, '')
    .trim();
}

const Meetings = {
  items: [],
  actionItems: [],
  editingId: null,
  openCardId: null,

  async load() {
    const [mData, tData] = await Promise.all([
      getJSON(`/api/dashboard/notes?type=note&project=${encodeURIComponent('會議記錄')}&limit=200`),
      getJSON(`/api/dashboard/notes?type=task&project=${encodeURIComponent('會議記錄')}&limit=200`),
    ]);
    if (!mData || !tData) return;
    this.items = mData.sort((a, b) => new Date(b.due_date) - new Date(a.due_date));
    this.actionItems = tData;
    this.render();
  },

  render() {
    const list = document.getElementById('meetingsList');
    if (this.items.length === 0) {
      list.innerHTML = '<div class="empty">還沒有任何會議記錄</div>';
      return;
    }
    list.innerHTML = this.items.map(n => {
      const open = this.openCardId === n.id;
      const safe = (n.content || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      // 用建立時間相近（同一天）粗略歸屬待辦項目給該次會議
      const dayItems = this.actionItems.filter(t => dateKey(t.created_at) === dateKey(n.created_at));
      const itemsHtml = dayItems.map(t => `<div class="action-item ${t.is_done ? 'done' : ''}">
        <span>${(t.content || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</span>
        ${!t.is_done ? `<button class="btn-sm btn-done" onclick="Meetings.doneItem('${t.id}')">完成</button>` : ''}
        <button class="btn-sm btn-del" onclick="Meetings.delItem('${t.id}')">刪除</button>
      </div>`).join('');
      return `<div class="card">
        <div class="card-head" onclick="Meetings.toggleCard('${n.id}')">
          <span class="date">${dateLabel(n.due_date)}</span>
          ${meetingTitle(n.content) ? `<span class="meeting-title">${meetingTitle(n.content).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</span>` : ''}
          ${dayItems.length ? `<span class="tag">${dayItems.length} 個待辦</span>` : ''}
        </div>
        <div class="card-body ${open ? 'open' : ''}">
          <div class="content-pre">${safe}</div>
          ${itemsHtml}
          <div class="actions">
            <button class="btn-sm btn-edit" onclick="Meetings.openEdit('${n.id}')">編輯</button>
            <button class="btn-sm btn-del" onclick="Meetings.del('${n.id}')">刪除</button>
          </div>
        </div>
      </div>`;
    }).join('');
  },

  toggleCard(id) {
    this.openCardId = this.openCardId === id ? null : id;
    this.render();
  },

  openAdd() {
    this.editingId = null;
    document.getElementById('meetingsModalTitle').textContent = '新增會議記錄';
    document.getElementById('meetingsFDate').value = dateKey(new Date().toISOString());
    document.getElementById('meetingsFTitle').value = '';
    document.getElementById('meetingsFContent').value = '';
    document.getElementById('meetingsEditModal').classList.add('open');
  },

  openEdit(id) {
    const n = this.items.find(x => x.id === id);
    if (!n) return;
    this.editingId = id;
    document.getElementById('meetingsModalTitle').textContent = '編輯會議記錄';
    document.getElementById('meetingsFDate').value = dateKey(n.due_date);
    // 內容第一行就是標題，拆出來放標題格，剩下的留在內容格。
    // 這裡放「原始的」第一行，不套 meetingTitle 的清理（那是給顯示用的）——
    // 不然使用者只是開個編輯視窗按儲存，結尾的冒號就被默默改掉了。
    const lines = String(n.content || '').split('\n');
    const firstIdx = lines.findIndex(l => l.trim());
    document.getElementById('meetingsFTitle').value = firstIdx === -1 ? '' : lines[firstIdx].trim();
    document.getElementById('meetingsFContent').value = firstIdx === -1 ? '' : lines.slice(firstIdx + 1).join('\n').trim();
    document.getElementById('meetingsEditModal').classList.add('open');
  },

  closeModal() {
    document.getElementById('meetingsEditModal').classList.remove('open');
  },

  async save() {
    const dateStr = document.getElementById('meetingsFDate').value;
    const title = document.getElementById('meetingsFTitle').value.trim();
    const body = document.getElementById('meetingsFContent').value.trim();
    // 標題存成第一行，跟從 LINE 記錄的格式一致
    const content = [title, body].filter(Boolean).join('\n');
    if (!dateStr) return toast('請選擇日期');
    if (!content) return toast('請填寫標題或內容');
    const due_date = new Date(`${dateStr}T09:00:00+08:00`).toISOString();

    if (this.editingId) {
      const updated = await api('PATCH', { id: this.editingId, content, due_date });
      if (!updated) return;
      const idx = this.items.findIndex(n => n.id === this.editingId);
      if (idx !== -1) Object.assign(this.items[idx], { content, due_date });
    } else {
      const data = await api('POST', { type: 'note', project: '會議記錄', content, due_date });
      if (!data) return; // api 已經提示原因
      this.items.unshift(data);

      const actionTexts = extractActionItems(content);
      for (const it of actionTexts) {
        const task = await api('POST', { type: 'task', project: '會議記錄', content: it });
        if (task && !task.error) this.actionItems.push(task);
      }
    }
    this.items.sort((a, b) => new Date(b.due_date) - new Date(a.due_date));
    this.closeModal();
    this.render();
  },

  async del(id) {
    deleteItem(this, 'items', id);
  },

  async doneItem(id) {
    await api('PATCH', { id, is_done: true });
    const t = this.actionItems.find(x => x.id === id);
    if (t) t.is_done = true;
    this.render();
  },

  async delItem(id) {
    deleteItem(this, 'actionItems', id);
  },
};

// ---- 收藏連結 ----
function extractUrl(text) {
  const m = text.match(/https?:\/\/\S+/);
  return m ? m[0] : null;
}

const Album = {
  items: [],

  async load() {
    const json = await getJSON('/api/dashboard/album?limit=120');
    if (!json) return;
    this.items = (json && json.items) || [];
    this.render();
  },

  render() {
    const grid = document.getElementById('albumGrid');
    const empty = document.getElementById('albumEmpty');
    if (!this.items.length) {
      grid.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    grid.innerHTML = this.items.map(it => {
      const esc = s => (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      const when = new Date(it.created_at).toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit' });
      const label = it.project && it.project !== '相簿' ? `${it.project}・${when}` : when;
      // 簽名網址失效或檔案不見時，至少讓格子不要是破圖
      if (!it.url) {
        return `<div class="album-item"><div class="album-meta">${esc(label)}（圖片讀不到）</div>
          <button class="album-del" onclick="Album.remove('${it.id}')" title="刪除" aria-label="刪除"><svg class="icon"><use href="#i-close"/></svg></button></div>`;
      }
      return `<div class="album-item">
        <img src="${esc(it.url)}" alt="${esc(it.content)}" loading="lazy" onclick="Album.openLightbox('${esc(it.url)}')" />
        <div class="album-meta">${esc(label)}</div>
        <button class="album-del" onclick="Album.remove('${it.id}')" title="刪除" aria-label="刪除"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>`;
    }).join('');
  },

  openLightbox(url) {
    document.getElementById('lightboxImg').src = url;
    document.getElementById('albumLightbox').style.display = 'flex';
  },

  closeLightbox() {
    document.getElementById('albumLightbox').style.display = 'none';
    document.getElementById('lightboxImg').src = '';
  },

  // 跟其他刪除一樣：先從畫面拿掉，5 秒內可以「復原」，時間到才真的刪圖檔
  remove(id) {
    const idx = this.items.findIndex(i => i.id === id);
    if (idx < 0) return;
    const item = this.items[idx];
    this.items.splice(idx, 1);
    this.closeLightbox();
    this.render();
    toast('已刪除這張圖片', {
      action: { label: '復原', run: () => { this.items.splice(Math.min(idx, this.items.length), 0, item); this.render(); } },
      onExpire: async () => {
        let res = null;
        try { res = await fetch(`/api/dashboard/album?id=${encodeURIComponent(id)}`, { method: 'DELETE', headers: { 'x-dashboard-token': token }, keepalive: true }); } catch (e) { /* 下面一起處理 */ }
        if (!res || !res.ok) { toastErr(res ? '圖片沒有刪成功，已放回相簿' : '連不上伺服器，圖片沒有刪掉'); this.load(); }
      },
    });
  },
};

const Links = {
  items: [],
  filter: 'active',
  titleCache: {}, // url -> 抓到的網頁標題（或 null 代表抓不到），同一個網址一個 session 只抓一次

  async load() {
    const data = await getJSON(`/api/dashboard/notes?type=note&project=${encodeURIComponent('收藏')}&limit=200`);
    if (!data) return;
    this.items = data;
    this.render();
  },

  setFilter(f) {
    this.filter = f;
    ['active', 'done', 'all'].forEach(k => document.getElementById('linksTab' + k[0].toUpperCase() + k.slice(1)).classList.toggle('active', k === f));
    this.render();
  },

  render() {
    const list = document.getElementById('linksList');
    const filtered = this.items.filter(n => this.filter === 'all' ? true : this.filter === 'done' ? n.is_done : !n.is_done);
    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty">沒有收藏的連結</div>';
      return;
    }
    list.innerHTML = filtered.map(n => {
      const url = extractUrl(n.content || '');
      const created = new Date(n.created_at).toLocaleDateString('zh-TW', { timeZone: 'Asia/Taipei' });
      const safe = (n.content || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const title = url ? this.titleCache[url] : null;
      const escTitle = title ? title.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') : null;
      const escUrl = url ? url.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') : '';
      const body = url
        ? `<a href="${url}" target="_blank" rel="noopener">${escTitle || escUrl}</a>` + (escTitle ? `<div class="meta" style="margin-top:2px">${escUrl}</div>` : '')
        : `<span>${safe}</span>`;
      return `<div class="card ${n.is_done ? 'done' : ''}">
        <div class="content">${body}<div class="meta">收藏於 ${created}</div></div>
        <button class="btn-sm btn-archive" onclick="Links.toggleDone('${n.id}', ${!n.is_done})">${n.is_done ? '取消封存' : '封存'}</button>
        <button class="btn-sm btn-del" onclick="Links.del('${n.id}')">刪除</button>
      </div>`;
    }).join('');

    // 背景抓還沒快取過標題的連結，抓到後重新渲染一次換成可讀標題
    const urls = [...new Set(filtered.map(n => extractUrl(n.content || '')).filter(Boolean))];
    this.fetchTitlesFor(urls).then((fetchedAny) => { if (fetchedAny) this.render(); });
  },

  async fetchTitlesFor(urls) {
    const missing = urls.filter(u => !(u in this.titleCache));
    if (missing.length === 0) return false;
    await Promise.all(missing.map(async (u) => {
      try {
        const res = await fetch(`/api/unfurl?url=${encodeURIComponent(u)}`, { headers: { 'x-dashboard-token': token } });
        const data = await res.json();
        this.titleCache[u] = (data && data.title) || null;
      } catch (e) {
        this.titleCache[u] = null;
      }
    }));
    return true;
  },

  async add() {
    const input = document.getElementById('linksNewInput');
    const content = input.value.trim();
    if (!content) return;
    const data = await api('POST', { type: 'note', project: '收藏', content, is_done: false });
    if (!data) return; // api 已經提示原因
    this.items.unshift(data);
    input.value = '';
    this.render();
  },

  async toggleDone(id, is_done) {
    await api('PATCH', { id, is_done });
    const n = this.items.find(x => x.id === id);
    if (n) n.is_done = is_done;
    this.render();
  },

  async del(id) {
    deleteItem(this, 'items', id);
  },
};

// 面板打開時記下表單內容；按 Esc 或點背景時如果改過，先提醒、不直接關掉，免得改到一半不見
function formSnap(m) { return [...m.querySelectorAll('input, textarea, select')].map(el => el.type === 'checkbox' ? el.checked : el.value).join('\u0001'); }
document.querySelectorAll('.modal-bg').forEach(m => new MutationObserver(() => {
  if (m.classList.contains('open') && !m.dataset.opened) { m.dataset.opened = '1'; setTimeout(() => { m.dataset.snap = formSnap(m); }, 0); }
  else if (!m.classList.contains('open')) { delete m.dataset.opened; delete m.dataset.snap; }
}).observe(m, { attributes: true, attributeFilter: ['class'] }));
function softClose(m) {
  if (m.dataset.snap !== undefined && formSnap(m) !== m.dataset.snap) {
    toast('還沒儲存，要放棄這些修改嗎？', { ms: 6000, action: { label: '放棄修改', run: () => m.classList.remove('open') } });
    return;
  }
  m.classList.remove('open');
}
// 面板：按 Esc 或點背景關閉
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-bg.open').forEach(softClose);
    if (selectMode) setSelectMode(false);
    return;
  }
  // 快捷鍵：/ 搜尋、n 跟小秘書說一句話（正在打字時不觸發）
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
  if (typing || e.metaKey || e.ctrlKey || e.altKey || currentTab !== 'dashboard') return;
  if (e.key === '/') { e.preventDefault(); switchView('list'); document.getElementById('search').focus(); }
  if (e.key === 'n') { e.preventDefault(); document.getElementById('composerInput').focus(); }
});
document.querySelectorAll('.modal-bg').forEach(m => m.addEventListener('click', e => { if (e.target === m) softClose(m); }));
// 有實體鍵盤的電腦上，把快捷鍵寫在輸入框裡
if (matchMedia('(hover: hover) and (pointer: fine)').matches) {
  document.getElementById('composerInput').placeholder = '跟小秘書說一句話…（按 n）';
  document.getElementById('search').placeholder = '搜尋內容或專案（按 /）';
}
