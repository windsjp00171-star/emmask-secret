<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmmArk 小秘書 Dashboard</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1f6f54">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="小秘書">
  <style>
    :root {
      --bg: #f4f6f4;
      --surface: #ffffff;
      --ink: #1b2420;
      --muted: #6b7670;
      --line: #e7ebe8;
      --brand: #1f6f54;
      --brand-ink: #16513d;
      --brand-soft: #e8f2ed;
      --gold: #c2922f;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(20,40,30,.05), 0 6px 20px rgba(20,40,30,.05);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; font-size: 15px; line-height: 1.6; }
    header { background: linear-gradient(135deg, #1b4536, #14352a); color: #fff; padding: 18px 28px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; box-shadow: 0 2px 12px rgba(20,40,30,.12); }
    header h1 { font-size: 18px; font-weight: 700; letter-spacing: .3px; display: flex; align-items: center; gap: 8px; }
    header span { font-size: 13px; color: rgba(255,255,255,.55); }
    .container { max-width: 1120px; margin: 0 auto; padding: 28px 20px 64px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 28px; }
    .stat-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 16px; text-align: center; box-shadow: var(--shadow); transition: transform .12s, box-shadow .12s; }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(20,40,30,.09); }
    .stat-card .num { font-size: 34px; font-weight: 800; color: var(--brand); line-height: 1; }
    .stat-card .label { font-size: 12px; color: var(--muted); margin-top: 8px; letter-spacing: .3px; }
    .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .filters select, .filters input { padding: 9px 13px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; background: var(--surface); color: var(--ink); }
    .filters input { flex: 1; min-width: 160px; }
    select:focus, input:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(31,111,84,.15); }
    .btn { padding: 9px 18px; border-radius: 10px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; transition: filter .12s, transform .05s; }
    .btn:hover { filter: brightness(.95); }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-sm { padding: 5px 11px; font-size: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
    .btn-done { background: #2e9d63; color: #fff; }
    .btn-del { background: #e5544b; color: #fff; }
    .btn-undone { background: #e8912f; color: #fff; }
    table { width: 100%; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); border-collapse: separate; border-spacing: 0; overflow: hidden; border: 1px solid var(--line); }
    th { background: #f3f6f4; padding: 15px 18px; text-align: left; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .4px; }
    td { padding: 17px 18px; border-top: 1px solid var(--line); font-size: 14.5px; line-height: 1.65; vertical-align: middle; }
    td[data-label="內容"] { white-space: pre-wrap; }
    tbody tr:hover td { background: #f7faf8; }
    .type-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
    .type-task { background: #fff1d6; color: #9a6a12; }
    .type-reminder { background: #fde0e0; color: #b3322a; }
    .type-note { background: #d8eef0; color: #1d6b73; }
    .type-project_update { background: #d9efe2; color: #1c7a4d; }
    .done-row td { opacity: 0.4; text-decoration: line-through; }
    .done-row:hover td { opacity: 0.6; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    @media (max-width: 760px) {
      table, tbody, tr, td { display: block; width: 100%; }
      thead { display: none; }
      table { border: none; box-shadow: none; background: transparent; overflow: visible; }
      tbody tr { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 14px; padding: 6px 4px; }
      tbody tr:hover td { background: transparent; }
      td { border: none; border-top: 1px solid var(--line); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: right; font-size: 14.5px; line-height: 1.6; overflow-wrap: anywhere; }
      td:first-child { border-top: none; }
      td::before { content: attr(data-label); font-size: 12px; font-weight: 700; color: var(--muted); text-align: left; flex-shrink: 0; }
      td[data-label="操作"] .actions { justify-content: flex-end; }
    }
    @media (min-width: 761px) {
      #listView table { table-layout: fixed; }
      #listView th, #listView td { word-break: break-word; overflow-wrap: anywhere; white-space: normal; vertical-align: top; }
      #listView td[data-label="內容"] { white-space: pre-wrap; }
      #listView th:nth-child(1), #listView td:nth-child(1) { width: 36px; }
      #listView th:nth-child(2), #listView td:nth-child(2) { width: 40%; }
      #listView th:nth-child(3), #listView td:nth-child(3) { width: 72px; }
      #listView th:nth-child(4), #listView td:nth-child(4) { width: 12%; }
      #listView th:nth-child(5), #listView td:nth-child(5) { width: 108px; }
      #listView th:nth-child(6), #listView td:nth-child(6) { width: 88px; }
      #listView th:nth-child(7), #listView td:nth-child(7) { width: 158px; }
    }
    #login { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(160deg, #1b4536, #0f2b22); }
    .login-box { background: var(--surface); border-radius: 20px; padding: 44px 40px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.3); min-width: 300px; }
    .login-box h2 { margin-bottom: 8px; color: var(--brand-ink); }
    .login-box p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
    .login-box input { width: 100%; padding: 13px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; margin-bottom: 14px; }
    .login-box button { width: 100%; padding: 13px; background: var(--brand); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
    .login-box button:hover { filter: brightness(.95); }
    #main { display: none; }
    .project-tags { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 20px; }
    .project-tag { padding: 6px 14px; background: var(--surface); border-radius: 20px; font-size: 13px; cursor: pointer; border: 1px solid var(--line); color: var(--muted); transition: all .12s; }
    .project-tag:hover { border-color: var(--brand); color: var(--brand); }
    .project-tag.active { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-ink); font-weight: 600; }
    .empty { text-align: center; color: var(--muted); padding: 48px; font-size: 15px; }
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(15,30,25,.5); backdrop-filter: blur(2px); z-index: 100; align-items: center; justify-content: center; }
    .modal-bg.open { display: flex; }
    .modal { background: var(--surface); border-radius: 18px; padding: 28px; width: 100%; max-width: 460px; margin: 16px; box-shadow: 0 24px 60px rgba(0,0,0,.25); }
    .modal h3 { margin-bottom: 20px; font-size: 18px; color: var(--brand-ink); }
    .modal label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; margin-top: 14px; font-weight: 500; }
    .modal input, .modal select, .modal textarea { width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; font-family: inherit; }
    .modal textarea { resize: vertical; min-height: 80px; }
    .modal-actions { display: flex; gap: 8px; margin-top: 22px; justify-content: flex-end; }
    .btn-cancel { background: #eceeec; color: var(--ink); }
    .btn-edit { background: #5a6f66; color: #fff; }
    .view-tabs { display: flex; gap: 6px; margin-bottom: 18px; background: #e9ece9; padding: 4px; border-radius: 12px; width: fit-content; }
    .view-tab { padding: 8px 20px; border-radius: 9px; border: none; background: transparent; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--muted); transition: all .12s; }
    .view-tab.active { background: var(--surface); color: var(--brand-ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .cal-head { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 18px; }
    .cal-head h2 { font-size: 18px; font-weight: 700; min-width: 150px; text-align: center; color: var(--brand-ink); }
    .cal-nav { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 16px; color: var(--brand); }
    .cal-nav:hover { background: var(--brand-soft); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; background: var(--surface); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); border: 1px solid var(--line); }
    .cal-wd { text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); padding: 4px 0; }
    .cal-cell { min-height: 68px; border-radius: 10px; padding: 7px; cursor: pointer; border: 1px solid var(--line); position: relative; transition: background .12s; }
    .cal-cell:hover { background: var(--brand-soft); }
    .cal-cell.empty { background: transparent; border-color: transparent; cursor: default; }
    .cal-cell.today { border-color: var(--brand); background: var(--brand-soft); }
    .cal-cell.today .cal-date { color: var(--brand-ink); font-weight: 700; }
    .cal-cell.selected { background: var(--brand); border-color: var(--brand); }
    .cal-cell.selected .cal-date, .cal-cell.selected .cal-count { color: #fff; }
    .cal-date { font-size: 13px; color: var(--ink); font-weight: 500; }
    .cal-dots { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 6px; }
    .cal-dot { width: 7px; height: 7px; border-radius: 50%; }
    .cal-dot.reminder { background: #e5544b; }
    .cal-dot.task { background: #e8912f; }
    .cal-dot.worship { background: var(--brand); }
    .cal-count { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .day-detail { background: var(--surface); border-radius: var(--radius); padding: 18px 22px; margin-top: 16px; box-shadow: var(--shadow); border: 1px solid var(--line); }
    .day-detail h3 { font-size: 15px; margin-bottom: 12px; color: var(--brand-ink); }
    .day-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
    .day-item:first-of-type { border-top: none; }
    .day-item .dtime { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 44px; }
    .day-item .dbadge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
  </style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <h2>EmmArk 小秘書</h2>
    <p>請輸入 Dashboard 密碼</p>
    <input type="password" id="tokenInput" placeholder="DASHBOARD_TOKEN" />
    <button onclick="doLogin()">進入</button>
  </div>
</div>

<div class="modal-bg" id="editModal">
  <div class="modal">
    <h3>編輯記錄</h3>
    <label>內容 *</label>
    <textarea id="editContent" style="resize:vertical;min-height:80px"></textarea>
    <label>類型 *</label>
    <select id="editType">
      <option value="task">待辦</option>
      <option value="reminder">提醒</option>
      <option value="note">筆記</option>
      <option value="project_update">專案更新</option>
    </select>
    <label>專案（可留空）</label>
    <input type="text" id="editProject" list="projectList" />
    <label>到期時間（可留空）</label>
    <input type="datetime-local" id="editDueDate" />
    <label>提前多久提醒（可留空＝用系統預設5分鐘）</label>
    <div style="display:flex;gap:8px">
      <input type="number" id="editLeadValue" min="0" placeholder="例如 1" style="flex:1" />
      <select id="editLeadUnit" style="width:100px">
        <option value="1">分鐘</option>
        <option value="60">小時</option>
        <option value="1440">天</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeEditModal()">取消</button>
      <button class="btn btn-primary" onclick="saveEdit()">儲存</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="addModal">
  <div class="modal">
    <h3>新增記錄</h3>
    <label>內容 *</label>
    <textarea id="newContent" placeholder="要記錄的事..."></textarea>
    <label>類型 *</label>
    <select id="newType">
      <option value="task">待辦</option>
      <option value="reminder">提醒</option>
      <option value="note">筆記</option>
      <option value="project_update">專案更新</option>
    </select>
    <label>專案（可留空）</label>
    <input type="text" id="newProject" placeholder="Cell Reporter" list="projectList" />
    <datalist id="projectList"></datalist>
    <label>到期時間（可留空）</label>
    <input type="datetime-local" id="newDueDate" />
    <label>提前多久提醒（可留空＝用系統預設5分鐘）</label>
    <div style="display:flex;gap:8px">
      <input type="number" id="newLeadValue" min="0" placeholder="例如 1" style="flex:1" />
      <select id="newLeadUnit" style="width:100px">
        <option value="1">分鐘</option>
        <option value="60">小時</option>
        <option value="1440">天</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="submitNote()">新增</button>
    </div>
  </div>
</div>

<div id="main">
  <header>
    <h1>EmmArk 小秘書 Dashboard</h1>
    <a id="worshipLink" href="#" onclick="goPage('worship.html')" style="color:#98989d;font-size:13px;text-decoration:none;margin-right:12px">⛪ 服事表</a>
    <a href="#" onclick="goPage('songs.html')" style="color:#98989d;font-size:13px;text-decoration:none;margin-right:12px">🎼 詩歌庫</a>
    <a href="#" onclick="goPage('order.html')" style="color:#98989d;font-size:13px;text-decoration:none;margin-right:12px">🎵 敬拜順序</a>
    <a href="#" onclick="goPage('meetings.html')" style="color:#98989d;font-size:13px;text-decoration:none;margin-right:12px">📝 會議記錄</a>
    <a href="#" onclick="goPage('links.html')" style="color:#98989d;font-size:13px;text-decoration:none;margin-right:12px">🔗 收藏</a>
    <span id="lastRefresh"></span>
  </header>
  <div class="container">
    <div class="stats" id="stats"></div>
    <div class="view-tabs">
      <button class="view-tab active" id="tabList" onclick="switchView('list')">📋 列表</button>
      <button class="view-tab" id="tabCalendar" onclick="switchView('calendar')">📅 日曆</button>
    </div>
    <div id="listView">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div class="project-tags" id="projectTags" style="margin-bottom:0"></div>
      <button class="btn btn-primary" onclick="openModal()">＋ 新增記錄</button>
    </div>
    <div class="filters">
      <select id="filterType" onchange="applyFilters()">
        <option value="">全部類型</option>
        <option value="task">待辦</option>
        <option value="reminder">提醒</option>
        <option value="note">筆記</option>
        <option value="project_update">專案更新</option>
      </select>
      <select id="filterDone" onchange="applyFilters()">
        <option value="">全部狀態</option>
        <option value="false">未完成</option>
        <option value="true">已完成</option>
      </select>
      <input type="text" id="search" placeholder="搜尋..." oninput="applyFilters()" />
      <select id="sortBy" onchange="applyFilters()">
        <option value="created_desc">建立時間（新→舊）</option>
        <option value="created_asc">建立時間（舊→新）</option>
        <option value="due_asc">到期時間（近→遠）</option>
        <option value="due_desc">到期時間（遠→近）</option>
        <option value="content_asc">內容（A→Z）</option>
      </select>
    </div>
    <div id="bulkBar" style="display:none;align-items:center;gap:8px;margin-bottom:12px;background:var(--brand-soft);border:1px solid var(--brand);border-radius:10px;padding:10px 14px;">
      <span id="bulkCount" style="font-weight:600;color:var(--brand-ink);flex:1"></span>
      <button class="btn-sm btn-done" onclick="bulkDone()">批次完成</button>
      <button class="btn-sm btn-edit" onclick="bulkSetProject()">改專案</button>
      <button class="btn-sm btn-del" onclick="bulkDelete()">批次刪除</button>
      <button class="btn-sm btn-cancel" onclick="clearSelection()">取消選取</button>
    </div>
    <table>
      <thead>
        <tr>
          <th style="width:36px"><input type="checkbox" id="selectAllBox" onchange="toggleSelectAll(this.checked)" /></th>
          <th>內容</th>
          <th>類型</th>
          <th>專案</th>
          <th>時間</th>
          <th>記錄於</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    </div><!-- /listView -->
    <div id="calendarView" style="display:none">
      <div class="cal-head">
        <button class="cal-nav" onclick="calShift(-1)">‹</button>
        <h2 id="calTitle"></h2>
        <button class="cal-nav" onclick="calShift(1)">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="day-detail" id="dayDetail" style="display:none"></div>
    </div>
  </div>
</div>

<script>
let token = '';
let allNotes = [];
let activeProject = '';
let selectedIds = new Set();

const TYPE_LABEL = { task: '待辦', reminder: '提醒', note: '筆記', project_update: '專案更新' };
const TYPE_CLASS = { task: 'type-task', reminder: 'type-reminder', note: 'type-note', project_update: 'type-project_update' };

function formatLeadMinutes(min) {
  if (min % 1440 === 0) return `${min / 1440}天`;
  if (min % 60 === 0) return `${min / 60}小時`;
  return `${min}分鐘`;
}

// 把分鐘數拆成「數值＋單位」給下拉選單用（挑最大能整除的單位）
function minutesToUnit(min) {
  if (min == null) return { value: '', unit: 1 };
  if (min % 1440 === 0) return { value: min / 1440, unit: 1440 };
  if (min % 60 === 0) return { value: min / 60, unit: 60 };
  return { value: min, unit: 1 };
}

function doLogin() {
  token = document.getElementById('tokenInput').value.trim();
  if (!token) return alert('請輸入密碼');
  localStorage.setItem('dashboardToken', token);
  loadNotes();
}

// 記住密碼：網址帶 token（頁面互跳）或之前登入存過的 token，都自動略過登入畫面
async function tryStoredLogin() {
  const saved = new URLSearchParams(location.search).get('token') || localStorage.getItem('dashboardToken');
  if (!saved) return;
  document.getElementById('login').style.display = 'none'; // 先隱藏，避免驗證期間閃一下登入畫面
  const res = await fetch(`/api/dashboard/notes?limit=1`, { headers: { 'x-dashboard-token': saved } });
  if (res.status === 401) {
    localStorage.removeItem('dashboardToken');
    document.getElementById('login').style.display = 'flex'; // 驗證失敗才顯示登入畫面
    return;
  }
  token = saved;
  localStorage.setItem('dashboardToken', token);
  loadNotes();
}
tryStoredLogin();

async function api(method, body) {
  const res = await fetch(`/api/dashboard/notes`, {
    method,
    headers: { 'Content-Type': 'application/json', 'x-dashboard-token': token },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { alert('密碼錯誤'); return null; }
  return res.json();
}

async function loadNotes() {
  if (!token) return; // 還沒登入時，不要讓自動刷新的 60 秒計時器一直跳密碼錯誤
  const data = await api('GET');
  if (!data) return;
  allNotes = data;

  // 一併載入主日服事表，疊進月曆
  worshipByDate = {};
  try {
    const wres = await fetch(`/api/worship/schedule`, { headers: { 'x-dashboard-token': token } });
    if (wres.ok) {
      const wd = await wres.json();
      (wd || []).forEach(w => { (worshipByDate[w.service_date] = worshipByDate[w.service_date] || []).push(w); });
    }
  } catch (e) { /* 服事表載入失敗不影響其他功能 */ }

  document.getElementById('login').style.display = 'none';
  document.getElementById('main').style.display = 'block';
  document.getElementById('lastRefresh').textContent = '更新：' + new Date().toLocaleTimeString('zh-TW');
  renderStats();
  renderProjectTags();
  updateProjectList();
  applyFilters();
  if (currentView === 'calendar') {
    renderCalendar();
    if (selectedKey) showDay(selectedKey);
  }
}

function renderStats() {
  const total = allNotes.length;
  const done = allNotes.filter(n => n.is_done).length;
  const pending = allNotes.filter(n => !n.is_done && (n.type === 'task' || n.type === 'reminder')).length;
  const rate = total ? Math.round(done / allNotes.filter(n => n.type === 'task' || n.type === 'reminder').length * 100) || 0 : 0;
  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="num">${total}</div><div class="label">總記錄數</div></div>
    <div class="stat-card"><div class="num">${pending}</div><div class="label">未完成待辦</div></div>
    <div class="stat-card"><div class="num">${done}</div><div class="label">已完成</div></div>
    <div class="stat-card"><div class="num">${rate}%</div><div class="label">完成率</div></div>
  `;
}

function renderProjectTags() {
  const projects = [...new Set(allNotes.map(n => n.project).filter(Boolean))];
  const container = document.getElementById('projectTags');
  container.innerHTML = `<span class="project-tag ${activeProject === '' ? 'active' : ''}" onclick="setProject('')">全部</span>` +
    projects.map(p => `<span class="project-tag ${activeProject === p ? 'active' : ''}" onclick="setProject('${p}')">${p}</span>`).join('');
}

function setProject(p) {
  activeProject = p;
  renderProjectTags();
  applyFilters();
}

function sortNotes(items, sortBy) {
  const byDue = (a, b, dir) => {
    if (!a.due_date && !b.due_date) return 0;
    if (!a.due_date) return 1; // 沒有到期時間的排最後
    if (!b.due_date) return -1;
    return dir * (new Date(a.due_date) - new Date(b.due_date));
  };
  const sorted = items.slice();
  if (sortBy === 'created_asc') sorted.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  else if (sortBy === 'due_asc') sorted.sort((a, b) => byDue(a, b, 1));
  else if (sortBy === 'due_desc') sorted.sort((a, b) => byDue(a, b, -1));
  else if (sortBy === 'content_asc') sorted.sort((a, b) => (a.content || '').localeCompare(b.content || '', 'zh-TW'));
  else sorted.sort((a, b) => new Date(b.created_at) - new Date(a.created_at)); // created_desc（預設）
  return sorted;
}

function applyFilters() {
  const type = document.getElementById('filterType').value;
  const done = document.getElementById('filterDone').value;
  const search = document.getElementById('search').value.toLowerCase();

  let filtered = allNotes.filter(n => {
    if (type && n.type !== type) return false;
    if (done !== '' && String(n.is_done) !== done) return false;
    if (activeProject && n.project !== activeProject) return false;
    if (search && !n.content.toLowerCase().includes(search) && !(n.project || '').toLowerCase().includes(search)) return false;
    return true;
  });
  filtered = sortNotes(filtered, document.getElementById('sortBy').value);

  const tbody = document.getElementById('tableBody');
  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">沒有符合的記錄</td></tr>';
    updateBulkBar();
    return;
  }

  tbody.innerHTML = filtered.map(n => {
    const due = n.due_date ? new Date(n.due_date).toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }) : '-';
    const leadTxt = n.due_date && n.remind_lead_minutes != null ? `<br><span style="font-size:11px;color:var(--muted)">提前${formatLeadMinutes(n.remind_lead_minutes)}</span>` : '';
    const dueWithLead = due + leadTxt;
    const created = new Date(n.created_at).toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
    const doneBtn = n.is_done
      ? `<button class="btn-sm btn-undone" onclick="toggleDone('${n.id}', false)">撤銷</button>`
      : `<button class="btn-sm btn-done" onclick="toggleDone('${n.id}', true)">完成</button>`;
    const safeContent = (n.content || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const checked = selectedIds.has(n.id) ? 'checked' : '';
    return `<tr class="${n.is_done ? 'done-row' : ''}">
      <td data-label="選取"><input type="checkbox" class="rowCheck" ${checked} onchange="toggleSelect('${n.id}', this.checked)" /></td>
      <td data-label="內容">${safeContent}</td>
      <td data-label="類型"><span class="type-badge ${TYPE_CLASS[n.type]}">${TYPE_LABEL[n.type]}</span></td>
      <td data-label="專案">${n.project || '-'}</td>
      <td data-label="到期">${dueWithLead}</td>
      <td data-label="建立">${created}</td>
      <td data-label="操作"><div class="actions">${doneBtn}<button class="btn-sm btn-edit" onclick="openEditModal('${n.id}')">編輯</button><button class="btn-sm btn-del" onclick="deleteNote('${n.id}')">刪除</button></div></td>
    </tr>`;
  }).join('');
  updateBulkBar();
}

async function toggleDone(id, is_done) {
  await api('PATCH', { id, is_done });
  const note = allNotes.find(n => n.id === id);
  if (note) note.is_done = is_done;
  renderStats();
  applyFilters();
}

async function deleteNote(id) {
  if (!confirm('確定刪除？')) return;
  await api('DELETE', { id });
  allNotes = allNotes.filter(n => n.id !== id);
  renderStats();
  renderProjectTags();
  applyFilters();
}

// ---- 批次選取操作 ----
function toggleSelect(id, checked) {
  if (checked) selectedIds.add(id); else selectedIds.delete(id);
  updateBulkBar();
}

function toggleSelectAll(checked) {
  getShownIds().forEach(id => { if (checked) selectedIds.add(id); else selectedIds.delete(id); });
  applyFilters();
}

function getShownIds() {
  const type = document.getElementById('filterType').value;
  const done = document.getElementById('filterDone').value;
  const search = document.getElementById('search').value.toLowerCase();
  return allNotes.filter(n => {
    if (type && n.type !== type) return false;
    if (done !== '' && String(n.is_done) !== done) return false;
    if (activeProject && n.project !== activeProject) return false;
    if (search && !n.content.toLowerCase().includes(search) && !(n.project || '').toLowerCase().includes(search)) return false;
    return true;
  }).map(n => n.id);
}

function clearSelection() {
  selectedIds.clear();
  applyFilters();
}

function updateBulkBar() {
  const bar = document.getElementById('bulkBar');
  const selectAllBox = document.getElementById('selectAllBox');
  if (selectedIds.size === 0) {
    bar.style.display = 'none';
    if (selectAllBox) selectAllBox.checked = false;
    return;
  }
  bar.style.display = 'flex';
  document.getElementById('bulkCount').textContent = `已選 ${selectedIds.size} 筆`;
  if (selectAllBox) {
    const shown = getShownIds();
    selectAllBox.checked = shown.length > 0 && shown.every(id => selectedIds.has(id));
  }
}

async function bulkDone() {
  const ids = [...selectedIds];
  if (ids.length === 0) return;
  if (!confirm(`確定將這 ${ids.length} 筆標記為完成？`)) return;
  await Promise.all(ids.map(id => api('PATCH', { id, is_done: true })));
  ids.forEach(id => { const n = allNotes.find(x => x.id === id); if (n) n.is_done = true; });
  clearSelection();
  renderStats();
  applyFilters();
}

async function bulkDelete() {
  const ids = [...selectedIds];
  if (ids.length === 0) return;
  if (!confirm(`確定刪除這 ${ids.length} 筆？無法復原。`)) return;
  await Promise.all(ids.map(id => api('DELETE', { id })));
  allNotes = allNotes.filter(n => !selectedIds.has(n.id));
  clearSelection();
  renderStats();
  renderProjectTags();
  applyFilters();
}

async function bulkSetProject() {
  const ids = [...selectedIds];
  if (ids.length === 0) return;
  const project = prompt(`把這 ${ids.length} 筆改成哪個專案？（留空＝清空專案）`);
  if (project === null) return;
  await Promise.all(ids.map(id => api('PATCH', { id, project })));
  ids.forEach(id => { const n = allNotes.find(x => x.id === id); if (n) n.project = project || null; });
  clearSelection();
  renderProjectTags();
  updateProjectList();
  applyFilters();
}

function openModal() {
  document.getElementById('newContent').value = '';
  document.getElementById('newType').value = 'task';
  document.getElementById('newProject').value = '';
  document.getElementById('newDueDate').value = '';
  document.getElementById('newLeadValue').value = '';
  document.getElementById('newLeadUnit').value = '1';
  document.getElementById('addModal').classList.add('open');
  document.getElementById('newContent').focus();
}

function closeModal() {
  document.getElementById('addModal').classList.remove('open');
}

async function submitNote() {
  const content = document.getElementById('newContent').value.trim();
  const type = document.getElementById('newType').value;
  const project = document.getElementById('newProject').value.trim();
  const dueDateLocal = document.getElementById('newDueDate').value;
  const leadRaw = document.getElementById('newLeadValue').value;
  const leadUnit = Number(document.getElementById('newLeadUnit').value);
  if (!content) return alert('請填寫內容');
  const due_date = dueDateLocal ? new Date(dueDateLocal).toISOString() : null;
  const remind_lead_minutes = leadRaw === '' ? null : Number(leadRaw) * leadUnit;
  const res = await fetch(`/api/dashboard/notes`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-dashboard-token': token },
    body: JSON.stringify({ type, project, content, due_date, remind_lead_minutes }),
  });
  if (res.status === 401) { alert('密碼錯誤'); return; }
  const data = await res.json();
  if (data.error) { alert('錯誤：' + data.error); return; }
  allNotes.unshift(data);
  closeModal();
  renderStats();
  renderProjectTags();
  applyFilters();
}

// Update datalist when projects change
function updateProjectList() {
  const projects = [...new Set(allNotes.map(n => n.project).filter(Boolean))];
  document.getElementById('projectList').innerHTML = projects.map(p => `<option value="${p}">`).join('');
}

let editingNoteId = null;

function openEditModal(id) {
  const note = allNotes.find(n => n.id === id);
  if (!note) return;
  editingNoteId = id;
  document.getElementById('editContent').value = note.content || '';
  document.getElementById('editType').value = note.type;
  document.getElementById('editProject').value = note.project || '';
  if (note.due_date) {
    const local = new Date(note.due_date);
    local.setMinutes(local.getMinutes() - local.getTimezoneOffset());
    document.getElementById('editDueDate').value = local.toISOString().slice(0,16);
  } else {
    document.getElementById('editDueDate').value = '';
  }
  const leadSplit = minutesToUnit(note.remind_lead_minutes);
  document.getElementById('editLeadValue').value = leadSplit.value;
  document.getElementById('editLeadUnit').value = leadSplit.unit;
  document.getElementById('editModal').classList.add('open');
  document.getElementById('editContent').focus();
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('open');
  editingNoteId = null;
}

async function saveEdit() {
  const content = document.getElementById('editContent').value.trim();
  const type = document.getElementById('editType').value;
  const project = document.getElementById('editProject').value.trim();
  const dueDateLocal = document.getElementById('editDueDate').value;
  const leadRaw = document.getElementById('editLeadValue').value;
  const leadUnit = Number(document.getElementById('editLeadUnit').value);
  if (!content) return alert('請填寫內容');
  const due_date = dueDateLocal ? new Date(dueDateLocal).toISOString() : null;
  const remind_lead_minutes = leadRaw === '' ? null : Number(leadRaw) * leadUnit;
  const updated = await api('PATCH', { id: editingNoteId, content, type, project, due_date, remind_lead_minutes });
  if (!updated) return;
  const idx = allNotes.findIndex(n => n.id === editingNoteId);
  if (idx !== -1) Object.assign(allNotes[idx], { content, type, project: project || null, due_date, remind_lead_minutes });
  closeEditModal();
  renderStats();
  renderProjectTags();
  updateProjectList();
  applyFilters();
}

// ---- 日曆檢視 ----
let currentView = 'list';
let calYear = null, calMonth = null; // calMonth: 0-based
let selectedKey = null;
let worshipByDate = {}; // service_date -> [{role, person_name}]

function taipeiKey(iso) {
  // 回傳 due_date 在台北時區的 YYYY-MM-DD
  return new Date(iso).toLocaleDateString('en-CA', { timeZone: 'Asia/Taipei' });
}
function todayKey() {
  return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Taipei' });
}
function pad2(n) { return String(n).padStart(2, '0'); }

function switchView(view) {
  currentView = view;
  document.getElementById('tabList').classList.toggle('active', view === 'list');
  document.getElementById('tabCalendar').classList.toggle('active', view === 'calendar');
  document.getElementById('listView').style.display = view === 'list' ? 'block' : 'none';
  document.getElementById('calendarView').style.display = view === 'calendar' ? 'block' : 'none';
  if (view === 'calendar') {
    if (calYear === null) {
      const [y, m] = todayKey().split('-').map(Number);
      calYear = y; calMonth = m - 1;
    }
    renderCalendar();
  }
}

function calShift(delta) {
  calMonth += delta;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  selectedKey = null;
  document.getElementById('dayDetail').style.display = 'none';
  renderCalendar();
}

function renderCalendar() {
  document.getElementById('calTitle').textContent = `${calYear} 年 ${calMonth + 1} 月`;

  // 把有 due_date 的事項歸到日期
  const byDay = {};
  allNotes.forEach(n => {
    if (!n.due_date || n.is_done) return;
    if (n.type !== 'task' && n.type !== 'reminder') return;
    const key = taipeiKey(n.due_date);
    (byDay[key] = byDay[key] || []).push(n);
  });

  const grid = document.getElementById('calGrid');
  let html = ['日', '一', '二', '三', '四', '五', '六']
    .map(w => `<div class="cal-wd">${w}</div>`).join('');

  const firstWd = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const tk = todayKey();

  for (let i = 0; i < firstWd; i++) html += '<div class="cal-cell empty"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${calYear}-${pad2(calMonth + 1)}-${pad2(d)}`;
    const items = byDay[key] || [];
    const classes = ['cal-cell'];
    if (key === tk) classes.push('today');
    if (key === selectedKey) classes.push('selected');
    const reminders = items.filter(n => n.type === 'reminder').length;
    const tasks = items.filter(n => n.type === 'task').length;
    const hasWorship = !!worshipByDate[key];
    let dots = '';
    if (reminders) dots += '<span class="cal-dot reminder"></span>';
    if (tasks) dots += '<span class="cal-dot task"></span>';
    if (hasWorship) dots += '<span class="cal-dot worship"></span>';
    let countTxt = items.length ? `${items.length} 項` : '';
    if (hasWorship) countTxt = countTxt ? `${countTxt} ⛪` : '⛪ 服事';
    const count = countTxt ? `<div class="cal-count">${countTxt}</div>` : '';
    html += `<div class="${classes.join(' ')}" onclick="showDay('${key}')">
      <div class="cal-date">${d}</div>
      <div class="cal-dots">${dots}</div>${count}
    </div>`;
  }
  grid.innerHTML = html;
}

function showDay(key) {
  selectedKey = key;
  renderCalendar();
  const items = allNotes
    .filter(n => n.due_date && !n.is_done && (n.type === 'task' || n.type === 'reminder') && taipeiKey(n.due_date) === key)
    .sort((a, b) => new Date(a.due_date) - new Date(b.due_date));

  const dateLabel = new Date(`${key}T00:00:00+08:00`).toLocaleDateString('zh-TW', {
    timeZone: 'Asia/Taipei', month: 'long', day: 'numeric', weekday: 'long',
  });

  const worship = worshipByDate[key] || [];

  let html = `<h3>${dateLabel}</h3>`;
  if (items.length === 0 && worship.length === 0) {
    html += '<div class="empty" style="padding:16px">這天沒有排定事項</div>';
  } else {
    html += items.map(n => {
      const time = new Date(n.due_date).toLocaleTimeString('zh-TW', { timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', hour12: false });
      return `<div class="day-item">
        <span class="dtime">${time}</span>
        <span class="type-badge ${TYPE_CLASS[n.type]}">${TYPE_LABEL[n.type]}</span>
        <span style="flex:1">${n.content}</span>
        ${n.project ? `<span style="color:#6e6e73;font-size:12px">· ${n.project}</span>` : ''}
        <div class="actions">
          <button class="btn-sm btn-done" onclick="dayToggleDone('${n.id}')">完成</button>
          <button class="btn-sm btn-del" onclick="dayDeleteNote('${n.id}')">刪除</button>
        </div>
      </div>`;
    }).join('');

    if (worship.length) {
      const byRole = {};
      worship.forEach(w => { (byRole[w.role] = byRole[w.role] || []).push(w.person_name); });
      html += `<h3 style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">⛪ 主日服事</h3>`;
      html += Object.entries(byRole).map(([role, ppl]) => `<div class="day-item">
        <span class="type-badge" style="background:var(--brand-soft);color:var(--brand-ink)">${role}</span>
        <span>${ppl.join('、')}</span>
      </div>`).join('');
    }
  }
  const detail = document.getElementById('dayDetail');
  detail.innerHTML = html;
  detail.style.display = 'block';
}

async function dayToggleDone(id) {
  await toggleDone(id, true);
  if (selectedKey) showDay(selectedKey);
}

async function dayDeleteNote(id) {
  await deleteNote(id);
  if (selectedKey) showDay(selectedKey);
}
