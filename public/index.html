<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>EmmArk 小秘書 Dashboard</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#f0f2f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="小秘書">
  <link rel="stylesheet" href="/app.css">
  <style>
    #main { display: none; }
    /* 總覽：一行摘要，不做大數字卡片 */
    .overview { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .stats { display: flex; flex-wrap: wrap; gap: 6px; }
    @media (max-width: 600px) {
      .stat-pill { height: 28px; padding: 0 10px; font-size: 12px; }
      .stat-pill b { font-size: 14px; }
      .overview { flex-wrap: nowrap; }
    }
    .stat-pill { display: inline-flex; align-items: baseline; gap: 6px; height: 30px; padding: 0 12px; border-radius: 9999px; background: var(--fill); font-size: 13px; color: var(--ink-2); }
    .stat-pill b { font-size: 15px; color: var(--ink); font-weight: 700; }
    .stat-pill.late { background: var(--red-tint); color: var(--red); }
    .stat-pill.late b { color: var(--red); }
    .trunc-warn { background: var(--amber-tint); color: var(--amber); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; }
    /* 列表／日曆切換 */
    /* 專案膠囊 */
    .list-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .project-tags { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
    .project-tags::-webkit-scrollbar { display: none; }
    .project-tag { border: none; flex: none; height: 32px; padding: 0 14px; border-radius: 16px; background: var(--fill); font-size: 14px; color: var(--ink); white-space: nowrap; cursor: pointer; display: inline-flex; align-items: center; }
    .project-tag:hover { background: var(--fill-hover); }
    .project-tag.active { background: var(--ink); color: var(--on-ink); }
    .filters { margin-bottom: 10px; }
    .filter-row { display: flex; gap: 6px; align-items: center; }
    .filter-row input[type=search] { flex: 1; min-width: 0; height: 38px; min-height: 38px; border-radius: 9999px; padding: 0 14px; font-size: 14px; }
    .chip-btn { flex: none; position: relative; height: 38px; padding: 0 12px; border-radius: 9999px; border: none; background: var(--fill); color: var(--ink); font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    .chip-btn:hover { background: var(--fill-hover); }
    .project-pick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .chip-btn .icon { width: 16px; height: 16px; }
    .chip-btn[aria-expanded="true"], .chip-btn[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
    .chip-btn .dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
    .filter-panel { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-end; margin-top: 8px; padding: 12px; }
    .filter-panel[hidden] { display: none; }
    .filter-panel label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--ink-2); flex: 1 1 140px; }
    .filter-panel select { height: 38px; min-height: 38px; border-radius: 10px; font-size: 14px; }
    .select-all { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    /* 選取模式：批次列浮在輸入列上方 */
    #bulkBar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 45; width: min(868px, calc(100% - 24px)); display: none; align-items: center; gap: 6px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 6px 24px rgba(0,0,0,.14); border-radius: 9999px; padding: 6px 6px 6px 14px; }
    body.selecting #bulkBar { display: flex; }
    body.selecting .composer { display: none; }
    body.selecting #bulkBar { bottom: calc(16px + env(safe-area-inset-bottom)); }
    #bulkCount { font-weight: 700; flex: 1; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #bulkBar .btn-sm { background: var(--fill); color: var(--ink); }
    #bulkBar .btn-sm:hover { background: var(--fill-hover); }
    #bulkBar .btn-del { background: var(--red-tint); color: var(--red); }
    #bulkBar .btn-done { background: var(--green-btn); color: #fff; }
    /* LINE 聊天列表式的記錄列 */
    .note-list { padding: 4px 0; }
    .note-list .row + .row { background-image: linear-gradient(var(--line), var(--line)); background-repeat: no-repeat; background-size: calc(100% - 98px) 1px; background-position: 98px 0; }
    .note-list .row:first-child { border-radius: 16px 16px 0 0; }
    .note-list .row:last-child { border-radius: 0 0 16px 16px; }
    .row { display: flex; align-items: center; gap: 10px; padding: 6px 4px 6px 12px; transition: background-color .16s var(--ease); }
    .row:hover { background: var(--row-hover); }
    .row .sel { flex: none; width: 24px; display: none; justify-content: center; }
    body.selecting .row .sel { display: inline-flex; }
    body.selecting .row .check { visibility: hidden; }
    .row-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; cursor: pointer; border-radius: 8px; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; flex: none; display: inline-flex; align-items: center; justify-content: center; }
    .avatar.task { background: var(--task-bg); color: var(--task-ink); }
    .duty { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 12px; margin-bottom: 8px; color: inherit; text-decoration: none; font-size: 14px; }
    .duty-text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .duty-text b { font-weight: 600; }
    .duty-text span { color: var(--ink-2); margin-left: 6px; }
    .duty[hidden] { display: none; }
    .due-preview { font-size: 13px; color: var(--ink-2); margin-top: 4px; min-height: 0; }
    .due-preview:empty { display: none; }
    .duty-av { width: 28px; height: 28px; background: var(--fill); color: var(--ink); }
    .duty-av .icon { width: 16px; height: 16px; }
    .duty-go { width: 18px; height: 18px; color: var(--ink-3); flex: none; }
    @media (hover: hover) { .duty:hover { background: var(--row-hover); } }
    .avatar.reminder { background: var(--amber-tint); color: var(--amber); }
    .avatar.note { background: var(--blue-tint); color: var(--blue); }
    .avatar.project_update { background: var(--purple-tint); color: var(--purple); }
    .row-text { flex: 1; min-width: 0; }
    .row-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 15px; font-weight: 600; line-height: 1.35; word-break: break-word; white-space: pre-wrap; }
    .row-sub { display: block; font-size: 13px; color: var(--ink-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-sub .late { color: var(--red); font-weight: 600; }
    .row .read { flex: none; font-size: 12px; font-weight: 600; color: var(--green-ink); }
    .check { width: 44px; height: 44px; flex: none; display: inline-flex; align-items: center; justify-content: center; border: none; background: none; cursor: pointer; border-radius: 50%; }
    @media (min-width: 800px) { .check { width: 40px; height: 40px; } }
    .check i { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--ring); display: inline-flex; align-items: center; justify-content: center; color: #fff; transition: background-color .16s var(--ease), border-color .16s var(--ease); }
    .check i svg { width: 14px; height: 14px; stroke-width: 3; opacity: 0; transition: opacity .16s var(--ease); }
    .check:hover i { border-color: var(--green-btn); }
    .row.done .check i { background: var(--green-btn); border-color: var(--green-btn); }
    .row.done .check i svg { opacity: 1; }
    .row.done .row-title { color: var(--ink-3); font-weight: 400; }
    .row.done .avatar { filter: grayscale(1); opacity: .55; }
    .raw-toggle { margin-top: 4px; cursor: pointer; }
    .raw-label { display: inline-block; font-size: 12px; color: var(--ink-2); background: var(--fill); border-radius: 10px; padding: 1px 8px; }
    .raw-text { display: none; margin-top: 6px; padding: 8px 10px; background: var(--fill); border-radius: 8px; font-size: 13px; color: var(--ink-2); white-space: pre-wrap; word-break: break-word; }
    .raw-toggle.open .raw-text { display: block; }
    /* 日曆 */
    .cal-head { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 10px; }
    .cal-head h2 { font-size: 17px; font-weight: 700; min-width: 140px; text-align: center; }
    .cal-nav { width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--fill); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); }
    .cal-nav:hover { background: var(--fill-hover); }
    .cal-showdone-row { text-align: center; margin: 0 0 10px; }
    .cal-showdone { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 13px; color: var(--ink-2); cursor: pointer; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 8px; }
    .cal-wd { text-align: center; font-size: 12px; font-weight: 600; color: var(--ink-3); padding: 4px 0; }
    .cal-cell { min-height: 64px; border-radius: 10px; padding: 6px; cursor: pointer; position: relative; }
    .cal-cell:hover { background: var(--fill); }
    .cal-cell.empty { cursor: default; background: none; }
    .cal-cell.today .cal-date { background: var(--ink); color: var(--on-ink); }
    .cal-cell.selected { background: var(--fill); box-shadow: inset 0 0 0 2px var(--ink); }
    .cal-date { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; border-radius: 12px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .cal-dots { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 4px; padding-left: 4px; }
    .cal-dot { width: 6px; height: 6px; border-radius: 50%; }
    .cal-dot.reminder { background: var(--amber); }
    .cal-dot.task { background: var(--task-ink); }
    .cal-dot.worship { background: var(--blue); }
    .cal-count { font-size: 11px; color: var(--ink-2); margin-top: 2px; padding-left: 4px; }
    .day-detail { margin-top: 12px; padding: 8px 16px; }
    .day-detail h3 { font-size: 15px; font-weight: 700; margin: 8px 0; }
    .day-item:last-child { border-bottom: none; }
    .day-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; flex-wrap: wrap; }
    .day-item .dtime { font-variant-numeric: tabular-nums; color: var(--ink-2); min-width: 44px; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .type-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
    .type-task { background: var(--task-bg); color: var(--task-ink); }
    .type-reminder { background: var(--amber-tint); color: var(--amber); }
    .type-note { background: var(--blue-tint); color: var(--blue); }
    .type-project_update { background: var(--purple-tint); color: var(--purple); }
    /* 詩歌庫／敬拜順序／會議記錄／收藏：扁平列表，不做卡片 */
    .toolbar { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .toolbar input { flex: 1; }
    .add-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .add-row input { flex: 1; }
    .link-filters { display: flex; gap: 6px; margin-bottom: 6px; }
    .list-panel:empty { display: none; }
    .list-panel { padding: 0 16px; }
    .list-panel .card:last-child { border-bottom: none; }
    .card { border-bottom: 1px solid var(--line); padding: 12px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .card.done { opacity: .55; }
    .card-head { flex: 1 1 100%; display: flex; align-items: center; gap: 10px; cursor: pointer; min-height: 32px; }
    .card-head .title { font-weight: 600; flex: 1; min-width: 0; }
    .card-head .date { font-weight: 700; flex: none; font-variant-numeric: tabular-nums; }
    .card-head .meeting-title { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-head .tag { font-size: 12px; color: var(--ink-2); background: var(--fill); padding: 2px 8px; border-radius: 10px; margin-left: auto; flex: none; }
    .card-body { display: none; flex: 1 1 100%; padding-top: 8px; }
    .card-body.open { display: block; }
    .lyrics, .content-pre { white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; font-size: 14px; line-height: 1.6; margin-bottom: 10px; }
    .history { font-size: 13px; color: var(--ink-2); margin-bottom: 10px; }
    .action-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 14px; }
    .action-item.done { opacity: .5; }
    .action-item span { flex: 1; }
    .card .content { flex: 1; min-width: 0; word-break: break-word; }
    .card a { color: var(--blue); font-weight: 600; text-decoration: none; }
    .card a:hover { text-decoration: underline; }
    .card .meta { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
    #orderFContent, #meetingsFContent { min-height: 220px; }
    #orderFContent { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
    #songsFSection { min-height: 120px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    /* 相簿 */
    .album-hint { color: var(--ink-2); font-size: 14px; margin: 0 0 12px; }
    .album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 4px; }
    .album-item { position: relative; border-radius: 8px; overflow: hidden; background: var(--fill); aspect-ratio: 1; }
    .album-item img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
    .album-item .album-meta { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 8px 6px; background: linear-gradient(transparent, rgba(0,0,0,.6)); color: #fff; font-size: 12px; }
    .album-item .album-del { position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; border: none; border-radius: 50%; background: rgba(0,0,0,.5); color: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .album-item .album-del:hover { background: var(--red); }
    .album-item .album-del .icon { width: 16px; height: 16px; }
    .album-empty { color: var(--ink-2); text-align: center; padding: 48px 16px; }
    .lightbox { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.88); display: flex; align-items: center; justify-content: center; padding: 20px; cursor: zoom-out; }
    .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
    /* 底部輸入列：跟 LINE 一樣打一句話就送出 */
    .composer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; pointer-events: none; }
    .composer-inner { pointer-events: auto; max-width: 900px; margin: 0 auto; display: flex; align-items: center; gap: 6px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); }
    @media (min-width: 900px) { .composer-inner { border: 1px solid var(--line); border-bottom: none; border-radius: 16px 16px 0 0; background: var(--surface); } }
    .composer-input { flex: 1; min-width: 0; height: 44px; min-height: 44px; border-radius: 9999px !important; padding: 0 16px !important; font-size: 15px; background: var(--fill); }
    .icon-btn { width: 44px; height: 44px; flex: none; border: none; background: none; border-radius: 50%; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .icon-btn:hover { background: var(--fill); }
    .send { width: 44px; height: 44px; flex: none; border: none; border-radius: 50%; background: var(--green-btn); color: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .send:hover { background: var(--green-press); }
    .send:disabled { background: var(--fill-hover); color: var(--ink-3); cursor: default; }
    .send.busy { opacity: .6; }
    body.no-composer .composer { display: none; }
  </style>
</head>

<div id="login">
  <div class="login-box">
    <h2>EmmArk 小秘書</h2>
    <p>請輸入 Dashboard 密碼</p>
    <input type="password" id="tokenInput" placeholder="密碼" aria-label="Dashboard 密碼" onkeydown="if(event.key==='Enter')doLogin()" />
    <button onclick="doLogin()">進入</button>
  </div>
</div>

<div class="modal-bg" id="editModal">
  <div class="modal">
    <h3>編輯記錄</h3>
    <label>內容 *</label>
    <textarea id="editContent" style="resize:vertical;min-height:80px"></textarea>
    <label>類型 *</label>
    <select id="editType">
      <option value="task">待辦</option>
      <option value="reminder">提醒</option>
      <option value="note">筆記</option>
      <option value="project_update">專案更新</option>
    </select>
    <label>專案（可留空）</label>
    <input type="text" id="editProject" list="projectList" />
    <label>到期時間（可留空）</label>
    <input type="datetime-local" id="editDueDate" lang="zh-Hant-TW" oninput="duePreview('editDueDate')" />
    <div class="due-preview num" id="editDueDatePreview"></div>
    <label>提前多久提醒（預設 5 分鐘）</label>
    <div style="display:flex;gap:8px">
      <input type="number" id="editLeadValue" min="0" placeholder="例如 5" style="flex:1" />
      <select id="editLeadUnit" style="width:100px">
        <option value="1">分鐘</option>
        <option value="60">小時</option>
        <option value="1440">天</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-text-danger" onclick="deleteNote(editingNoteId)">刪除</button>
      <button class="btn btn-cancel" onclick="closeEditModal()">取消</button>
      <button class="btn btn-primary" onclick="saveEdit()">儲存</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="addModal">
  <div class="modal">
    <h3>新增記錄</h3>
    <label>內容 *</label>
    <textarea id="newContent" placeholder="要記錄的事..."></textarea>
    <label>類型 *</label>
    <select id="newType">
      <option value="task">待辦</option>
      <option value="reminder">提醒</option>
      <option value="note">筆記</option>
      <option value="project_update">專案更新</option>
    </select>
    <label>專案（可留空）</label>
    <input type="text" id="newProject" placeholder="Cell Reporter" list="projectList" />
    <datalist id="projectList"></datalist>
    <label>到期時間（可留空）</label>
    <input type="datetime-local" id="newDueDate" lang="zh-Hant-TW" oninput="duePreview('newDueDate')" />
    <div class="due-preview num" id="newDueDatePreview"></div>
    <label>提前多久提醒（預設 5 分鐘）</label>
    <div style="display:flex;gap:8px">
      <input type="number" id="newLeadValue" min="0" placeholder="例如 5" style="flex:1" />
      <select id="newLeadUnit" style="width:100px">
        <option value="1">分鐘</option>
        <option value="60">小時</option>
        <option value="1440">天</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="submitNote()">新增</button>
    </div>
  </div>

<script>
let token = '';
let allNotes = [];
let activeProject = '';
let selectedIds = new Set();

const TYPE_LABEL = { task: '待辦', reminder: '提醒', note: '筆記', project_update: '專案更新' };
const TYPE_CLASS = { task: 'type-task', reminder: 'type-reminder', note: 'type-note', project_update: 'type-project_update' };

// ---- 分頁籤切換（取代原本 5 個獨立頁面互跳，共用同一個登入 session） ----
const TABS = ['dashboard', 'songs', 'order', 'meetings', 'links', 'album'];
let currentTab = 'dashboard';
const loadedTabs = new Set(['dashboard']);
let hashTabApplied = false;

function switchTab(name) {
  if (!TABS.includes(name)) name = 'dashboard';
  currentTab = name;
  TABS.forEach(t => {
    document.getElementById('panel-' + t).style.display = t === name ? 'block' : 'none';
    document.getElementById('tabBtn-' + t).classList.toggle('active', t === name);
  });
  // 相簿只能從 LINE 傳圖進來，後台沒有「新增」這個動作，所以把 ＋ 收起來
  // 輸入列只在待辦分頁出現；其他分頁用各自的新增按鈕
  document.body.classList.toggle('no-composer', name !== 'dashboard');
  if (name !== 'dashboard') setSelectMode(false);

  // 相簿的圖片網址是簽出來的、一小時後會失效，
  // 所以每次切過來都重新抓，不做快取
  if (name === 'album') { Album.load(); return; }

  if (!loadedTabs.has(name)) {
    loadedTabs.add(name);
    if (name === 'songs') Songs.load();
    else if (name === 'order') Order.load();
    else if (name === 'meetings') Meetings.load();
    else if (name === 'links') Links.load();
  }
}

// ---- 提示（可帶「復原」） ----
let toastTimer = null;
let toastExpire = null; // 被下一則提示蓋掉時也要執行（例如送出延後的刪除）
function toast(msg, opts = {}) {
  hideToast();
  toastExpire = opts.onExpire || null;
  const el = document.getElementById('toast');
  const btn = document.getElementById('toastAction');
  document.getElementById('toastText').textContent = msg;
  el.classList.toggle('error', !!opts.error);
  btn.hidden = !opts.action;
  btn.textContent = opts.action ? opts.action.label : '';
  btn.onclick = opts.action ? () => { hideToast(true); opts.action.run(); } : null;
  el.hidden = false;
  toastTimer = setTimeout(() => hideToast(), opts.ms || (opts.action ? 5000 : 3000));
}
function toastErr(msg) { toast(msg, { error: true }); }
function hideToast(undone) {
  clearTimeout(toastTimer);
  document.getElementById('toast').hidden = true;
  const f = toastExpire; toastExpire = null;
  if (f && !undone) f();
}

// ---- 輸入列：跟 LINE 一樣打一句話就送出（同一套 AI 分類與指令） ----
async function sendText() {
  const input = document.getElementById('composerInput');
  const btn = document.getElementById('sendBtn');
  const text = input.value.trim();
  if (!text || btn.classList.contains('busy')) return;
  btn.classList.add('busy'); btn.disabled = true;
  const data = await api('POST', { text });
  btn.classList.remove('busy');
  if (!data) { btn.disabled = false; return; }
  input.value = '';
  const msg = (data.reply || '收到了') + (data.needs_line ? '\n（這一步要到 LINE 按「確定」才會生效）' : '');
  const before = new Set(allNotes.map(n => n.id));
  toast(msg, { ms: 6000 });
  await loadNotes();
  // 這句話新建了記錄（AI 分錯類也一樣）就給「復原」；查詢類的話不會有新記錄
  const added = allNotes.filter(n => !before.has(n.id)).map(n => n.id);
  if (added.length) toast(msg, { ms: 6000, action: { label: '復原', run: () => deleteNotes(added) } });
}

// 待辦上方一列「下一次服事」，點了到服事表；沒排到或沒設定名字就不顯示
async function loadNextDuty() {
  const el = document.getElementById('nextDuty');
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const from = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
  let rows = null;
  try {
    const res = await fetch(`/api/worship/schedule?mine=1&from=${from}`, { headers: { 'x-dashboard-token': token } });
    if (res.ok) rows = await res.json();
  } catch (e) { /* 服事表讀不到不影響待辦 */ }
  if (!Array.isArray(rows) || !rows.length) { el.hidden = true; return; }
  const date = rows[0].service_date;
  const roles = [...new Set(rows.filter(r => r.service_date === date).map(r => r.role))];
  const d = new Date(date + 'T00:00:00');
  const days = Math.round((d - today) / 86400000);
  const when = days === 0 ? '今天' : days === 1 ? '明天' : `${d.getMonth() + 1}/${d.getDate()}（${'日一二三四五六'[d.getDay()]}）`;
  document.getElementById('nextDutyTitle').textContent = `下一次服事：${when}`;
  document.getElementById('nextDutySub').textContent = roles.join('、');
  el.hidden = false;
}

// 日期欄位的顯示格式跟著瀏覽器語系走（可能出現 AM/PM），下面再用中文寫一次
function duePreview(id) {
  const v = document.getElementById(id).value;
  const out = document.getElementById(id + 'Preview');
  if (!v) { out.textContent = ''; return; }
  const d = new Date(v);
  out.textContent = `${d.getMonth() + 1}/${d.getDate()}（${'日一二三四五六'[d.getDay()]}）${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function goPage(page) {
  window.location.href = '/' + page;
}

function formatLeadMinutes(min) {
  if (min % 1440 === 0) return `${min / 1440}天`;
  if (min % 60 === 0) return `${min / 60}小時`;
  return `${min}分鐘`;
}

// 把分鐘數拆成「數值＋單位」給下拉選單用（挑最大能整除的單位）
function minutesToUnit(min) {
  if (min == null) return { value: '', unit: 1 };
  if (min % 1440 === 0) return { value: min / 1440, unit: 1440 };
  if (min % 60 === 0) return { value: min / 60, unit: 60 };
  return { value: min, unit: 1 };
}

function doLogin() {
  token = document.getElementById('tokenInput').value.trim();
  if (!token) return toast('請輸入密碼');
  localStorage.setItem('dashboardToken', token);
  loadNotes();
}

// 記住密碼：網址帶 token（頁面互跳）或之前登入存過的 token，都自動略過登入畫面
async function tryStoredLogin() {
  const saved = new URLSearchParams(location.search).get('token') || localStorage.getItem('dashboardToken');
  if (!saved) return;
  document.getElementById('login').style.display = 'none'; // 先隱藏，避免驗證期間閃一下登入畫面
  const res = await fetch(`/api/dashboard/notes?limit=1`, { headers: { 'x-dashboard-token': saved } });
  if (res.status === 401) {
    localStorage.removeItem('dashboardToken');
    document.getElementById('login').style.display = 'flex'; // 驗證失敗才顯示登入畫面
    return;
  }
  token = saved;
  localStorage.setItem('dashboardToken', token);
  loadNotes();
}
tryStoredLogin();

// 後台列表/日曆/統計都吃這份資料，所以要一次撈足。
// 沒帶 limit 的話 API 預設只給 100 筆 —— 實測 268 筆時，7/14 以前的
// 168 筆在後台完全看不到，看起來就像資料不見了。
const NOTES_LIMIT = 2000;

async function api(method, body) {
  const url = method === 'GET' ? `/api/dashboard/notes?limit=${NOTES_LIMIT}` : `/api/dashboard/notes`;
  let res;
  try {
    res = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json', 'x-dashboard-token': token },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (e) {
    toast('連不上伺服器，請確認網路後再試一次', { error: true });
    return null;
  }
  if (res.status === 401) { toast('密碼錯誤', { error: true }); return null; }
  let data = null;
  try { data = await res.json(); } catch (e) { /* 沒有內容 */ }
  if (!res.ok || (data && data.error)) {
    toast('沒有存成功，請再試一次' + (data && data.error ? `（${data.error}）` : ''), { error: true });
    return null;
  }
  return data;
}

async function getJSON(url) {
  let res;
  try { res = await fetch(url, { headers: { 'x-dashboard-token': token } }); }
  catch (e) { toastErr('連不上伺服器，請確認網路後再試一次'); return null; }
  if (res.status === 401) { toastErr('密碼錯誤'); return null; }
  let data = null;
  try { data = await res.json(); } catch (e) { /* 沒有內容 */ }
  if (!res.ok || (data && data.error)) { toastErr('讀取失敗，請稍後再試' + (data && data.error ? `（${data.error}）` : '')); return null; }
  return data;
}

async function loadNotes() {
  if (!token) return; // 還沒登入時，不要讓自動刷新的 60 秒計時器一直跳密碼錯誤
  loadNextDuty();
  const data = await api('GET');
  if (!data) return;
  allNotes = data;

  // 萬一哪天真的撈滿了，要講出來，不要又變成無聲截斷
  const warn = document.getElementById('truncWarn');
  if (warn) {
    const hit = Array.isArray(data) && data.length >= NOTES_LIMIT;
    warn.style.display = hit ? 'block' : 'none';
    if (hit) warn.textContent = `記錄已超過 ${NOTES_LIMIT} 筆，這裡只顯示最新的 ${NOTES_LIMIT} 筆。`;
  }

  // 一併載入主日服事表，疊進月曆
  worshipByDate = {};
  try {
    const wres = await fetch(`/api/worship/schedule`, { headers: { 'x-dashboard-token': token } });
    if (wres.ok) {
      const wd = await wres.json();
      (wd || []).forEach(w => { (worshipByDate[w.service_date] = worshipByDate[w.service_date] || []).push(w); });
    }
  } catch (e) { /* 服事表載入失敗不影響其他功能 */ }

  document.getElementById('login').style.display = 'none';
  document.getElementById('main').style.display = 'block';
  document.getElementById('lastRefresh').textContent = '更新 ' + new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
  renderStats();
  renderProjectTags();
  updateProjectList();
  applyFilters();
  if (currentView === 'calendar') {
    renderCalendar();
    if (selectedKey) showDay(selectedKey);
  }

  // 網址帶 #songs / #order / #meetings / #links（例如從服事表頁面跳過來）第一次登入完成後自動切過去
  if (!hashTabApplied) {

    const h = (location.hash || '').replace('#', '');
    if (h && TABS.includes(h) && h !== 'dashboard') switchTab(h);
  }
}

function renderStats() {

  const rate = total ? Math.round(done / allNotes.filter(n => n.type === 'task' || n.type === 'reminder').length * 100) || 0 : 0;
  const late = allNotes.filter(n => !n.is_done && n.due_date && (n.type === 'task' || n.type === 'reminder') && new Date(n.due_date) < new Date()).length;

function sortNotes(items, sortBy) {
  const byDue = (a, b, dir) => {
    if (!a.due_date && !b.due_date) return 0;
    if (!a.due_date) return 1; // 沒有到期時間的排最後
    if (!b.due_date) return -1;
    return dir * (new Date(a.due_date) - new Date(b.due_date));
  };
  const sorted = items.slice();
  if (sortBy === 'created_asc') sorted.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  else if (sortBy === 'due_asc') sorted.sort((a, b) => byDue(a, b, 1));
  else if (sortBy === 'due_desc') sorted.sort((a, b) => byDue(a, b, -1));
  else if (sortBy === 'content_asc') sorted.sort((a, b) => (a.content || '').localeCompare(b.content || '', 'zh-TW'));
  else sorted.sort((a, b) => new Date(b.created_at) - new Date(a.created_at)); // created_desc（預設）
  return sorted;
}

function applyFilters() {
  const type = document.getElementById('filterType').value;
  const done = document.getElementById('filterDone').value;
  const search = document.getElementById('search').value.toLowerCase();

  let filtered = allNotes.filter(n => {
    if (type && n.type !== type) return false;
    if (done !== '' && String(n.is_done) !== done) return false;
    if (activeProject && n.project !== activeProject) return false;
    if (search && !n.content.toLowerCase().includes(search) && !(n.project || '').toLowerCase().includes(search)) return false;
    return true;
  });
  filtered = sortNotes(filtered, document.getElementById('sortBy').value);

  const nonDefault = document.getElementById('filterType').value || document.getElementById('filterDone').value || document.getElementById('sortBy').value !== 'due_asc';
  document.querySelector('#filterBtn .dot').hidden = !nonDefault;
  const list = document.getElementById('tableBody');
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">沒有符合的記錄</div>';
    updateBulkBar();
    return;
  }
  const sortBy = document.getElementById('sortBy').value;
  const groups = sortBy === 'due_asc' ? groupByDue(filtered)
    : sortBy.startsWith('created') ? groupByCreated(filtered)
    : [['all', '', filtered]];
  list.innerHTML = groups.filter(g => g[2].length).map(([key, label, rows]) => {
    if (key === 'done') {
      return `<div class="sep"><button onclick="showDoneGroup = !showDoneGroup; applyFilters()" aria-expanded="${showDoneGroup}">已完成 <span class="num">${rows.length}</span><svg class="icon" style="width:14px;height:14px;transform:rotate(${showDoneGroup ? 90 : 0}deg)"><use href="#i-right"/></svg></button></div>` +
        (showDoneGroup ? rows.map(noteRow).join('') : '');
    }
    return (label ? `<div class="sep ${key === 'overdue' ? 'overdue' : ''}"><span>${label}</span></div>` : '') + rows.map(noteRow).join('');
  }).join('');
  updateBulkBar();
}

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function hm(iso) { return new Date(iso).toLocaleTimeString('zh-TW', { timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', hour12: false }); }
function mdw(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('zh-TW', { timeZone: 'Asia/Taipei', month: 'numeric', day: 'numeric' }) +
    '（' + d.toLocaleDateString('zh-TW', { timeZone: 'Asia/Taipei', weekday: 'narrow' }) + '）';
}
function addDaysKey(key, n) { const d = new Date(key + 'T12:00:00+08:00'); d.setDate(d.getDate() + n); return taipeiKey(d.toISOString()); }

// 依到期時間分組（LINE 的日期膠囊）；已完成的收在最後、預設收起來
let showDoneGroup = false;
function groupByDue(items) {
  const now = Date.now(), today = todayKey(), tomorrow = addDaysKey(today, 1), weekEnd = addDaysKey(today, 7);
  const g = { overdue: [], today: [], tomorrow: [], week: [], later: [], none: [], done: [] };
  items.forEach(n => {
    if (n.is_done) return g.done.push(n);
    if (!n.due_date) return g.none.push(n);
    const k = taipeiKey(n.due_date);
    if (new Date(n.due_date).getTime() < now) g.overdue.push(n);
    else if (k === today) g.today.push(n);
    else if (k === tomorrow) g.tomorrow.push(n);
    else if (k <= weekEnd) g.week.push(n);
    else g.later.push(n);
  });
  return [['overdue', `過期 ${g.overdue.length}`, g.overdue], ['today', '今天', g.today], ['tomorrow', '明天', g.tomorrow],
    ['week', '這七天', g.week], ['later', '之後', g.later], ['none', '未排時間', g.none], ['done', '已完成', g.done]];
}
function groupByCreated(items) {
  const today = todayKey(), yesterday = addDaysKey(today, -1), map = new Map();
  items.forEach(n => {
    const k = taipeiKey(n.created_at);
    const label = k === today ? '今天' : k === yesterday ? '昨天' : mdw(n.created_at);
    if (!map.has(k)) map.set(k, [k, label, []]);
    map.get(k)[2].push(n);
  });
  return [...map.values()];
}

function noteRow(n) {
  let due = '';
  if (n.due_date) {
    const k = taipeiKey(n.due_date), today = todayKey();
    const day = k === today ? '今天' : k === addDaysKey(today, 1) ? '明天' : mdw(n.due_date);
    due = `${day} ${hm(n.due_date)}`;
    if (n.remind_lead_minutes != null) due += `・提前${formatLeadMinutes(n.remind_lead_minutes)}`;
    if (!n.is_done && new Date(n.due_date) < new Date()) due = `<span class="late">${due}</span>`;
  }
  // 類型看頭像就知道；最常見的「待辦」不再重複寫一次
  const sub = [n.project ? esc(n.project) : '', due, n.type === 'task' ? '' : TYPE_LABEL[n.type]].filter(Boolean).join('・') || TYPE_LABEL[n.type];
  // AI 改寫過的記錄，把你原本打的話也留一個入口可以對照。
  // 不然 AI 改壞了在後台完全看不出來。
  const rewritten = n.raw_text && n.content && n.raw_text !== n.content;
  const rawBlock = rewritten
    ? `<div class="raw-toggle" onclick="event.stopPropagation(); this.classList.toggle('open')">
         <span class="raw-label">AI 改寫過，看原話</span>
         <div class="raw-text">${esc(n.raw_text)}</div>
       </div>`
    : '';
  return `<div class="row ${n.is_done ? 'done' : ''}" data-id="${esc(n.id)}">
    <label class="sel" onclick="event.stopPropagation()"><input type="checkbox" class="rowCheck" ${selectedIds.has(n.id) ? 'checked' : ''} onchange="toggleSelect('${esc(n.id)}', this.checked)" aria-label="選取" /></label>
    <div class="row-main" role="button" tabindex="0" onclick="rowClick('${esc(n.id)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();rowClick('${esc(n.id)}')}">
      <span class="avatar ${esc(n.type)}" title="${TYPE_LABEL[n.type] || ''}"><svg class="icon"><use href="#i-${esc(n.type)}"/></svg></span>
      <span class="row-text"><span class="row-title">${esc(n.content)}</span><span class="row-sub num">${sub}</span>${rawBlock}</span>
    </div>
    ${n.is_done ? '<span class="read">已完成</span>' : ''}
    <button class="check" onclick="toggleDone('${esc(n.id)}', ${!n.is_done})" aria-pressed="${!!n.is_done}" aria-label="${n.is_done ? '標為未完成' : '標為完成'}"><i><svg class="icon"><use href="#i-check"/></svg></i></button>
  </div>`;
}

async function toggleDone(id, is_done, quiet) {
  const note = allNotes.find(n => n.id === id);

  const row = document.querySelector(`.row[data-id="${CSS.escape(String(id))}"]`);

  if (note) note.is_done = is_done;

    { action: { label: '復原', run: () => toggleDone(id, !is_done, true) } });
}

// 刪除先從畫面拿掉，5 秒內可以按「復原」；時間到才真的刪
const pendingDeletes = new Map(); // id -> note
function deleteNotes(ids) {
  const removed = allNotes.filter(n => ids.includes(n.id));
  if (!removed.length) return;
  removed.forEach(n => pendingDeletes.set(n.id, n));
  allNotes = allNotes.filter(n => !ids.includes(n.id));
  ids.forEach(id => selectedIds.delete(id));
  if (ids.includes(editingNoteId)) closeEditModal();
  renderStats(); renderProjectTags(); applyFilters();
  if (currentView === 'calendar') { renderCalendar(); if (selectedKey) showDay(selectedKey); }
  const label = removed.length === 1 ? `已刪除：${removed[0].content}` : `已刪除 ${removed.length} 筆`;
  toast(label, {
    action: { label: '復原', run: () => {
      removed.forEach(n => pendingDeletes.delete(n.id));
      allNotes = allNotes.concat(removed);
      renderStats(); renderProjectTags(); applyFilters();
      if (currentView === 'calendar') { renderCalendar(); if (selectedKey) showDay(selectedKey); }
    } },
    onExpire: () => flushDeletes(),
  });
}
async function flushDeletes() {
  const ids = [...pendingDeletes.keys()];
  pendingDeletes.clear();
  for (const id of ids) {
    const res = await api('DELETE', { id });
    if (!res) { const reload = deleteReloads.get(id) || loadNotes; reload(); } // 沒刪成功就重新載入，讓那一筆回到畫面上
    deleteReloads.delete(id);
  }
}
// 詩歌、敬拜順序、會議記錄、收藏：一樣先拿掉、5 秒內可復原
const deleteReloads = new Map(); // id -> 刪除失敗時要重新載入的函式
function deleteItem(store, key, id, label) {
  const list = store[key];
  const idx = list.findIndex(n => n.id === id);
  if (idx < 0) return;
  const item = list[idx];
  list.splice(idx, 1);
  store.render();
  pendingDeletes.set(id, item);
  deleteReloads.set(id, () => store.load());
  const name = label || String(item.content || '').replace(/https?:\/\/\S+/g, '').replace(/^[#\s]+/, '').split('\n')[0].trim().slice(0, 30);
  toast(name ? `已刪除：${name}` : '已刪除', {
    action: { label: '復原', run: () => {
      pendingDeletes.delete(id); deleteReloads.delete(id);
      store[key].splice(Math.min(idx, store[key].length), 0, item);
      store.render();
    } },
    onExpire: () => flushDeletes(),
  });
}
// 關掉分頁時還沒送出的刪除也要送出去
window.addEventListener('pagehide', () => {
  for (const id of pendingDeletes.keys()) {
    fetch('/api/dashboard/notes', { method: 'DELETE', keepalive: true, headers: { 'Content-Type': 'application/json', 'x-dashboard-token': token }, body: JSON.stringify({ id }) });
  }
  pendingDeletes.clear();
});

// 整個月看起來會像空的（實測 6 月的 25 筆 task/reminder 全部已完成），
// 很容易誤以為資料不見了。這個開關讓過去的記錄也看得到。
let calShowDone = false;
function toggleCalDone(on) {
  calShowDone = !!on;
  renderCalendar();
}

function renderCalendar() {
  document.getElementById('calTitle').textContent = `${calYear} 年 ${calMonth + 1} 月`;

  // 把有 due_date 的事項歸到日期
  const byDay = {};
  allNotes.forEach(n => {
    if (!n.due_date) return;
    if (n.is_done && !calShowDone) return;
    if (n.type !== 'task' && n.type !== 'reminder') return;
    const key = taipeiKey(n.due_date);
    (byDay[key] = byDay[key] || []).push(n);
  });

  const grid = document.getElementById('calGrid');
  let html = ['日', '一', '二', '三', '四', '五', '六']
    .map(w => `<div class="cal-wd">${w}</div>`).join('');

  const firstWd = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const tk = todayKey();

  for (let i = 0; i < firstWd; i++) html += '<div class="cal-cell empty"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${calYear}-${pad2(calMonth + 1)}-${pad2(d)}`;
    const items = byDay[key] || [];
    const classes = ['cal-cell'];
    if (key === tk) classes.push('today');
    if (key === selectedKey) classes.push('selected');
    const reminders = items.filter(n => n.type === 'reminder').length;
    const tasks = items.filter(n => n.type === 'task').length;
    const hasWorship = !!worshipByDate[key];
    let dots = '';
    if (reminders) dots += '<span class="cal-dot reminder"></span>';
    if (tasks) dots += '<span class="cal-dot task"></span>';
    if (hasWorship) dots += '<span class="cal-dot worship"></span>';
    let countTxt = items.length ? `${items.length} 項` : '';
    if (hasWorship) countTxt = countTxt ? `${countTxt}・服事` : '服事';
    const count = countTxt ? `<div class="cal-count">${countTxt}</div>` : '';
    html += `<div class="${classes.join(' ')}" onclick="showDay('${key}')">
      <div class="cal-date">${d}</div>
      <div class="cal-dots">${dots}</div>${count}
    </div>`;
  }
  grid.innerHTML = html;
}

function showDay(key) {
  selectedKey = key;
  renderCalendar();
  const items = allNotes
    // 跟月曆格子用同一套過濾條件，不然點下去會跟格子上顯示的數量對不起來
    .filter(n => n.due_date && (!n.is_done || calShowDone) && (n.type === 'task' || n.type === 'reminder') && taipeiKey(n.due_date) === key)
    .sort((a, b) => new Date(a.due_date) - new Date(b.due_date));

  const dateLabel2 = new Date(`${key}T00:00:00+08:00`).toLocaleDateString('zh-TW', {
    timeZone: 'Asia/Taipei', month: 'long', day: 'numeric', weekday: 'long',
  });

  const worship = worshipByDate[key] || [];

  let html = `<h3>${dateLabel2}</h3>`;
  if (items.length === 0 && worship.length === 0) {
    html += '<div class="empty" style="padding:16px">這天沒有排定事項</div>';
  } else {
    html += items.map(n => {
      const time = new Date(n.due_date).toLocaleTimeString('zh-TW', { timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', hour12: false });
      return `<div class="day-item">
        <span class="dtime">${time}</span>
        <span class="type-badge ${TYPE_CLASS[n.type]}">${TYPE_LABEL[n.type]}</span>
        <span style="flex:1;min-width:0">${esc(n.content)}</span>
        ${n.project ? `<span style="color:var(--ink-2);font-size:13px">${esc(n.project)}</span>` : ''}
        <div class="actions">
          <button class="btn-sm btn-done" onclick="dayToggleDone('${n.id}')">完成</button>
          <button class="btn-sm btn-del" onclick="dayDeleteNote('${n.id}')">刪除</button>
        </div>
      </div>`;
    }).join('');

    if (worship.length) {
      const byRole = {};
      worship.forEach(w => { (byRole[w.role] = byRole[w.role] || []).push(w.person_name); });
      html += `<h3 style="margin-top:16px">主日服事</h3>`;
      html += Object.entries(byRole).map(([role, ppl]) => `<div class="day-item">
        <span class="type-badge" style="background:var(--blue-tint);color:var(--blue)">${esc(role)}</span>
        <span>${ppl.map(esc).join('、')}</span>
      </div>`).join('');
    }
  }
  const detail = document.getElementById('dayDetail');
  detail.innerHTML = html;
  detail.style.display = 'block';
}

async function dayToggleDone(id) {
  await toggleDone(id, true);
  if (selectedKey) showDay(selectedKey);
}

async function dayDeleteNote(id) {
  await deleteNote(id);
  if (selectedKey) showDay(selectedKey);
}

function dateKey(iso) { return new Date(iso).toLocaleDateString('en-CA', { timeZone: 'Asia/Taipei' }); }
function dateLabel(iso) {
  return new Date(iso).toLocaleDateString('zh-TW', { timeZone: 'Asia/Taipei', month: '2-digit', day: '2-digit', weekday: 'short' });
}

// 把 YouTube 網址（watch/youtu.be/shorts/embed 都支援）轉成可嵌入的 embed 網址，不是 YouTube 就回傳 null
function youtubeEmbedUrl(url) {
  let u;
  try { u = new URL(url); } catch (e) { return null; }
  const host = u.hostname.replace(/^www\./, '');
  let id = null;
  if (host === 'youtu.be') {
    id = u.pathname.slice(1);
  } else if (host === 'youtube.com' || host === 'm.youtube.com') {
    if (u.pathname === '/watch') id = u.searchParams.get('v');
    else if (u.pathname.startsWith('/embed/')) id = u.pathname.split('/')[2];
    else if (u.pathname.startsWith('/shorts/')) id = u.pathname.split('/')[2];
  }
  return id ? `https://www.youtube.com/embed/${id}` : null;
}

// 跟 lib/commands.js 的 parseSongEntry 邏輯一致：只解析前4個欄位，其餘原文保留
function parseSongEntry(content) {
  const [main, ...histParts] = content.trim().split(/｜版本紀錄[:：]/);
  const history = histParts.join('｜版本紀錄:');
  const m = main.trim().match(/^(\S+)(?:\s+(\S+))?(?:\s+(\S+))?(?:\s+(\S+))?(?:\s+([\s\S]*))?$/);
  if (!m) return { title: '', key: '', bpm: '', link: '', section: '', history };
  return { title: m[1] || '', key: m[2] || '', bpm: m[3] || '', link: m[4] || '', section: (m[5] || '').trim(), history };
}

const Songs = {
  items: [],
  editingId: null,
  openCardId: null,

  async load() {
    const data = await getJSON(`/api/dashboard/notes?type=note&project=${encodeURIComponent('詩歌')}&limit=200`);
    if (!data) return;
    this.items = data;
    this.render();
  },

  render() {
    const kw = document.getElementById('songsSearch').value.trim().toLowerCase();
    const list = document.getElementById('songsList');
    const parsed = this.items.map(n => ({ note: n, entry: parseSongEntry(n.content || '') }))
      .filter(x => !kw || x.entry.title.toLowerCase().includes(kw));
    if (parsed.length === 0) {
      list.innerHTML = '<div class="empty">詩歌庫還沒有資料</div>';
      return;
    }
    list.innerHTML = parsed.map(({ note, entry }) => {
      const open = this.openCardId === note.id;
      const tag = [entry.key, entry.bpm].filter(Boolean).join(' · ');
      // 只有展開的卡片才嵌入播放器，避免一次載入一堆 iframe
      const ytEmbed = (open && entry.link) ? youtubeEmbedUrl(entry.link) : null;
      const linkHtml = entry.link
        ? (ytEmbed
            ? `<div style="position:relative;width:100%;padding-top:56.25%;margin-bottom:10px;border-radius:10px;overflow:hidden">
                 <iframe src="${ytEmbed}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0" allowfullscreen loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
               </div>
               <a href="${entry.link}" target="_blank" rel="noopener" style="font-size:12px;color:var(--muted)">${entry.link}</a><br>`
            : `<a href="${entry.link}" target="_blank" rel="noopener">${entry.link}</a><br>`)
        : '';
      const safeLyrics = (entry.section || '（沒有歌詞／段落資料）').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const historyHtml = entry.history ? `<div class="history">版本紀錄：${esc(entry.history)}</div>` : '';
      return `<div class="card">
        <div class="card-head" onclick="Songs.toggleCard('${note.id}')">
          <span class="title">${esc(entry.title) || '(未命名)'}</span>
          ${tag ? `<span class="tag">${tag}</span>` : ''}
        </div>
        <div class="card-body ${open ? 'open' : ''}" id="songs-body-${note.id}">
          ${linkHtml}
          ${historyHtml}
          <div class="lyrics">${safeLyrics}</div>
          <div class="actions">
            <button class="btn-sm btn-edit" onclick="Songs.openEdit('${note.id}')">編輯</button>
            <button class="btn-sm btn-del" onclick="Songs.del('${note.id}')">刪除</button>
          </div>
        </div>
      </div>`;
    }).join('');
  },

  toggleCard(id) {
    this.openCardId = this.openCardId === id ? null : id;
    this.render();
  },

  openAdd() {
    this.editingId = null;
    document.getElementById('songsModalTitle').textContent = '新增歌曲';
    document.getElementById('songsFTitle').value = '';
    document.getElementById('songsFKey').value = '';
    document.getElementById('songsFBpm').value = '';
    document.getElementById('songsFLink').value = '';
    document.getElementById('songsFSection').value = '';
    document.getElementById('songsEditModal').classList.add('open');
  },

  openEdit(id) {
    const note = this.items.find(n => n.id === id);
    if (!note) return;
    const entry = parseSongEntry(note.content || '');
    this.editingId = id;
    document.getElementById('songsModalTitle').textContent = '編輯歌曲';
    document.getElementById('songsFTitle').value = entry.title;
    document.getElementById('songsFKey').value = entry.key;
    document.getElementById('songsFBpm').value = entry.bpm;
    document.getElementById('songsFLink').value = entry.link;
    document.getElementById('songsFSection').value = entry.section;
    document.getElementById('songsEditModal').classList.add('open');
  },

  closeModal() {
    document.getElementById('songsEditModal').classList.remove('open');
  },

  async save() {
    const title = document.getElementById('songsFTitle').value.trim();
    if (!title) return toast('請填寫歌名');
    const key = document.getElementById('songsFKey').value.trim();
    const bpm = document.getElementById('songsFBpm').value.trim();
    const link = document.getElementById('songsFLink').value.trim();
    const section = document.getElementById('songsFSection').value.trim();
    const header = [title, key, bpm, link].filter(Boolean).join(' ');
    // 編輯時保留原本的版本紀錄字串，不從後台這邊動它
    let history = '';
    if (this.editingId) {
      const note = this.items.find(n => n.id === this.editingId);
      const parsed = parseSongEntry(note.content || '');
      if (parsed.history) history = `\n｜版本紀錄:${parsed.history}`;
    }
    const content = [header, section].filter(Boolean).join('\n') + history;

    if (this.editingId) {
      const updated = await api('PATCH', { id: this.editingId, content });
      if (!updated) return;
      const idx = this.items.findIndex(n => n.id === this.editingId);
      if (idx !== -1) this.items[idx].content = content;
    } else {
      const data = await api('POST', { type: 'note', project: '詩歌', content });
      if (!data) return; // api 已經提示原因
      this.items.unshift(data);
    }
    this.closeModal();
    this.render();
  },

  async del(id) {
    deleteItem(this, 'items', id);
  },
};

// ---- 會議記錄 ----
// 跟 lib/commands.js 的 extractActionItems 邏輯一致
function extractActionItems(content) {
  const items = [];
  content.split('\n').forEach((line) => {
    const m = line.match(/^\s*(?:待辦|待辦事項|todo|to-?do|行動項目|action)[:：]\s*(.+)$/i);
    if (m && m[1].trim()) items.push(m[1].trim());
  });
  return items;
}

// 跟 lib/commands.js 的 meetingTitle 對應：標題就是內容第一行
function meetingTitle(content) {
  const first = String(content || '').split('\n').map(s => s.trim()).find(Boolean);
  if (!first) return '';
  return first
    .replace(/^\d{1,2}\s*[/月]\s*\d{1,2}\s*日?[\s,，、:：-]*/, '')
    .replace(/[\s:：,，、。.-]+$/, '')
    .trim();
}

const Meetings = {
  items: [],
  actionItems: [],
  editingId: null,
  openCardId: null,

  async load() {
    const [mData, tData] = await Promise.all([
      getJSON(`/api/dashboard/notes?type=note&project=${encodeURIComponent('會議記錄')}&limit=200`),
      getJSON(`/api/dashboard/notes?type=task&project=${encodeURIComponent('會議記錄')}&limit=200`),
    ]);
    if (!mData || !tData) return;
    this.items = mData.sort((a, b) => new Date(b.due_date) - new Date(a.due_date));
    this.actionItems = tData;
    this.render();
  },

  render() {
    const list = document.getElementById('meetingsList');
    if (this.items.length === 0) {
      list.innerHTML = '<div class="empty">還沒有任何會議記錄</div>';
      return;
    }
    list.innerHTML = this.items.map(n => {
      const open = this.openCardId === n.id;
      const safe = (n.content || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      // 用建立時間相近（同一天）粗略歸屬待辦項目給該次會議
      const dayItems = this.actionItems.filter(t => dateKey(t.created_at) === dateKey(n.created_at));
      const itemsHtml = dayItems.map(t => `<div class="action-item ${t.is_done ? 'done' : ''}">
        <span>${(t.content || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</span>
        ${!t.is_done ? `<button class="btn-sm btn-done" onclick="Meetings.doneItem('${t.id}')">完成</button>` : ''}
        <button class="btn-sm btn-del" onclick="Meetings.delItem('${t.id}')">刪除</button>
      </div>`).join('');
      return `<div class="card">
        <div class="card-head" onclick="Meetings.toggleCard('${n.id}')">
          <span class="date">${dateLabel(n.due_date)}</span>
          ${meetingTitle(n.content) ? `<span class="meeting-title">${meetingTitle(n.content).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</span>` : ''}
          ${dayItems.length ? `<span class="tag">${dayItems.length} 個待辦</span>` : ''}
        </div>
        <div class="card-body ${open ? 'open' : ''}">
          <div class="content-pre">${safe}</div>
          ${itemsHtml}
          <div class="actions">
            <button class="btn-sm btn-edit" onclick="Meetings.openEdit('${n.id}')">編輯</button>
            <button class="btn-sm btn-del" onclick="Meetings.del('${n.id}')">刪除</button>
          </div>
        </div>
      </div>`;
    }).join('');
  },

  toggleCard(id) {
    this.openCardId = this.openCardId === id ? null : id;
    this.render();
  },

  openAdd() {
    this.editingId = null;
    document.getElementById('meetingsModalTitle').textContent = '新增會議記錄';
    document.getElementById('meetingsFDate').value = dateKey(new Date().toISOString());
    document.getElementById('meetingsFTitle').value = '';
    document.getElementById('meetingsFContent').value = '';
    document.getElementById('meetingsEditModal').classList.add('open');
  },

  openEdit(id) {
    const n = this.items.find(x => x.id === id);
    if (!n) return;
    this.editingId = id;
    document.getElementById('meetingsModalTitle').textContent = '編輯會議記錄';
    document.getElementById('meetingsFDate').value = dateKey(n.due_date);
    // 內容第一行就是標題，拆出來放標題格，剩下的留在內容格。
    // 這裡放「原始的」第一行，不套 meetingTitle 的清理（那是給顯示用的）——
    // 不然使用者只是開個編輯視窗按儲存，結尾的冒號就被默默改掉了。
    const lines = String(n.content || '').split('\n');
    const firstIdx = lines.findIndex(l => l.trim());
    document.getElementById('meetingsFTitle').value = firstIdx === -1 ? '' : lines[firstIdx].trim();
    document.getElementById('meetingsFContent').value = firstIdx === -1 ? '' : lines.slice(firstIdx + 1).join('\n').trim();
    document.getElementById('meetingsEditModal').classList.add('open');
  },

  closeModal() {
    document.getElementById('meetingsEditModal').classList.remove('open');
  },

  async save() {
    const dateStr = document.getElementById('meetingsFDate').value;
    const title = document.getElementById('meetingsFTitle').value.trim();
    const body = document.getElementById('meetingsFContent').value.trim();
    // 標題存成第一行，跟從 LINE 記錄的格式一致
    const content = [title, body].filter(Boolean).join('\n');
    if (!dateStr) return toast('請選擇日期');
    if (!content) return toast('請填寫標題或內容');
    const due_date = new Date(`${dateStr}T09:00:00+08:00`).toISOString();

    if (this.editingId) {
      const updated = await api('PATCH', { id: this.editingId, content, due_date });
      if (!updated) return;
      const idx = this.items.findIndex(n => n.id === this.editingId);
      if (idx !== -1) Object.assign(this.items[idx], { content, due_date });
    } else {
      const data = await api('POST', { type: 'note', project: '會議記錄', content, due_date });
      if (!data) return; // api 已經提示原因
      this.items.unshift(data);

      const actionTexts = extractActionItems(content);
      for (const it of actionTexts) {
        const task = await api('POST', { type: 'task', project: '會議記錄', content: it });
        if (task && !task.error) this.actionItems.push(task);
      }
    }
    this.items.sort((a, b) => new Date(b.due_date) - new Date(a.due_date));
    this.closeModal();
    this.render();
  },

  async del(id) {
    deleteItem(this, 'items', id);
  },

  async doneItem(id) {
    await api('PATCH', { id, is_done: true });
    const t = this.actionItems.find(x => x.id === id);
    if (t) t.is_done = true;
    this.render();
  },

  async delItem(id) {
    deleteItem(this, 'actionItems', id);
  },
};

function extractUrl(text) {
  const m = text.match(/https?:\/\/\S+/);
  return m ? m[0] : null;
}

    }
    empty.style.display = 'none';

    grid.innerHTML = this.items.map(it => {
      const esc = s => (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      const when = new Date(it.created_at).toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit' });
      const label = it.project && it.project !== '相簿' ? `${it.project}・${when}` : when;
      // 簽名網址失效或檔案不見時，至少讓格子不要是破圖
      if (!it.url) {
        return `<div class="album-item"><div class="album-meta">${esc(label)}（圖片讀不到）</div>
          <button class="album-del" onclick="Album.remove('${it.id}')" title="刪除" aria-label="刪除"><svg class="icon"><use href="#i-close"/></svg></button></div>`;
      }
      return `<div class="album-item">
        <img src="${esc(it.url)}" alt="${esc(it.content)}" loading="lazy" onclick="Album.openLightbox('${esc(it.url)}')" />
        <div class="album-meta">${esc(label)}</div>
        <button class="album-del" onclick="Album.remove('${it.id}')" title="刪除" aria-label="刪除"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>`;
    }).join('');
  },

  openLightbox(url) {
    document.getElementById('lightboxImg').src = url;
    document.getElementById('albumLightbox').style.display = 'flex';
  },

  closeLightbox() {
    document.getElementById('albumLightbox').style.display = 'none';
    document.getElementById('lightboxImg').src = '';
  },

  async remove(id) {
    if (!confirm('刪除這張圖片？圖檔會一起刪掉，無法復原。')) return;
    let res = null;
    try { res = await fetch(`/api/dashboard/album?id=${encodeURIComponent(id)}`, { method: 'DELETE', headers: { 'x-dashboard-token': token } }); } catch (e) { /* 下面一起處理 */ }
    if (!res || !res.ok) { toastErr(res ? '刪除失敗，請再試一次' : '連不上伺服器，請確認網路後再試一次'); return; }
    this.items = this.items.filter(i => i.id !== id);
    this.render();
  },
};

const Links = {
  items: [],
  filter: 'active',
  titleCache: {}, // url -> 抓到的網頁標題（或 null 代表抓不到），同一個網址一個 session 只抓一次

  async load() {
    const data = await getJSON(`/api/dashboard/notes?type=note&project=${encodeURIComponent('收藏')}&limit=200`);
    if (!data) return;
    this.items = data;
    this.render();
  },

  setFilter(f) {
    this.filter = f;
    ['active', 'done', 'all'].forEach(k => document.getElementById('linksTab' + k[0].toUpperCase() + k.slice(1)).classList.toggle('active', k === f));
    this.render();
  },

  render() {
    const list = document.getElementById('linksList');
    const filtered = this.items.filter(n => this.filter === 'all' ? true : this.filter === 'done' ? n.is_done : !n.is_done);
    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty">沒有收藏的連結</div>';
      return;
    }
    list.innerHTML = filtered.map(n => {
      const url = extractUrl(n.content || '');
      const created = new Date(n.created_at).toLocaleDateString('zh-TW', { timeZone: 'Asia/Taipei' });
      const safe = (n.content || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const title = url ? this.titleCache[url] : null;
      const escTitle = title ? title.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') : null;
      const escUrl = url ? url.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') : '';
      const body = url
        ? `<a href="${url}" target="_blank" rel="noopener">${escTitle || escUrl}</a>` + (escTitle ? `<div class="meta" style="margin-top:2px">${escUrl}</div>` : '')
        : `<span>${safe}</span>`;
      return `<div class="card ${n.is_done ? 'done' : ''}">
        <div class="content">${body}<div class="meta">收藏於 ${created}</div></div>
        <button class="btn-sm btn-archive" onclick="Links.toggleDone('${n.id}', ${!n.is_done})">${n.is_done ? '取消封存' : '封存'}</button>
        <button class="btn-sm btn-del" onclick="Links.del('${n.id}')">刪除</button>
      </div>`;
    }).join('');

    // 背景抓還沒快取過標題的連結，抓到後重新渲染一次換成可讀標題
    const urls = [...new Set(filtered.map(n => extractUrl(n.content || '')).filter(Boolean))];
    this.fetchTitlesFor(urls).then((fetchedAny) => { if (fetchedAny) this.render(); });
  },

  async fetchTitlesFor(urls) {
    const missing = urls.filter(u => !(u in this.titleCache));
    if (missing.length === 0) return false;
    await Promise.all(missing.map(async (u) => {
      try {
        const res = await fetch(`/api/unfurl?url=${encodeURIComponent(u)}`, { headers: { 'x-dashboard-token': token } });
        const data = await res.json();
        this.titleCache[u] = (data && data.title) || null;
      } catch (e) {
        this.titleCache[u] = null;
      }
    }));
    return true;
  },

  async add() {
    const input = document.getElementById('linksNewInput');
    const content = input.value.trim();
    if (!content) return;
    const data = await api('POST', { type: 'note', project: '收藏', content, is_done: false });
    if (!data) return; // api 已經提示原因
    this.items.unshift(data);
    input.value = '';
    this.render();
  },

  async toggleDone(id, is_done) {
    await api('PATCH', { id, is_done });
    const n = this.items.find(x => x.id === id);
    if (n) n.is_done = is_done;
    this.render();
  },

  async del(id) {
    deleteItem(this, 'items', id);
  },
};
</script>

// 面板：按 Esc 或點背景關閉
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-bg.open').forEach(m => m.classList.remove('open'));
    if (selectMode) setSelectMode(false);
    return;
  }
  // 快捷鍵：/ 搜尋、n 跟小秘書說一句話（正在打字時不觸發）
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
  if (typing || e.metaKey || e.ctrlKey || e.altKey || currentTab !== 'dashboard') return;
  if (e.key === '/') { e.preventDefault(); switchView('list'); document.getElementById('search').focus(); }
  if (e.key === 'n') { e.preventDefault(); document.getElementById('composerInput').focus(); }
});
document.querySelectorAll('.modal-bg').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); }));
// 有實體鍵盤的電腦上，把快捷鍵寫在輸入框裡
if (matchMedia('(hover: hover) and (pointer: fine)').matches) {
  document.getElementById('composerInput').placeholder = '跟小秘書說一句話…（按 n）';
  document.getElementById('search').placeholder = '搜尋內容或專案（按 /）';
}
</script>
