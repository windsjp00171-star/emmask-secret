<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>敬拜順序 - EmmArk</title>
<style>
  :root {
    --bg: #f4f6f4; --surface: #ffffff; --ink: #1b2420; --muted: #6b7670; --line: #e7ebe8;
    --brand: #1f6f54; --brand-ink: #16513d; --brand-soft: #e8f2ed; --radius: 14px;
    --shadow: 0 1px 2px rgba(20,40,30,.05), 0 6px 20px rgba(20,40,30,.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
  header { background: linear-gradient(135deg, #1b4536, #14352a); color: #fff; padding: 18px 28px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; box-shadow: 0 2px 12px rgba(20,40,30,.12); }
  header h1 { font-size: 18px; font-weight: 700; flex: 1; letter-spacing: .3px; }
  header a { color: rgba(255,255,255,.7); font-size: 13px; text-decoration: none; }
  header a:hover { color: #fff; }
  .container { max-width: 820px; margin: 0 auto; padding: 24px 20px 60px; }
  .btn { padding: 9px 18px; border-radius: 10px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-cancel { background: #eceeec; color: var(--ink); }
  .btn-sm { padding: 5px 11px; font-size: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
  .btn-edit { background: #5a6f66; color: #fff; }
  .btn-del { background: #e5544b; color: #fff; }
  input, textarea { padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; font-family: inherit; width: 100%; }
  input:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(31,111,84,.15); }
  .toolbar { display: flex; justify-content: flex-end; margin-bottom: 18px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 10px; }
  .card-head { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .card-head .date { font-weight: 700; flex: 1; color: var(--brand-ink); }
  .card-body { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .card-body.open { display: block; }
  .content-pre { white-space: pre-wrap; font-size: 13px; line-height: 1.6; margin-bottom: 10px; }
  .actions { display: flex; gap: 6px; }
  .empty { text-align: center; color: var(--muted); padding: 48px; font-size: 15px; }
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(15,30,25,.5); z-index: 100; align-items: center; justify-content: center; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--surface); border-radius: 18px; padding: 28px; width: 100%; max-width: 520px; margin: 16px; box-shadow: 0 24px 60px rgba(0,0,0,.25); max-height: 90vh; overflow: auto; }
  .modal h3 { margin-bottom: 20px; font-size: 18px; color: var(--brand-ink); }
  .modal label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; margin-top: 14px; font-weight: 500; }
  .modal textarea { resize: vertical; min-height: 220px; font-family: 'SF Mono', Menlo, monospace; }
  .modal-actions { display: flex; gap: 8px; margin-top: 22px; justify-content: flex-end; }
  #login { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(160deg, #1b4536, #0f2b22); }
  .login-box { background: var(--surface); border-radius: 20px; padding: 44px 40px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.3); min-width: 300px; }
  .login-box h2 { margin-bottom: 8px; color: var(--brand-ink); }
  .login-box p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .login-box input { margin-bottom: 14px; }
  .login-box button { width: 100%; padding: 13px; }
  #main { display: none; }
</style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <h2>敬拜順序</h2>
    <p>請輸入 Dashboard 密碼</p>
    <input type="password" id="tokenInput" placeholder="DASHBOARD_TOKEN" onkeydown="if(event.key==='Enter')doLogin()" />
    <button class="btn btn-primary" onclick="doLogin()">進入</button>
  </div>
</div>

<div class="modal-bg" id="editModal">
  <div class="modal">
    <h3 id="modalTitle">編輯敬拜順序</h3>
    <label>日期 *</label>
    <input type="date" id="fDate" />
    <label>內容（歌單、段落結構、歌詞都可以，換行照原樣保留）</label>
    <textarea id="fContent" placeholder="1.無人能與祢相比(E)&#10;1-PC-C-間奏..."></textarea>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveOrder()">儲存</button>
    </div>
  </div>
</div>

<div id="main">
  <header>
    <h1>🎵 敬拜順序</h1>
    <a href="#" onclick="nav('index.html')">📋 Dashboard</a>
    <a href="#" onclick="nav('worship.html')">⛪ 服事表</a>
    <a href="#" onclick="nav('songs.html')">🎼 詩歌庫</a>
    <a href="#" onclick="nav('links.html')">🔗 收藏</a>
    <a href="#" onclick="nav('meetings.html')">📝 會議記錄</a>
  </header>
  <div class="container">
    <div class="toolbar">
      <button class="btn btn-primary" onclick="openAdd()">＋ 新增順序</button>
    </div>
    <div id="list"></div>
  </div>
</div>

<script>
let token = '';
let orders = [];
let editingId = null;
let openCard = null;

function nav(page) { window.location.href = '/' + page + '?token=' + encodeURIComponent(token); }

function doLogin() {
  token = document.getElementById('tokenInput').value.trim();
  if (!token) return alert('請輸入密碼');
  load();
}

async function api(method, body) {
  const res = await fetch(`/api/dashboard/notes?token=${encodeURIComponent(token)}`, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { alert('密碼錯誤'); return null; }
  return res.json();
}

function dateKey(iso) { return new Date(iso).toLocaleDateString('en-CA', { timeZone: 'Asia/Taipei' }); }
function dateLabel(iso) {
  return new Date(iso).toLocaleDateString('zh-TW', { timeZone: 'Asia/Taipei', month: '2-digit', day: '2-digit', weekday: 'short' });
}

async function load() {
  const res = await fetch(`/api/dashboard/notes?token=${encodeURIComponent(token)}&type=note&project=${encodeURIComponent('敬拜順序')}&limit=200`);
  if (res.status === 401) { alert('密碼錯誤'); return; }
  orders = (await res.json()).sort((a, b) => new Date(b.due_date) - new Date(a.due_date));
  document.getElementById('login').style.display = 'none';
  document.getElementById('main').style.display = 'block';
  render();
}

function render() {
  const list = document.getElementById('list');
  if (orders.length === 0) {
    list.innerHTML = '<div class="empty">還沒有任何敬拜順序記錄</div>';
    return;
  }
  list.innerHTML = orders.map(n => {
    const open = openCard === n.id;
    const safe = (n.content || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return `<div class="card">
      <div class="card-head" onclick="toggleCard('${n.id}')">
        <span class="date">${dateLabel(n.due_date)}</span>
      </div>
      <div class="card-body ${open ? 'open' : ''}">
        <div class="content-pre">${safe}</div>
        <div class="actions">
          <button class="btn-sm btn-edit" onclick="openEdit('${n.id}')">編輯</button>
          <button class="btn-sm btn-del" onclick="del('${n.id}')">刪除</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleCard(id) {
  openCard = openCard === id ? null : id;
  render();
}

function openAdd() {
  editingId = null;
  document.getElementById('modalTitle').textContent = '新增敬拜順序';
  document.getElementById('fDate').value = dateKey(new Date().toISOString());
  document.getElementById('fContent').value = '';
  document.getElementById('editModal').classList.add('open');
}

function openEdit(id) {
  const n = orders.find(x => x.id === id);
  if (!n) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = '編輯敬拜順序';
  document.getElementById('fDate').value = dateKey(n.due_date);
  document.getElementById('fContent').value = n.content || '';
  document.getElementById('editModal').classList.add('open');
}

function closeModal() {
  document.getElementById('editModal').classList.remove('open');
}

async function saveOrder() {
  const dateStr = document.getElementById('fDate').value;
  const content = document.getElementById('fContent').value.trim();
  if (!dateStr) return alert('請選擇日期');
  if (!content) return alert('請填寫內容');
  const due_date = new Date(`${dateStr}T09:00:00+08:00`).toISOString();

  if (editingId) {
    const updated = await api('PATCH', { id: editingId, content, due_date });
    if (!updated) return;
    const idx = orders.findIndex(n => n.id === editingId);
    if (idx !== -1) Object.assign(orders[idx], { content, due_date });
  } else {
    const data = await api('POST', { type: 'note', project: '敬拜順序', content, due_date });
    if (!data || data.error) { alert('新增失敗：' + (data && data.error)); return; }
    orders.unshift(data);
  }
  orders.sort((a, b) => new Date(b.due_date) - new Date(a.due_date));
  closeModal();
  render();
}

async function del(id) {
  if (!confirm('確定刪除這份敬拜順序？')) return;
  await api('DELETE', { id });
  orders = orders.filter(n => n.id !== id);
  render();
}

const urlToken = new URLSearchParams(location.search).get('token');
if (urlToken) { token = urlToken; load(); }
</script>
</body>
</html>
