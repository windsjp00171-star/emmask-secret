<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>分享卡片</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f1f6f3;color:#1b2420;min-height:100vh}
  main{width:100%;max-width:420px;padding:20px;margin:0 auto}
  .card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  .head{background:#16513d;color:#fff;padding:18px}
  .kicker{font-size:14px;opacity:.85;margin-bottom:6px}
  .title{font-size:22px;font-weight:700;line-height:1.4;word-break:break-word}
  .lines{padding:14px 18px}
  .lines p{margin:6px 0;font-size:15px;line-height:1.5;word-break:break-word}
  .brand{font-size:12px;color:#8e8e93;text-align:center;padding:0 18px 14px}
  button{display:block;width:100%;margin-top:16px;padding:16px;font-size:18px;font-weight:700;color:#fff;background:#2e9d63;border:0;border-radius:12px}
  button:disabled{opacity:.5}
  #msg{margin-top:12px;font-size:15px;text-align:center;color:#6b7a72;min-height:1.5em}
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="head"><div class="kicker" id="kicker"></div><div class="title" id="title">載入中…</div></div>
    <div class="lines" id="lines"></div>
    <div class="brand" id="brand"></div>
  </div>
  <button id="go" disabled>選朋友傳送</button>
  <div id="msg"></div>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const say = (t) => { $('msg').textContent = t; };
const clip = (s, n) => String(s == null ? '' : s).slice(0, n);

// 網址裡的內容：j＝純文字 JSON、z＝壓縮過的（deflate-raw）。內容都當文字處理，不當 HTML。
async function decode(c) {
  const kind = c[0];
  const bin = atob(c.slice(1).replace(/-/g, '+').replace(/_/g, '/'));
  const bytes = Uint8Array.from(bin, (ch) => ch.charCodeAt(0));
  if (kind === 'j') return JSON.parse(new TextDecoder().decode(bytes));
  if (kind === 'z') {
    if (typeof DecompressionStream === 'undefined') throw new Error('這支手機的瀏覽器太舊，請更新 LINE 後再試');
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return JSON.parse(await new Response(stream).text());
  }
  throw new Error('看不懂這個分享連結');
}

// 場景（s）＝橘貓底圖，跟小秘書裡看到的海報一樣；夜晚是深色底，字用白色
const sceneOf = (p) => (typeof p.s === 'string' && /^[a-z]+$/.test(p.s) ? p.s : '');
const sceneInk = (s) => (s === 'night' ? { ink: '#ffffff', soft: '#cfe9dc' } : s === 'rain' ? { ink: '#16513d', soft: '#3d5a66' } : { ink: '#16513d', soft: '#4f6b5f' });

// 整份清單每一行都是「職位：內容」才排成左右兩欄（例如服事名單）；否則一律當一般條列，避免句子裡剛好有冒號被誤拆
const PAIR = /^[^：・]{1,12}：./;
// 對方收到的卡片裡，文字不能選取、網址也不會自動變連結（LINE 的限制），
// 所以有網址的行：點文字就開、下面多一顆「🔗 開啟」。（分享的卡片只能用開網址的動作，沒有「複製」。）
const URL_RE = /https?:\/\/[^\s<>"'「」『』（）()，。、]+/;
function urlOf(x) {
  const m = String(x == null ? '' : x).match(URL_RE);
  if (!m) return null;
  const u = m[0].replace(/[.,;:!?]+$/, '');
  return u.length <= 1000 ? u : null;
}
const linkProps = (x) => { const u = urlOf(x); return u ? { action: { type: 'uri', label: '開啟連結', uri: u } } : {}; };
// 每條網址一顆「🔗 名稱」按鈕（名稱取網址前後的文字，跟小秘書裡的卡片一樣）
function linkLabel(before, after) {
  const parts = (t) => String(t).replace(/^[\s・•·\-*]*(\d{1,2}[/-]\d{1,2})?\s*(\d{1,2}:\d{2})?/, '')
    .split(/[：:，,、；;\n]/).map((p) => p.replace(/[\s「」『』（）()[\]]+/g, ' ').trim()).filter(Boolean);
  const bf = parts(before);
  if (bf.length) return bf[bf.length - 1].slice(0, 14);
  const af = parts(after);
  return af.length ? af[0].slice(0, 14) : '';
}
function linksOf(x, limit = 6) {
  const str = String(x == null ? '' : x);
  const re = new RegExp(URL_RE.source, 'g');
  const found = [];
  let m;
  while ((m = re.exec(str))) found.push({ raw: m[0], index: m.index });
  const out = [];
  found.forEach((f, i) => {
    const url = f.raw.replace(/[.,;:!?]+$/, '');
    if (url.length > 1000 || out.some((o) => o.url === url)) return;
    const before = str.slice(i ? found[i - 1].index + found[i - 1].raw.length : 0, f.index);
    const after = str.slice(f.index + f.raw.length, i + 1 < found.length ? found[i + 1].index : str.length);
    out.push({ url, label: linkLabel(before, after) });
  });
  return out.slice(0, limit);
}
const linkBtns = (x) => linksOf(x).map(({ url, label }) => ({
  type: 'button', style: 'primary', color: '#2e9d63', height: 'sm', margin: 'sm',
  action: { type: 'uri', label: `🔗 ${label || '開啟'}`.slice(0, 20), uri: url },
}));

function textRow(x) {
  return { type: 'text', text: clip(x, 120), size: 'sm', wrap: true, color: '#3a3a3c', margin: 'sm', ...linkProps(x) };
}
function pairRow(x) {
  const t = clip(x, 120);
  const c = t.indexOf('：');
  return {
    type: 'box', layout: 'horizontal', spacing: 'md', margin: 'sm',
    contents: [
      { type: 'text', text: t.slice(0, c), size: 'sm', color: '#8e8e93', flex: 4, wrap: true },
      { type: 'text', text: t.slice(c + 1), size: 'sm', weight: 'bold', color: '#1b2420', flex: 6, wrap: true },
    ],
  };
}

function cardOf(p) {
  const sc = sceneOf(p);
  if (sc) {
    // 跟小秘書裡看到的一樣：第一張是橘貓海報，往右滑是整齊的清單頁
    const { ink, soft } = sceneInk(sc);
    const all = (Array.isArray(p.l) ? p.l : []).slice(0, 40);
    const brand = { type: 'text', text: clip(p.b, 40), size: 'xxs', color: '#8e8e93', align: 'center', margin: 'md' };
    const cover = {
      type: 'bubble', size: 'mega',
      body: {
        type: 'box', layout: 'vertical', spacing: 'sm', paddingAll: '14px',
        contents: [
          {
            type: 'box', layout: 'vertical', cornerRadius: '14px',
            contents: [
              { type: 'image', url: `${location.origin}/img/scene-${sc}.png`, size: 'full', aspectRatio: '4:5', aspectMode: 'cover' },
              {
                type: 'box', layout: 'vertical', spacing: 'xs', position: 'absolute', offsetTop: '16px', offsetStart: '16px', offsetEnd: '16px',
                contents: [
                  ...(p.k ? [{ type: 'text', text: clip(p.k, 30), size: 'sm', color: soft, wrap: true }] : []),
                  { type: 'text', text: clip(p.t, 160) || '分享', size: '3xl', weight: 'bold', color: ink, wrap: true },
                ],
              },
            ],
          },
          ...(all.length ? [{ type: 'text', text: `共 ${all.length} 項，往右滑看全部 👉`, size: 'xs', color: '#8e8e93', align: 'center', margin: 'md' }] : []),
          brand,
        ],
      },
    };
    const pages = [];
    for (let i = 0; i < all.length; i += 12) pages.push(all.slice(i, i + 12));
    const asPairs = all.length > 0 && all.every((x) => PAIR.test(x));
    const detail = pages.map((rows, n) => ({
      type: 'bubble', size: 'mega',
      body: {
        type: 'box', layout: 'vertical', spacing: 'xs', paddingAll: '16px',
        contents: [
          {
            type: 'box', layout: 'vertical', backgroundColor: '#e2f6e9', cornerRadius: '12px', paddingAll: '8px', margin: 'none',
            contents: [{ type: 'text', text: `${clip(p.t, 40) || '內容'}${pages.length > 1 ? `（${n + 1}/${pages.length}）` : ''}`, size: 'sm', weight: 'bold', color: '#16513d', wrap: true }],
          },
          ...rows.flatMap((x) => (asPairs ? [pairRow(x)] : [textRow(x), ...linkBtns(x)])),
          brand,
        ],
      },
    }));
    return detail.length ? { type: 'carousel', contents: [cover, ...detail.slice(0, 11)] } : cover;
  }
  const lines = (Array.isArray(p.l) ? p.l : []).slice(0, 40).map((x) => clip(x, 120));
  const head = [
    ...(p.k ? [{ type: 'text', text: clip(p.k, 30), size: 'sm', color: '#cfe9dc' }] : []),
    { type: 'text', text: clip(p.t, 160) || '分享', size: 'xl', weight: 'bold', color: '#ffffff', wrap: true, margin: 'xs' },
  ];
  return {
    type: 'bubble', size: 'mega',
    header: { type: 'box', layout: 'vertical', backgroundColor: '#16513d', paddingAll: '18px', contents: head },
    body: lines.length ? { type: 'box', layout: 'vertical', spacing: 'sm', paddingAll: '16px',
      contents: lines.flatMap((x) => [{ type: 'text', text: x, size: 'sm', wrap: true, color: '#3a3a3c', ...linkProps(x) }, ...linkBtns(x)]) } : undefined,
    footer: { type: 'box', layout: 'vertical', paddingAll: '10px',
      contents: [{ type: 'text', text: clip(p.b, 40), size: 'xxs', color: '#8e8e93', align: 'center' }] },
  };
}

(async () => {
  try {
    // LIFF 會先把參數包進 liff.state，init 之後才還原成一般網址參數，所以兩種都要讀
    let q = new URLSearchParams(location.search);
    const st = q.get('liff.state');
    if (st) q = new URLSearchParams(st.replace(/^\//, '').replace(/^\?/, ''));
    const id = q.get('i'), c = q.get('c');
    if (!id || !c) throw new Error('這個連結不完整，請回小秘書重新按一次「分享」');
    const p = await decode(c);
    $('kicker').textContent = clip(p.k, 30);
    $('title').textContent = clip(p.t, 160) || '分享';
    const all = (Array.isArray(p.l) ? p.l : []).slice(0, 40);
    const showHint = !!sceneOf(p) && all.length > 0;
    // 有橘貓場景時，卡片內容在對方收到的輪播裡，預覽只放封面和一行說明，不把整份清單攤開
    $('lines').replaceChildren(...(showHint ? [`共 ${all.length} 項，對方收到的卡片可以往右滑看全部`] : all).map((x) => { const e = document.createElement('p'); e.textContent = clip(x, 120); if (showHint) e.style.cssText = 'color:#6b7a72;font-size:14px;text-align:center'; return e; }));
    $('brand').textContent = clip(p.b, 40);
    const sc = sceneOf(p);
    if (sc) {
      const { ink, soft } = sceneInk(sc);
      const head = document.querySelector('.head');
      head.style.cssText = `background:url(/img/scene-${sc}.png) center/cover;min-height:300px;color:${ink}`;
      $('kicker').style.color = soft;
    }
    const card = cardOf(p);
    const alt = clip([p.t, ...(p.l || [])].join(' '), 380) || '分享';

    await liff.init({ liffId: id });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const send = async () => {
      $('go').disabled = true;
      try {
        if (!liff.isApiAvailable('shareTargetPicker')) throw new Error('這裡不能選朋友傳送，請在 LINE 裡打開');
        const r = await liff.shareTargetPicker([{ type: 'flex', altText: alt, contents: card }]);
        say(r ? '已傳送 ✅' : '沒有傳送');
        if (r && liff.isInClient()) setTimeout(() => liff.closeWindow(), 700);
      } catch (e) { say(e.message || '傳送失敗，請再試一次'); }
      $('go').disabled = false;
    };
    $('go').onclick = send;
    $('go').disabled = false;
  } catch (e) {
    say(e.message || '載入失敗');
  }
})();
</script>
</body>
</html>
