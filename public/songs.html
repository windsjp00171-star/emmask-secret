<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>詩歌庫 - EmmArk</title>
<style>
  :root {
    --bg: #f4f6f4; --surface: #ffffff; --ink: #1b2420; --muted: #6b7670; --line: #e7ebe8;
    --brand: #1f6f54; --brand-ink: #16513d; --brand-soft: #e8f2ed; --radius: 14px;
    --shadow: 0 1px 2px rgba(20,40,30,.05), 0 6px 20px rgba(20,40,30,.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
  header { background: linear-gradient(135deg, #1b4536, #14352a); color: #fff; padding: 18px 28px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; box-shadow: 0 2px 12px rgba(20,40,30,.12); }
  header h1 { font-size: 18px; font-weight: 700; flex: 1; letter-spacing: .3px; }
  header a { color: rgba(255,255,255,.7); font-size: 13px; text-decoration: none; }
  header a:hover { color: #fff; }
  .container { max-width: 900px; margin: 0 auto; padding: 24px 20px 60px; }
  .btn { padding: 9px 18px; border-radius: 10px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-cancel { background: #eceeec; color: var(--ink); }
  .btn-sm { padding: 5px 11px; font-size: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
  .btn-edit { background: #5a6f66; color: #fff; }
  .btn-del { background: #e5544b; color: #fff; }
  input, textarea { padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; font-family: inherit; width: 100%; }
  input:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(31,111,84,.15); }
  .toolbar { display: flex; gap: 8px; margin-bottom: 18px; }
  .toolbar input { flex: 1; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 10px; }
  .card-head { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .card-head .title { font-weight: 700; flex: 1; }
  .card-head .tag { font-size: 12px; color: var(--muted); background: #f1f3f1; padding: 2px 8px; border-radius: 8px; }
  .card-body { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .card-body.open { display: block; }
  .lyrics { white-space: pre-wrap; font-size: 13px; color: var(--ink); line-height: 1.6; margin-bottom: 10px; }
  .history { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .actions { display: flex; gap: 6px; }
  .empty { text-align: center; color: var(--muted); padding: 48px; font-size: 15px; }
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(15,30,25,.5); z-index: 100; align-items: center; justify-content: center; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--surface); border-radius: 18px; padding: 28px; width: 100%; max-width: 480px; margin: 16px; box-shadow: 0 24px 60px rgba(0,0,0,.25); max-height: 90vh; overflow: auto; }
  .modal h3 { margin-bottom: 20px; font-size: 18px; color: var(--brand-ink); }
  .modal label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; margin-top: 14px; font-weight: 500; }
  .modal textarea { resize: vertical; min-height: 120px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 22px; justify-content: flex-end; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  #login { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(160deg, #1b4536, #0f2b22); }
  .login-box { background: var(--surface); border-radius: 20px; padding: 44px 40px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.3); min-width: 300px; }
  .login-box h2 { margin-bottom: 8px; color: var(--brand-ink); }
  .login-box p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .login-box input { margin-bottom: 14px; }
  .login-box button { width: 100%; padding: 13px; }
  #main { display: none; }
</style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <h2>詩歌庫</h2>
    <p>請輸入 Dashboard 密碼</p>
    <input type="password" id="tokenInput" placeholder="DASHBOARD_TOKEN" onkeydown="if(event.key==='Enter')doLogin()" />
    <button class="btn btn-primary" onclick="doLogin()">進入</button>
  </div>
</div>

<div class="modal-bg" id="editModal">
  <div class="modal">
    <h3 id="modalTitle">編輯歌曲</h3>
    <label>歌名 *</label>
    <input type="text" id="fTitle" />
    <div class="row3">
      <div><label>調性</label><input type="text" id="fKey" placeholder="D" /></div>
      <div><label>BPM</label><input type="text" id="fBpm" placeholder="72" /></div>
      <div><label>連結</label><input type="text" id="fLink" placeholder="https://" /></div>
    </div>
    <label>歌詞／段落結構</label>
    <textarea id="fSection" placeholder="[verse]&#10;..."></textarea>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveSong()">儲存</button>
    </div>
  </div>
</div>

<div id="main">
  <header>
    <h1>🎼 詩歌庫</h1>
    <a href="#" onclick="nav('index.html')">📋 Dashboard</a>
    <a href="#" onclick="nav('worship.html')">⛪ 服事表</a>
    <a href="#" onclick="nav('order.html')">🎵 敬拜順序</a>
    <a href="#" onclick="nav('links.html')">🔗 收藏</a>
    <a href="#" onclick="nav('meetings.html')">📝 會議記錄</a>
  </header>
  <div class="container">
    <div class="toolbar">
      <input type="text" id="search" placeholder="搜尋歌名..." oninput="render()" />
      <button class="btn btn-primary" onclick="openAdd()">＋ 新增歌曲</button>
    </div>
    <div id="list"></div>
  </div>
</div>

<script>
let token = '';
let songs = [];
let editingId = null;
let openCard = null;

function nav(page) { window.location.href = '/' + page + '?token=' + encodeURIComponent(token); }

function doLogin() {
  token = document.getElementById('tokenInput').value.trim();
  if (!token) return alert('請輸入密碼');
  localStorage.setItem('dashboardToken', token);
  load();
}

async function tryStoredLogin() {
  const saved = new URLSearchParams(location.search).get('token') || localStorage.getItem('dashboardToken');
  if (!saved) return;
  document.getElementById('login').style.display = 'none';
  const res = await fetch(`/api/dashboard/notes?token=${encodeURIComponent(saved)}&limit=1`);
  if (res.status === 401) {
    localStorage.removeItem('dashboardToken');
    document.getElementById('login').style.display = 'flex';
    return;
  }
  token = saved;
  localStorage.setItem('dashboardToken', token);
  load();
}

async function api(method, body) {
  const res = await fetch(`/api/dashboard/notes?token=${encodeURIComponent(token)}`, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { alert('密碼錯誤'); return null; }
  return res.json();
}

// 把 YouTube 網址（watch/youtu.be/shorts/embed 都支援）轉成可嵌入的 embed 網址，不是 YouTube 就回傳 null
function youtubeEmbedUrl(url) {
  let u;
  try { u = new URL(url); } catch (e) { return null; }
  const host = u.hostname.replace(/^www\./, '');
  let id = null;
  if (host === 'youtu.be') {
    id = u.pathname.slice(1);
  } else if (host === 'youtube.com' || host === 'm.youtube.com') {
    if (u.pathname === '/watch') id = u.searchParams.get('v');
    else if (u.pathname.startsWith('/embed/')) id = u.pathname.split('/')[2];
    else if (u.pathname.startsWith('/shorts/')) id = u.pathname.split('/')[2];
  }
  return id ? `https://www.youtube.com/embed/${id}` : null;
}

// 跟 lib/commands.js 的 parseSongEntry 邏輯一致：只解析前4個欄位，其餘原文保留
function parseSongEntry(content) {
  const [main, ...histParts] = content.trim().split(/｜版本紀錄[:：]/);
  const history = histParts.join('｜版本紀錄:');
  const m = main.trim().match(/^(\S+)(?:\s+(\S+))?(?:\s+(\S+))?(?:\s+(\S+))?(?:\s+([\s\S]*))?$/);
  if (!m) return { title: '', key: '', bpm: '', link: '', section: '', history };
  return { title: m[1] || '', key: m[2] || '', bpm: m[3] || '', link: m[4] || '', section: (m[5] || '').trim(), history };
}

async function load() {
  const res = await fetch(`/api/dashboard/notes?token=${encodeURIComponent(token)}&type=note&project=${encodeURIComponent('詩歌')}&limit=200`);
  if (res.status === 401) { alert('密碼錯誤'); return; }
  songs = await res.json();
  document.getElementById('login').style.display = 'none';
  document.getElementById('main').style.display = 'block';
  render();
}

function render() {
  const kw = document.getElementById('search').value.trim().toLowerCase();
  const list = document.getElementById('list');
  const parsed = songs.map(n => ({ note: n, entry: parseSongEntry(n.content || '') }))
    .filter(x => !kw || x.entry.title.toLowerCase().includes(kw));
  if (parsed.length === 0) {
    list.innerHTML = '<div class="empty">詩歌庫還沒有資料</div>';
    return;
  }
  list.innerHTML = parsed.map(({ note, entry }) => {
    const open = openCard === note.id;
    const tag = [entry.key, entry.bpm].filter(Boolean).join(' · ');
    // 只有展開的卡片才嵌入播放器，避免一次載入一堆 iframe
    const ytEmbed = (open && entry.link) ? youtubeEmbedUrl(entry.link) : null;
    const linkHtml = entry.link
      ? (ytEmbed
          ? `<div style="position:relative;width:100%;padding-top:56.25%;margin-bottom:10px;border-radius:10px;overflow:hidden">
               <iframe src="${ytEmbed}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0" allowfullscreen loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
             </div>
             <a href="${entry.link}" target="_blank" rel="noopener" style="font-size:12px;color:var(--muted)">${entry.link}</a><br>`
          : `<a href="${entry.link}" target="_blank" rel="noopener">${entry.link}</a><br>`)
      : '';
    const safeLyrics = (entry.section || '（沒有歌詞／段落資料）').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const historyHtml = entry.history ? `<div class="history">📜 版本紀錄：${entry.history}</div>` : '';
    return `<div class="card">
      <div class="card-head" onclick="toggleCard('${note.id}')">
        <span class="title">🎼 ${entry.title || '(未命名)'}</span>
        ${tag ? `<span class="tag">${tag}</span>` : ''}
      </div>
      <div class="card-body ${open ? 'open' : ''}" id="body-${note.id}">
        ${linkHtml}
        ${historyHtml}
        <div class="lyrics">${safeLyrics}</div>
        <div class="actions">
          <button class="btn-sm btn-edit" onclick="openEdit('${note.id}')">編輯</button>
          <button class="btn-sm btn-del" onclick="del('${note.id}')">刪除</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleCard(id) {
  openCard = openCard === id ? null : id;
  render();
}

function openAdd() {
  editingId = null;
  document.getElementById('modalTitle').textContent = '新增歌曲';
  document.getElementById('fTitle').value = '';
  document.getElementById('fKey').value = '';
  document.getElementById('fBpm').value = '';
  document.getElementById('fLink').value = '';
  document.getElementById('fSection').value = '';
  document.getElementById('editModal').classList.add('open');
}

function openEdit(id) {
  const note = songs.find(n => n.id === id);
  if (!note) return;
  const entry = parseSongEntry(note.content || '');
  editingId = id;
  document.getElementById('modalTitle').textContent = '編輯歌曲';
  document.getElementById('fTitle').value = entry.title;
  document.getElementById('fKey').value = entry.key;
  document.getElementById('fBpm').value = entry.bpm;
  document.getElementById('fLink').value = entry.link;
  document.getElementById('fSection').value = entry.section;
  document.getElementById('editModal').classList.add('open');
}

function closeModal() {
  document.getElementById('editModal').classList.remove('open');
}

async function saveSong() {
  const title = document.getElementById('fTitle').value.trim();
  if (!title) return alert('請填寫歌名');
  const key = document.getElementById('fKey').value.trim();
  const bpm = document.getElementById('fBpm').value.trim();
  const link = document.getElementById('fLink').value.trim();
  const section = document.getElementById('fSection').value.trim();
  const header = [title, key, bpm, link].filter(Boolean).join(' ');
  // 編輯時保留原本的版本紀錄字串，不從後台這邊動它
  let history = '';
  if (editingId) {
    const note = songs.find(n => n.id === editingId);
    const parsed = parseSongEntry(note.content || '');
    if (parsed.history) history = `\n｜版本紀錄:${parsed.history}`;
  }
  const content = [header, section].filter(Boolean).join('\n') + history;

  if (editingId) {
    const updated = await api('PATCH', { id: editingId, content });
    if (!updated) return;
    const idx = songs.findIndex(n => n.id === editingId);
    if (idx !== -1) songs[idx].content = content;
  } else {
    const data = await api('POST', { type: 'note', project: '詩歌', content });
    if (!data || data.error) { alert('新增失敗：' + (data && data.error)); return; }
    songs.unshift(data);
  }
  closeModal();
  render();
}

async function del(id) {
  if (!confirm('確定刪除這首歌？')) return;
  await api('DELETE', { id });
  songs = songs.filter(n => n.id !== id);
  render();
}

tryStoredLogin();
</script>
</body>
</html>
