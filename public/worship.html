<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>服事表 - EmmArk</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f7; color: #1d1d1f; }
    header { background: #1c1c1e; color: #fff; padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
    header h1 { font-size: 18px; font-weight: 600; flex: 1; }
    header a { color: #98989d; font-size: 13px; text-decoration: none; }
    header a:hover { color: #fff; }
    .container { max-width: 100%; padding: 20px 16px; }
    .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; font-weight: 500; }
    .btn-primary { background: #007aff; color: #fff; }
    .btn-tab { background: #e5e5ea; color: #1d1d1f; }
    .btn-tab.active { background: #007aff; color: #fff; }
    .btn-manage { background: #5856d6; color: #fff; }
    select, input[type="text"], input[type="password"], input[type="date"] {
      padding: 8px 12px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 14px; background: #fff;
    }

    /* Grid view */
    .grid-wrap { overflow-x: auto; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    table.grid { border-collapse: collapse; background: #fff; min-width: 100%; }
    table.grid th { background: #f2f2f7; padding: 10px 14px; font-size: 12px; font-weight: 600; color: #6e6e73; white-space: nowrap; border: 1px solid #e5e5ea; position: sticky; top: 0; z-index: 2; }
    table.grid th.role-col { position: sticky; left: 0; z-index: 3; min-width: 90px; }
    table.grid td { padding: 8px 12px; border: 1px solid #f2f2f7; font-size: 13px; vertical-align: top; min-width: 80px; white-space: nowrap; }
    table.grid td.role-label { background: #f9f9fb; font-weight: 600; font-size: 12px; color: #6e6e73; position: sticky; left: 0; z-index: 1; border-right: 2px solid #e5e5ea; }
    table.grid td.today-col { background: #fff8e6; }
    table.grid th.today-col { background: #ff9500 !important; color: #fff; }
    .person-chip { display: inline-block; background: #e1f0ff; color: #007aff; border-radius: 12px; padding: 2px 8px; font-size: 12px; margin: 2px; cursor: pointer; }
    .person-chip:hover { background: #007aff; color: #fff; }
    .add-chip { display: inline-block; background: #f2f2f7; color: #8e8e93; border-radius: 12px; padding: 2px 8px; font-size: 12px; margin: 2px; cursor: pointer; border: 1px dashed #c7c7cc; }
    .add-chip:hover { background: #e5e5ea; }

    /* Person view */
    .person-view { background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); overflow: hidden; }
    .person-view table { width: 100%; border-collapse: collapse; }
    .person-view th { background: #f2f2f7; padding: 12px 16px; text-align: left; font-size: 13px; font-weight: 600; color: #6e6e73; }
    .person-view td { padding: 12px 16px; border-top: 1px solid #f2f2f7; font-size: 14px; }
    .date-badge { background: #e1f0ff; color: #007aff; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .date-badge.soon { background: #ffd60a33; color: #b8860b; }
    .role-badge { display: inline-block; background: #f2f2f7; color: #1d1d1f; padding: 2px 8px; border-radius: 8px; font-size: 12px; margin: 2px; }

    /* Manage view */
    .manage-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 640px) { .manage-panels { grid-template-columns: 1fr; } }
    .manage-card { background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 20px; }
    .manage-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: #1d1d1f; }
    .manage-add-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .manage-add-row input, .manage-add-row select { flex: 1; }
    .manage-list { display: flex; flex-direction: column; gap: 6px; max-height: 420px; overflow-y: auto; }
    .manage-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: #f9f9fb; border-radius: 8px; font-size: 14px; }
    .manage-item span { color: #1d1d1f; }
    .manage-item .del-btn { background: none; border: none; color: #ff3b30; font-size: 16px; cursor: pointer; padding: 0 4px; line-height: 1; }
    .manage-item .del-btn:hover { color: #c0392b; }
    .manage-tip { font-size: 12px; color: #8e8e93; margin-top: 8px; }

    /* Login */
    #login { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { background: #fff; border-radius: 16px; padding: 40px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,.1); min-width: 280px; }
    .login-box h2 { margin-bottom: 8px; }
    .login-box p { color: #6e6e73; font-size: 14px; margin-bottom: 24px; }
    .login-box input { width: 100%; padding: 12px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 15px; margin-bottom: 12px; }
    .login-box button { width: 100%; padding: 12px; background: #007aff; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    #main { display: none; }

    /* Modal */
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100; align-items: center; justify-content: center; }
    .modal-bg.open { display: flex; }
    .modal { background: #fff; border-radius: 16px; padding: 28px; width: 100%; max-width: 420px; margin: 16px; }
    .modal h3 { margin-bottom: 20px; font-size: 17px; }
    .modal label { display: block; font-size: 13px; color: #6e6e73; margin-bottom: 4px; margin-top: 14px; }
    .modal input, .modal select { width: 100%; padding: 10px 12px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 14px; }
    .modal-actions { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; }
    .btn-cancel { background: #e5e5ea; color: #1d1d1f; }
    .btn-danger { background: #ff3b30; color: #fff; margin-right: auto; }
    .empty { text-align: center; color: #6e6e73; padding: 40px; font-size: 15px; }
    .loading { text-align: center; color: #6e6e73; padding: 60px; font-size: 15px; }
  </style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <h2>⛪ 服事表</h2>
    <p>請輸入 Dashboard 密碼</p>
    <input type="password" id="tokenInput" placeholder="DASHBOARD_TOKEN" onkeydown="if(event.key==='Enter')doLogin()" />
    <button onclick="doLogin()">進入</button>
  </div>
</div>

<!-- Edit entry modal -->
<div class="modal-bg" id="editModal">
  <div class="modal">
    <h3 id="modalTitle">編輯服事</h3>
    <label>人員名稱</label>
    <input type="text" id="editPerson" list="personList" />
    <datalist id="personList"></datalist>
    <div class="modal-actions">
      <button class="btn btn-danger" onclick="deleteEntry()">刪除</button>
      <button class="btn btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveEdit()">儲存</button>
    </div>
  </div>
</div>

<!-- Add entry modal -->
<div class="modal-bg" id="addModal">
  <div class="modal">
    <h3>新增服事</h3>
    <label>日期</label>
    <select id="addDate"></select>
    <label>職位</label>
    <select id="addRole"></select>
    <label>人員名稱</label>
    <input type="text" id="addPerson" list="personList" />
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="document.getElementById('addModal').classList.remove('open')">取消</button>
      <button class="btn btn-primary" onclick="submitAdd()">新增</button>
    </div>
  </div>
</div>

<div id="main">
  <header>
    <h1>⛪ 主日服事表</h1>
    <a href="/index.html">← 返回 Dashboard</a>
  </header>
  <div class="container">
    <div class="toolbar">
      <button class="btn btn-tab active" id="tabGrid" onclick="switchView('grid')">格狀表格</button>
      <button class="btn btn-tab" id="tabPerson" onclick="switchView('person')">人員查詢</button>
      <button class="btn btn-tab" id="tabManage" onclick="switchView('manage')">⚙ 管理</button>
      <button class="btn btn-primary" id="addEntryBtn" onclick="openAddModal()" style="margin-left:auto">＋ 新增服事</button>
    </div>

    <div id="gridView">
      <div class="loading" id="gridLoading">載入中…</div>
      <div class="grid-wrap" id="gridWrap" style="display:none"></div>
    </div>

    <div id="personView" style="display:none">
      <div class="toolbar" style="margin-bottom:16px">
        <select id="personSelect" onchange="renderPersonView()">
          <option value="">— 選擇人員 —</option>
        </select>
      </div>
      <div class="person-view" id="personTable"></div>
    </div>

    <div id="manageView" style="display:none">
      <div class="manage-panels">
        <!-- Dates panel -->
        <div class="manage-card">
          <h3>📅 主日日期管理</h3>
          <div class="manage-add-row">
            <input type="date" id="newDateInput" />
            <button class="btn btn-primary" onclick="addDate()">新增</button>
          </div>
          <div class="manage-list" id="datesList"></div>
          <p class="manage-tip">刪除日期不會刪除該日的服事記錄，僅移除格子顯示。</p>
        </div>
        <!-- Roles panel -->
        <div class="manage-card">
          <h3>🎼 職位管理</h3>
          <div class="manage-add-row">
            <input type="text" id="newRoleInput" placeholder="新職位名稱" onkeydown="if(event.key==='Enter')addRole()" />
            <button class="btn btn-primary" onclick="addRole()">新增</button>
          </div>
          <div class="manage-list" id="rolesList"></div>
          <p class="manage-tip">新增職位會排在最後，刪除不影響已存在的服事記錄。</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let token = '';
let allData = [];   // worship_schedule rows
let allDates = [];  // worship_dates rows [{id, service_date}]
let allRoles = [];  // worship_roles rows [{id, role_name, sort_order}]
let editingId = null;

function doLogin() {
  token = document.getElementById('tokenInput').value.trim();
  if (!token) return alert('請輸入密碼');
  loadAll();
}

async function apiFetch(path, method = 'GET', body) {
  const res = await fetch(`${path}${path.includes('?') ? '&' : '?'}token=${encodeURIComponent(token)}`, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { alert('密碼錯誤'); return null; }
  return res.json();
}

function scheduleApi(method, body) { return apiFetch('/api/worship/schedule', method, body); }
function configApi(resource, method, body) { return apiFetch(`/api/worship/config?resource=${resource}`, method, body); }

async function loadAll() {
  const [scheduleData, datesData, rolesData] = await Promise.all([
    scheduleApi('GET'),
    configApi('dates', 'GET'),
    configApi('roles', 'GET'),
  ]);
  if (!scheduleData || !datesData || !rolesData) return;
  allData = scheduleData;
  allDates = datesData;
  allRoles = rolesData;

  document.getElementById('login').style.display = 'none';
  document.getElementById('main').style.display = 'block';

  buildPersonList();
  populateDateSelect();
  populateRoleSelect();
  renderGridView();
  renderManageView();
}

function buildPersonList() {
  const people = [...new Set(allData.map(d => d.person_name))].sort();
  const dl = document.getElementById('personList');
  dl.innerHTML = people.map(p => `<option value="${p}">`).join('');
  const sel = document.getElementById('personSelect');
  sel.innerHTML = '<option value="">— 選擇人員 —</option>' +
    people.map(p => `<option value="${p}">${p}</option>`).join('');
}

function populateDateSelect() {
  const sel = document.getElementById('addDate');
  sel.innerHTML = allDates.map(d => {
    const dt = new Date(d.service_date + 'T00:00:00+08:00');
    const label = dt.toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', weekday: 'short', timeZone: 'Asia/Taipei' });
    return `<option value="${d.service_date}">${label}</option>`;
  }).join('');
}

function populateRoleSelect() {
  const sel = document.getElementById('addRole');
  sel.innerHTML = allRoles.map(r => `<option value="${r.role_name}">${r.role_name}</option>`).join('');
}

function renderGridView() {
  document.getElementById('gridLoading').style.display = 'none';
  const gridWrap = document.getElementById('gridWrap');
  gridWrap.style.display = '';

  const dates = allDates.map(d => d.service_date);
  const roles = allRoles.map(r => r.role_name);
  const today = new Date().toISOString().split('T')[0];
  const todayIdx = dates.findIndex(d => d >= today);

  const lookup = {};
  allData.forEach(item => {
    if (!lookup[item.role]) lookup[item.role] = {};
    if (!lookup[item.role][item.service_date]) lookup[item.role][item.service_date] = [];
    lookup[item.role][item.service_date].push({ id: item.id, name: item.person_name });
  });

  // Any roles in data not yet in worship_roles
  Object.keys(lookup).forEach(r => { if (!roles.includes(r)) roles.push(r); });

  let html = '<table class="grid"><thead><tr>';
  html += '<th class="role-col">職位 \\ 日期</th>';
  dates.forEach((d, i) => {
    const dt = new Date(d + 'T00:00:00+08:00');
    const label = dt.toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', timeZone: 'Asia/Taipei' });
    const wday = dt.toLocaleDateString('zh-TW', { weekday: 'short', timeZone: 'Asia/Taipei' });
    const cls = (i === todayIdx) ? 'today-col' : '';
    html += `<th class="${cls}">${label}<br><small>${wday}</small></th>`;
  });
  html += '</tr></thead><tbody>';

  roles.forEach(role => {
    html += '<tr>';
    html += `<td class="role-label">${role}</td>`;
    dates.forEach((d, i) => {
      const cls = (i === todayIdx) ? 'today-col' : '';
      const persons = lookup[role] && lookup[role][d] ? lookup[role][d] : [];
      html += `<td class="${cls}">`;
      persons.forEach(p => {
        html += `<span class="person-chip" onclick="openEditModal('${p.id}','${esc(p.name)}','${esc(role)}','${d}')">${esc(p.name)}</span>`;
      });
      html += `<span class="add-chip" onclick="openAddModalFor('${d}','${esc(role)}')">＋</span>`;
      html += '</td>';
    });
    html += '</tr>';
  });

  html += '</tbody></table>';
  gridWrap.innerHTML = html;
}

function renderPersonView() {
  const person = document.getElementById('personSelect').value;
  const el = document.getElementById('personTable');
  if (!person) { el.innerHTML = '<div class="empty">請選擇一位人員</div>'; return; }

  const today = new Date().toISOString().split('T')[0];
  const items = allData.filter(d => d.person_name === person).sort((a, b) => a.service_date.localeCompare(b.service_date));
  if (items.length === 0) { el.innerHTML = '<div class="empty">找不到此人的服事記錄</div>'; return; }

  const byDate = {};
  items.forEach(item => {
    if (!byDate[item.service_date]) byDate[item.service_date] = [];
    byDate[item.service_date].push(item.role);
  });

  let html = '<table><thead><tr><th>日期</th><th>職位</th></tr></thead><tbody>';
  Object.entries(byDate).forEach(([date, roles]) => {
    const dt = new Date(date + 'T00:00:00+08:00');
    const label = dt.toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', weekday: 'short', timeZone: 'Asia/Taipei' });
    const isPast = date < today;
    const isSoon = !isPast && date <= new Date(Date.now() + 14*24*60*60*1000).toISOString().split('T')[0];
    const badgeCls = isSoon ? 'date-badge soon' : 'date-badge';
    html += `<tr${isPast ? ' style="opacity:.45"' : ''}>`;
    html += `<td><span class="${badgeCls}">${label}</span></td>`;
    html += `<td>${roles.map(r => `<span class="role-badge">${esc(r)}</span>`).join(' ')}</td>`;
    html += '</tr>';
  });
  html += '</tbody></table>';
  el.innerHTML = html;
}

function renderManageView() {
  // Dates list
  const dl = document.getElementById('datesList');
  dl.innerHTML = allDates.map(d => {
    const dt = new Date(d.service_date + 'T00:00:00+08:00');
    const label = dt.toLocaleDateString('zh-TW', { year: 'numeric', month: 'numeric', day: 'numeric', weekday: 'short', timeZone: 'Asia/Taipei' });
    return `<div class="manage-item">
      <span>${label}</span>
      <button class="del-btn" onclick="deleteDate('${d.id}','${d.service_date}')" title="刪除">✕</button>
    </div>`;
  }).join('') || '<div class="empty" style="padding:20px">尚無日期</div>';

  // Roles list
  const rl = document.getElementById('rolesList');
  rl.innerHTML = allRoles.map((r, idx) => `<div class="manage-item">
    <span>${idx + 1}. ${esc(r.role_name)}</span>
    <button class="del-btn" onclick="deleteRole('${r.id}','${esc(r.role_name)}')" title="刪除">✕</button>
  </div>`).join('') || '<div class="empty" style="padding:20px">尚無職位</div>';
}

function switchView(view) {
  ['grid','person','manage'].forEach(v => {
    document.getElementById(v + 'View').style.display = v === view ? '' : 'none';
    document.getElementById('tab' + v[0].toUpperCase() + v.slice(1)).classList.toggle('active', v === view);
  });
  document.getElementById('addEntryBtn').style.display = view === 'manage' ? 'none' : '';
}

function openEditModal(id, name, role, date) {
  editingId = id;
  const dt = new Date(date + 'T00:00:00+08:00');
  const label = dt.toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', timeZone: 'Asia/Taipei' });
  document.getElementById('modalTitle').textContent = `${label} ${role}`;
  document.getElementById('editPerson').value = name;
  document.getElementById('editModal').classList.add('open');
}

function closeModal() {
  document.getElementById('editModal').classList.remove('open');
  editingId = null;
}

async function saveEdit() {
  const person_name = document.getElementById('editPerson').value.trim();
  if (!person_name) return alert('請填寫人員名稱');
  const res = await scheduleApi('PATCH', { id: editingId, person_name });
  if (!res) return;
  const item = allData.find(d => d.id === editingId);
  if (item) item.person_name = person_name;
  closeModal();
  buildPersonList();
  renderGridView();
}

async function deleteEntry() {
  if (!confirm('確定刪除此服事？')) return;
  await scheduleApi('DELETE', { id: editingId });
  allData = allData.filter(d => d.id !== editingId);
  closeModal();
  buildPersonList();
  renderGridView();
}

function openAddModal() {
  document.getElementById('addPerson').value = '';
  document.getElementById('addModal').classList.add('open');
}

function openAddModalFor(date, role) {
  document.getElementById('addDate').value = date;
  document.getElementById('addRole').value = role;
  document.getElementById('addPerson').value = '';
  document.getElementById('addModal').classList.add('open');
}

async function submitAdd() {
  const service_date = document.getElementById('addDate').value;
  const role = document.getElementById('addRole').value;
  const person_name = document.getElementById('addPerson').value.trim();
  if (!person_name) return alert('請填寫人員名稱');
  const data = await scheduleApi('POST', { service_date, role, person_name });
  if (!data || data.error) return alert(data?.error || '新增失敗');
  allData.push(data);
  document.getElementById('addModal').classList.remove('open');
  buildPersonList();
  renderGridView();
}

// Management actions

async function addDate() {
  const val = document.getElementById('newDateInput').value;
  if (!val) return alert('請選擇日期');
  const data = await configApi('dates', 'POST', { service_date: val });
  if (!data || data.error) return alert(data?.error || '新增失敗');
  allDates.push(data);
  allDates.sort((a, b) => a.service_date.localeCompare(b.service_date));
  document.getElementById('newDateInput').value = '';
  populateDateSelect();
  renderManageView();
  renderGridView();
}

async function deleteDate(id, dateStr) {
  if (!confirm(`確定刪除 ${dateStr}？`)) return;
  const res = await configApi('dates', 'DELETE', { id });
  if (!res) return;
  allDates = allDates.filter(d => d.id !== id);
  populateDateSelect();
  renderManageView();
  renderGridView();
}

async function addRole() {
  const val = document.getElementById('newRoleInput').value.trim();
  if (!val) return alert('請填寫職位名稱');
  const data = await configApi('roles', 'POST', { role_name: val });
  if (!data || data.error) return alert(data?.error || '新增失敗');
  allRoles.push(data);
  document.getElementById('newRoleInput').value = '';
  populateRoleSelect();
  renderManageView();
  renderGridView();
}

async function deleteRole(id, roleName) {
  if (!confirm(`確定刪除職位「${roleName}」？`)) return;
  const res = await configApi('roles', 'DELETE', { id });
  if (!res) return;
  allRoles = allRoles.filter(r => r.id !== id);
  populateRoleSelect();
  renderManageView();
  renderGridView();
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Check for token in URL
const urlToken = new URLSearchParams(location.search).get('token');
if (urlToken) { token = urlToken; loadAll(); }
</script>
</body>
</html>
