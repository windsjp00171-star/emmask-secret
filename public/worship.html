<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>服事表 - EmmArk 小秘書</title>
  <link rel="stylesheet" href="/app.css">
  <style>
    .app.wide { max-width: none; border: none; }
    .wrap { max-width: 760px; width: 100%; }
    .tabs { justify-content: flex-start; padding: 0; }
    .tabs .tab { flex: 0 0 auto; padding: 0 22px; }
    .tabs .tab[aria-selected="true"]::after { left: 14px; right: 14px; }
    main { flex: 1; padding-bottom: 32px; }

    /* Grid */
    .grid-wrap { overflow: auto; max-height: calc(100vh - 112px); -webkit-overflow-scrolling: touch; }
    table.grid { border-collapse: separate; border-spacing: 0; min-width: 100%; font-size: 14px; }
    .grid th, .grid td { border-bottom: 1px solid var(--line); vertical-align: middle; }
    .grid thead th { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 10px 8px 8px; text-align: left; font-weight: 400; white-space: nowrap; }
    .grid thead th .d { display: block; font-size: 17px; font-weight: 700; color: var(--ink); }
    .grid thead th .w { display: block; font-size: 12px; color: var(--ink-3); }
    .grid thead th.next .d { color: var(--ink); }
    .grid thead th.next .w { display: inline-block; margin-top: 2px; color: #fff; background: var(--ink); border-radius: 9px; padding: 0 7px; font-weight: 600; }
    .grid thead th.past .d { color: var(--ink-3); font-weight: 600; }
    .grid .role { position: sticky; left: 0; z-index: 1; background: var(--bg); padding: 8px 10px 8px 16px; font-size: 13px; font-weight: 600; color: var(--ink-2); width: 88px; min-width: 88px; text-align: left; line-height: 1.3; border-right: 1px solid var(--line); }
    .grid thead th.role { z-index: 3; color: var(--ink-3); font-size: 12px; font-weight: 600; vertical-align: bottom; }
    .grid td.cell { padding: 6px 8px; }
    @media (min-width: 800px) { .grid td.cell, .grid thead th:not(.role) { min-width: 176px; } .grid .role { max-width: none; white-space: nowrap; } }
    .grid td.cell.next, .grid thead th.next { background: #f6f7f8; }
    .grid td.cell.past { opacity: .55; }
    .grid tbody tr:hover .role, .grid tbody tr:hover td.cell:not(.next) { background: #fafafb; }
    .cell-inner { display: flex; flex-wrap: nowrap; gap: 4px; align-items: center; min-height: 32px; }
    .person { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px 0 3px; border-radius: 15px; background: var(--bg); border: 1px solid var(--line); font-size: 14px; white-space: nowrap; }
    .person:hover { border-color: #c9ccd0; }
    .initial { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: none; }
    .add-cell { width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-3); opacity: .45; }
    .add-cell:hover, .add-cell:focus-visible { opacity: 1; background: var(--fill); color: var(--green-ink); }
    .add-cell .icon { width: 16px; height: 16px; }
    .loading { padding: 72px 24px; text-align: center; color: var(--ink-2); }

    /* Person + manage lists */
    .row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
    .row-text { flex: 1; min-width: 0; }
    .row-title { display: block; font-size: 15px; font-weight: 600; }
    .row-sub { display: block; font-size: 13px; color: var(--ink-2); margin-top: 2px; }
    .row.past { opacity: .5; }
    .date-avatar { width: 44px; height: 44px; border-radius: 12px; background: var(--fill); display: inline-flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; flex: none; }
    .date-avatar b { font-size: 16px; }
    .date-avatar small { font-size: 11px; color: var(--ink-2); }
    .date-avatar.soon { background: var(--ink); color: #fff; }
    .date-avatar.soon small { color: rgba(255,255,255,.8); }
    .soon-tag { color: var(--ink); font-weight: 700; }
    .section-title { padding: 18px 16px 6px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
    .add-row { display: flex; gap: 8px; padding: 6px 16px 10px; }
    .add-row input { flex: 1; min-width: 0; height: 42px; border: 1px solid var(--line); background: var(--fill); border-radius: 10px; padding: 0 12px; font-size: 15px; }
    .add-row input:focus { outline: none; border-color: var(--green); background: var(--bg); }
    .add-row .btn { height: 42px; flex: none; }
    .manage-item { display: flex; align-items: center; gap: 12px; padding: 4px 4px 4px 16px; min-height: 52px; border-bottom: 1px solid var(--line); }
    .manage-item span { flex: 1; }
    .manage-item .order { color: var(--ink-3); width: 24px; flex: none; }
    .del { color: var(--ink-3); }
    .del:hover { color: var(--red); background: var(--red-tint); }
    .tip { padding: 8px 16px 0; font-size: 13px; color: var(--ink-2); }
    .manage-panels { display: grid; grid-template-columns: 1fr; }
    @media (min-width: 900px) { .manage-panels { grid-template-columns: 1fr 1fr; gap: 0 24px; } }
  </style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10 11v5.5M14 11v5.5"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
</svg>

<div class="login" id="login">
  <form class="login-box" onsubmit="event.preventDefault(); doLogin()">
    <h2>服事表</h2>
    <p>輸入 Dashboard 密碼</p>
    <input type="password" id="tokenInput" placeholder="密碼" autocomplete="current-password" aria-label="Dashboard 密碼" />
    <div class="err" id="loginErr" role="alert"></div>
    <button class="btn btn-primary" type="submit">進入</button>
  </form>
</div>

<div class="app wide" id="main" hidden>
  <div class="topbar">
    <div class="titlebar">
      <a class="icon-btn" id="backLink" href="/index.html" aria-label="返回小秘書" title="返回小秘書"><svg class="icon"><use href="#i-back"/></svg></a>
      <h1>服事表<span class="sub num" id="summary"></span></h1>
      <button class="icon-btn" id="addEntryBtn" onclick="openAddModal()" aria-label="新增服事" title="新增服事"><svg class="icon"><use href="#i-plus"/></svg></button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabGrid" aria-selected="true" onclick="switchView('grid')">排班表</button>
      <button class="tab" role="tab" id="tabPerson" aria-selected="false" onclick="switchView('person')">人員</button>
      <button class="tab" role="tab" id="tabManage" aria-selected="false" onclick="switchView('manage')">管理</button>
    </div>
  </div>

  <main>
    <div id="gridView">
      <div class="loading" id="gridLoading">載入中…</div>
      <div class="grid-wrap" id="gridWrap" hidden></div>
    </div>

    <div id="personView" class="wrap" hidden>
      <div class="chips" id="personChips" aria-label="人員"></div>
      <div id="personTable"></div>
    </div>

    <div id="manageView" class="wrap" hidden>
      <div class="manage-panels">
        <section>
          <h2 class="section-title">主日日期</h2>
          <form class="add-row" onsubmit="event.preventDefault(); addDate()">
            <input type="date" id="newDateInput" aria-label="新增日期" />
            <button class="btn btn-primary" type="submit">新增</button>
          </form>
          <div id="datesList"></div>
          <p class="tip">刪除日期只會從排班表移除那一欄，不會刪掉當天的服事記錄。</p>
        </section>
        <section>
          <h2 class="section-title">職位</h2>
          <form class="add-row" onsubmit="event.preventDefault(); addRole()">
            <input type="text" id="newRoleInput" placeholder="新職位名稱" aria-label="新職位名稱" />
            <button class="btn btn-primary" type="submit">新增</button>
          </form>
          <div id="rolesList"></div>
          <p class="tip">新職位會排在最後。刪除職位不影響已經排好的服事。</p>
        </section>
      </div>
    </div>
  </main>
</div>

<!-- Edit entry sheet -->
<div class="scrim" id="editModal" hidden onclick="if (event.target === this) closeModal()">
  <form class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle" onsubmit="event.preventDefault(); saveEdit()">
    <div class="grabber"></div>
    <div class="sheet-head">
      <h2 id="modalTitle">編輯服事</h2>
      <button class="icon-btn" type="button" onclick="closeModal()" aria-label="關閉"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
    <label class="field"><span>人員名稱</span><input type="text" id="editPerson" list="personList" required /></label>
    <datalist id="personList"></datalist>
    <div class="sheet-actions">
      <button class="btn btn-danger" type="button" onclick="deleteEntry()">刪除</button>
      <button class="btn btn-primary" type="submit">儲存</button>
    </div>
  </form>
</div>

<!-- Add entry sheet -->
<div class="scrim" id="addModal" hidden onclick="if (event.target === this) closeAddModal()">
  <form class="sheet" role="dialog" aria-modal="true" aria-labelledby="addTitle" onsubmit="event.preventDefault(); submitAdd()">
    <div class="grabber"></div>
    <div class="sheet-head">
      <h2 id="addTitle">新增服事</h2>
      <button class="icon-btn" type="button" onclick="closeAddModal()" aria-label="關閉"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
    <label class="field"><span>日期</span><select id="addDate"></select></label>
    <label class="field"><span>職位</span><select id="addRole"></select></label>
    <label class="field"><span>人員名稱</span><input type="text" id="addPerson" list="personList" required /></label>
    <div class="sheet-actions">
      <button class="btn btn-ghost" type="button" onclick="closeAddModal()">取消</button>
      <button class="btn btn-primary" type="submit">新增</button>
    </div>
  </form>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
let token = '';
let allData = [];   // worship_schedule rows
let allDates = [];  // worship_dates rows [{id, service_date}]
let allRoles = [];  // worship_roles rows [{id, role_name, sort_order}]
let editingId = null;
let activePerson = '';

const TZ = 'Asia/Taipei';
const TINTS = [['#eaf0fa', '#3f67a8'], ['#fff3e0', '#a34f00'], ['#f1ecfb', '#6b46c1'], ['#fdecee', '#b81d30'], ['#e8f6f8', '#126c7a']];

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function todayKey() { return new Date().toLocaleDateString('en-CA', { timeZone: TZ }); }
function dt(d) { return new Date(d + 'T00:00:00+08:00'); }
function md(d) { return dt(d).toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', timeZone: TZ }); }
function wd(d) { return dt(d).toLocaleDateString('zh-TW', { weekday: 'short', timeZone: TZ }); }
function daysUntil(d) { return Math.round((dt(d) - dt(todayKey())) / 86400000); }
function tint(name) {
  let h = 0; for (const ch of name) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return TINTS[h % TINTS.length];
}
function initial(name) {
  const [bg, fg] = tint(name);
  return `<span class="initial" style="background:${bg};color:${fg}" aria-hidden="true">${esc([...name][0] || '?')}</span>`;
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => { t.hidden = true; }, 2400);
}

function doLogin() {
  token = document.getElementById('tokenInput').value.trim();
  if (!token) { document.getElementById('loginErr').textContent = '請輸入密碼'; return; }
  loadAll();
}

async function apiFetch(path, method = 'GET', body) {
  const res = await fetch(`${path}${path.includes('?') ? '&' : '?'}token=${encodeURIComponent(token)}`, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) {
    document.getElementById('login').hidden = false;
    document.getElementById('main').hidden = true;
    document.getElementById('loginErr').textContent = '密碼錯誤，請再試一次';
    return null;
  }
  const data = await res.json();
  if (data && data.error) { toast('發生錯誤：' + data.error); return null; }
  return data;
}

function scheduleApi(method, body) { return apiFetch('/api/worship/schedule', method, body); }
function configApi(resource, method, body) { return apiFetch(`/api/worship/config?resource=${resource}`, method, body); }

async function loadAll() {
  const [scheduleData, datesData, rolesData] = await Promise.all([
    scheduleApi('GET'),
    configApi('dates', 'GET'),
    configApi('roles', 'GET'),
  ]);
  if (!scheduleData || !datesData || !rolesData) return;
  allData = scheduleData;
  allDates = datesData;
  allRoles = rolesData;

  document.getElementById('login').hidden = true;
  document.getElementById('main').hidden = false;
  document.getElementById('backLink').href = '/index.html?token=' + encodeURIComponent(token);

  buildPersonList();
  populateDateSelect();
  populateRoleSelect();
  renderGridView(true);
  renderManageView();
}

function nextDate() { const t = todayKey(); return allDates.map(d => d.service_date).find(d => d >= t); }

function renderSummary() {
  const n = nextDate();
  if (!n) { document.getElementById('summary').textContent = '目前沒有排定的主日'; return; }
  const left = daysUntil(n);
  const count = allData.filter(d => d.service_date === n).length;
  document.getElementById('summary').textContent =
    `下一次主日 ${md(n)}（${wd(n).replace('週', '')}）・${left === 0 ? '就是今天' : `還有 ${left} 天`}・${count} 人服事`;
}

function buildPersonList() {
  const people = [...new Set(allData.map(d => d.person_name))].sort((a, b) => a.localeCompare(b, 'zh-TW'));
  document.getElementById('personList').innerHTML = people.map(p => `<option value="${esc(p)}">`).join('');
  if (activePerson && !people.includes(activePerson)) activePerson = '';
  document.getElementById('personChips').innerHTML = people.map(p =>
    `<button class="chip" aria-pressed="${activePerson === p}" data-person="${esc(p)}">${esc(p)}</button>`).join('');
  renderPersonView();
}
document.getElementById('personChips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  activePerson = b.dataset.person;
  document.querySelectorAll('#personChips .chip').forEach(c => c.setAttribute('aria-pressed', String(c === b)));
  renderPersonView();
});

function populateDateSelect() {
  document.getElementById('addDate').innerHTML = allDates.map(d =>
    `<option value="${esc(d.service_date)}">${md(d.service_date)}（${wd(d.service_date)}）</option>`).join('');
  const n = nextDate(); if (n) document.getElementById('addDate').value = n;
}

function populateRoleSelect() {
  document.getElementById('addRole').innerHTML = allRoles.map(r => `<option value="${esc(r.role_name)}">${esc(r.role_name)}</option>`).join('');
}

function renderGridView(scrollToNext) {
  renderSummary();
  document.getElementById('gridLoading').hidden = true;
  const gridWrap = document.getElementById('gridWrap');
  gridWrap.hidden = false;

  const dates = allDates.map(d => d.service_date);
  const roles = allRoles.map(r => r.role_name);
  const today = todayKey();
  const next = nextDate();

  const lookup = {};
  allData.forEach(item => {
    if (!lookup[item.role]) lookup[item.role] = {};
    if (!lookup[item.role][item.service_date]) lookup[item.role][item.service_date] = [];
    lookup[item.role][item.service_date].push({ id: item.id, name: item.person_name });
  });

  // Any roles in data not yet in worship_roles
  Object.keys(lookup).forEach(r => { if (!roles.includes(r)) roles.push(r); });

  if (dates.length === 0) {
    gridWrap.innerHTML = '<div class="empty"><strong>還沒有主日日期</strong>到「管理」新增日期後，這裡就會出現排班格。</div>';
    return;
  }

  const colCls = d => d === next ? 'next' : d < today ? 'past' : '';
  let html = '<table class="grid"><thead><tr><th class="role">職位</th>';
  dates.forEach(d => {
    html += `<th class="${colCls(d)}" data-date="${esc(d)}"><span class="d num">${md(d)}</span><span class="w">${d === next ? '下一次' : wd(d)}</span></th>`;
  });
  html += '</tr></thead><tbody>';

  roles.forEach(role => {
    html += `<tr><th class="role" scope="row">${esc(role)}</th>`;
    dates.forEach(d => {
      const persons = (lookup[role] && lookup[role][d]) || [];
      html += `<td class="cell ${colCls(d)}"><div class="cell-inner">`;
      persons.forEach(p => {
        html += `<button class="person" data-act="edit" data-id="${esc(p.id)}" data-name="${esc(p.name)}" data-role="${esc(role)}" data-date="${esc(d)}">${initial(p.name)}${esc(p.name)}</button>`;
      });
      html += `<button class="add-cell" data-act="add" data-role="${esc(role)}" data-date="${esc(d)}" aria-label="新增 ${md(d)} ${esc(role)}"><svg class="icon"><use href="#i-plus"/></svg></button>`;
      html += '</div></td>';
    });
    html += '</tr>';
  });

  html += '</tbody></table>';
  gridWrap.innerHTML = html;

  if (scrollToNext && next) {
    const th = gridWrap.querySelector(`thead th[data-date="${next}"]`);
    const roleCol = gridWrap.querySelector('thead th.role');
    if (th) gridWrap.scrollLeft = Math.max(0, th.offsetLeft - roleCol.offsetWidth);
  }
}
document.getElementById('gridWrap').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (b.dataset.act === 'edit') openEditModal(b.dataset.id, b.dataset.name, b.dataset.role, b.dataset.date);
  else openAddModalFor(b.dataset.date, b.dataset.role);
});

function renderPersonView() {
  const el = document.getElementById('personTable');
  const person = activePerson;
  if (!person) { el.innerHTML = '<div class="empty"><strong>選一位人員</strong>點上方的名字，看他所有的服事。</div>'; return; }

  const today = todayKey();
  const items = allData.filter(d => d.person_name === person).sort((a, b) => a.service_date.localeCompare(b.service_date));
  if (items.length === 0) { el.innerHTML = '<div class="empty"><strong>沒有服事記錄</strong></div>'; return; }

  const byDate = {};
  items.forEach(item => { (byDate[item.service_date] ||= []).push(item.role); });
  const entries = Object.entries(byDate);
  const upcoming = entries.filter(([d]) => d >= today);
  const past = entries.filter(([d]) => d < today).reverse();

  const row = ([date, roles], isPast) => {
    const left = daysUntil(date);
    const soon = !isPast && left <= 14;
    const when = isPast ? `${wd(date)}` : left === 0 ? '<span class="soon-tag">今天</span>' : soon ? `${wd(date)}・<span class="soon-tag">還有 ${left} 天</span>` : `${wd(date)}・還有 ${left} 天`;
    const [m, d] = md(date).split('/');
    return `<div class="row ${isPast ? 'past' : ''}">
      <span class="date-avatar num ${soon ? 'soon' : ''}"><b>${esc(d)}</b><small>${esc(m)} 月</small></span>
      <span class="row-text"><span class="row-title">${roles.map(esc).join('、')}</span><span class="row-sub num">${when}</span></span>
    </div>`;
  };
  el.innerHTML =
    (upcoming.length ? `<div class="sep"><span>接下來 ${upcoming.length} 次</span></div>` + upcoming.map(e => row(e, false)).join('') : '<div class="sep"><span>接下來沒有排到</span></div>') +
    (past.length ? `<div class="sep"><span>已經服事過 ${past.length} 次</span></div>` + past.map(e => row(e, true)).join('') : '');
}

function renderManageView() {
  document.getElementById('datesList').innerHTML = allDates.map(d =>
    `<div class="manage-item"><span class="num">${md(d.service_date)}（${wd(d.service_date)}）</span>
      <button class="icon-btn del" onclick="deleteDate('${esc(d.id)}','${esc(d.service_date)}')" aria-label="刪除 ${md(d.service_date)}"><svg class="icon"><use href="#i-trash"/></svg></button></div>`
  ).join('') || '<div class="empty" style="padding:24px">尚無日期</div>';

  document.getElementById('rolesList').innerHTML = allRoles.map((r, idx) =>
    `<div class="manage-item"><span class="order num">${idx + 1}</span><span>${esc(r.role_name)}</span>
      <button class="icon-btn del" onclick="deleteRole('${esc(r.id)}', this.dataset.name)" data-name="${esc(r.role_name)}" aria-label="刪除 ${esc(r.role_name)}"><svg class="icon"><use href="#i-trash"/></svg></button></div>`
  ).join('') || '<div class="empty" style="padding:24px">尚無職位</div>';
}

function switchView(view) {
  ['grid', 'person', 'manage'].forEach(v => {
    document.getElementById(v + 'View').hidden = v !== view;
    document.getElementById('tab' + v[0].toUpperCase() + v.slice(1)).setAttribute('aria-selected', String(v === view));
  });
  document.getElementById('addEntryBtn').hidden = view === 'manage';
}

function openEditModal(id, name, role, date) {
  editingId = id;
  document.getElementById('modalTitle').textContent = `${md(date)} ${role}`;
  document.getElementById('editPerson').value = name;
  document.getElementById('editModal').hidden = false;
  document.getElementById('editPerson').focus();
}

function closeModal() {
  document.getElementById('editModal').hidden = true;
  editingId = null;
}

function closeAddModal() { document.getElementById('addModal').hidden = true; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeAddModal(); } });

async function saveEdit() {
  const person_name = document.getElementById('editPerson').value.trim();
  if (!person_name) return;
  const res = await scheduleApi('PATCH', { id: editingId, person_name });
  if (!res) return;
  const item = allData.find(d => String(d.id) === String(editingId));
  if (item) item.person_name = person_name;
  closeModal();
  buildPersonList();
  renderGridView();
  toast('已儲存');
}

async function deleteEntry() {
  if (!confirm('確定刪除這筆服事？')) return;
  const res = await scheduleApi('DELETE', { id: editingId });
  if (!res) return;
  allData = allData.filter(d => String(d.id) !== String(editingId));
  closeModal();
  buildPersonList();
  renderGridView();
  toast('已刪除');
}

function openAddModal() {
  populateDateSelect();
  document.getElementById('addPerson').value = '';
  document.getElementById('addModal').hidden = false;
  document.getElementById('addPerson').focus();
}

function openAddModalFor(date, role) {
  document.getElementById('addDate').value = date;
  document.getElementById('addRole').value = role;
  document.getElementById('addPerson').value = '';
  document.getElementById('addModal').hidden = false;
  document.getElementById('addPerson').focus();
}

async function submitAdd() {
  const service_date = document.getElementById('addDate').value;
  const role = document.getElementById('addRole').value;
  const person_name = document.getElementById('addPerson').value.trim();
  if (!person_name) return;
  const data = await scheduleApi('POST', { service_date, role, person_name });
  if (!data) return;
  allData.push(data);
  closeAddModal();
  buildPersonList();
  renderGridView();
  toast('已新增');
}

// Management actions

async function addDate() {
  const val = document.getElementById('newDateInput').value;
  if (!val) { toast('請先選擇日期'); return; }
  const data = await configApi('dates', 'POST', { service_date: val });
  if (!data) return;
  allDates.push(data);
  allDates.sort((a, b) => a.service_date.localeCompare(b.service_date));
  document.getElementById('newDateInput').value = '';
  populateDateSelect();
  renderManageView();
  renderGridView();
}

async function deleteDate(id, dateStr) {
  if (!confirm(`確定刪除 ${md(dateStr)} 這一欄？`)) return;
  const res = await configApi('dates', 'DELETE', { id });
  if (!res) return;
  allDates = allDates.filter(d => String(d.id) !== String(id));
  populateDateSelect();
  renderManageView();
  renderGridView();
}

async function addRole() {
  const val = document.getElementById('newRoleInput').value.trim();
  if (!val) { toast('請先輸入職位名稱'); return; }
  const data = await configApi('roles', 'POST', { role_name: val });
  if (!data) return;
  allRoles.push(data);
  document.getElementById('newRoleInput').value = '';
  populateRoleSelect();
  renderManageView();
  renderGridView();
}

async function deleteRole(id, roleName) {
  if (!confirm(`確定刪除職位「${roleName}」？`)) return;
  const res = await configApi('roles', 'DELETE', { id });
  if (!res) return;
  allRoles = allRoles.filter(r => String(r.id) !== String(id));
  populateRoleSelect();
  renderManageView();
  renderGridView();
}

// Check for token in URL
const urlToken = new URLSearchParams(location.search).get('token');
if (urlToken) { token = urlToken; loadAll(); }
</script>
