<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>服事表 - EmmArk</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1f6f54">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="小秘書">
  <style>
    :root {
      --bg: #f4f6f4;
      --surface: #ffffff;
      --ink: #1b2420;
      --muted: #6b7670;
      --line: #e7ebe8;
      --brand: #1f6f54;
      --brand-ink: #16513d;
      --brand-soft: #e8f2ed;
      --gold: #c2922f;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(20,40,30,.05), 0 6px 20px rgba(20,40,30,.05);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
    header { background: linear-gradient(135deg, #1b4536, #14352a); color: #fff; padding: 18px 28px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; box-shadow: 0 2px 12px rgba(20,40,30,.12); }
    header h1 { font-size: 18px; font-weight: 700; flex: 1; letter-spacing: .3px; }
    header a { color: rgba(255,255,255,.7); font-size: 13px; text-decoration: none; }
    header a:hover { color: #fff; }
    .container { max-width: 100%; padding: 24px 20px 60px; }
    .toolbar { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; align-items: center; }
    .btn { padding: 9px 18px; border-radius: 10px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; transition: filter .12s, transform .05s; }
    .btn:hover { filter: brightness(.95); }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-tab { background: #e9ece9; color: var(--muted); }
    .btn-tab.active { background: var(--brand); color: #fff; }
    .btn-manage { background: #5a6f66; color: #fff; }
    select, input[type="text"], input[type="password"], input[type="date"] {
      padding: 9px 13px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; background: var(--surface); color: var(--ink);
    }
    select:focus, input:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(31,111,84,.15); }

    /* Grid view */
    .grid-wrap { overflow-x: auto; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--line); }
    table.grid { border-collapse: collapse; background: var(--surface); min-width: 100%; }
    table.grid th { background: #f3f6f4; padding: 11px 14px; font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; border: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
    table.grid th.role-col { position: sticky; left: 0; z-index: 3; min-width: 90px; }
    table.grid td { padding: 8px 12px; border: 1px solid var(--line); font-size: 13px; vertical-align: top; min-width: 80px; white-space: nowrap; }
    table.grid td.role-label { background: #f3f6f4; font-weight: 700; font-size: 12px; color: var(--muted); position: sticky; left: 0; z-index: 1; border-right: 2px solid #dfe4e0; }
    table.grid td.today-col { background: #fbf3e3; }
    table.grid th.today-col { background: var(--gold) !important; color: #fff; }
    .person-chip { display: inline-block; background: var(--brand-soft); color: var(--brand-ink); border-radius: 14px; padding: 3px 10px; font-size: 12px; margin: 2px; cursor: pointer; font-weight: 500; }
    .person-chip:hover { background: var(--brand); color: #fff; }
    .add-chip { display: inline-block; background: #f1f3f1; color: #9aa39d; border-radius: 14px; padding: 3px 10px; font-size: 12px; margin: 2px; cursor: pointer; border: 1px dashed #c8cfc9; }
    .add-chip:hover { background: #e9ece9; }
    table.grid td.cell { cursor: text; }
    table.grid td.cell:hover { background: var(--brand-soft); }
    table.grid td.cell.today-col:hover { background: #f7ead2; }
    .cell-empty { color: #c2c9c3; font-size: 13px; }
    .cell-input { width: 100%; min-width: 120px; padding: 6px 8px; border: 2px solid var(--brand); border-radius: 8px; font-size: 13px; font-family: inherit; outline: none; }
    .paste-area { width: 100%; min-height: 200px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; font-size: 13px; font-family: 'SF Mono', Menlo, monospace; resize: vertical; }
    .paste-preview { max-height: 240px; overflow: auto; margin-top: 12px; border: 1px solid var(--line); border-radius: 10px; }
    .paste-preview table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .paste-preview th, .paste-preview td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; }
    .paste-preview th { background: #f3f6f4; }
    .modal.wide { max-width: 720px; }

    /* Person view */
    .person-view { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; border: 1px solid var(--line); }
    .person-view table { width: 100%; border-collapse: collapse; }
    .person-view th { background: #f3f6f4; padding: 13px 16px; text-align: left; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .4px; }
    .person-view td { padding: 13px 16px; border-top: 1px solid var(--line); font-size: 14px; }
    .date-badge { background: var(--brand-soft); color: var(--brand-ink); padding: 3px 10px; border-radius: 14px; font-size: 12px; font-weight: 600; }
    .date-badge.soon { background: #faecca; color: #976c14; }
    .role-badge { display: inline-block; background: #eef1ee; color: var(--ink); padding: 2px 9px; border-radius: 8px; font-size: 12px; margin: 2px; }

    /* Manage view */
    .manage-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 640px) { .manage-panels { grid-template-columns: 1fr; } }
    .manage-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; border: 1px solid var(--line); }
    .manage-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 16px; color: var(--brand-ink); }
    .manage-add-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .manage-add-row input, .manage-add-row select { flex: 1; }
    .manage-list { display: flex; flex-direction: column; gap: 6px; max-height: 420px; overflow-y: auto; }
    .manage-item { display: flex; align-items: center; justify-content: space-between; padding: 9px 13px; background: #f6f8f6; border-radius: 10px; font-size: 14px; }
    .manage-item span { color: var(--ink); }
    .manage-item .del-btn { background: none; border: none; color: #e5544b; font-size: 16px; cursor: pointer; padding: 0 4px; line-height: 1; }
    .manage-item .del-btn:hover { color: #c0392b; }
    .manage-tip { font-size: 12px; color: var(--muted); margin-top: 8px; }

    /* Login */
    #login { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(160deg, #1b4536, #0f2b22); }
    .login-box { background: var(--surface); border-radius: 20px; padding: 44px 40px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.3); min-width: 300px; }
    .login-box h2 { margin-bottom: 8px; color: var(--brand-ink); }
    .login-box p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
    .login-box input { width: 100%; padding: 13px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; margin-bottom: 14px; }
    .login-box button { width: 100%; padding: 13px; background: var(--brand); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
    .login-box button:hover { filter: brightness(.95); }
    #main { display: none; }

    /* Modal */
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(15,30,25,.5); backdrop-filter: blur(2px); z-index: 100; align-items: center; justify-content: center; }
    .modal-bg.open { display: flex; }
    .modal { background: var(--surface); border-radius: 18px; padding: 28px; width: 100%; max-width: 420px; margin: 16px; box-shadow: 0 24px 60px rgba(0,0,0,.25); }
    .modal h3 { margin-bottom: 20px; font-size: 18px; color: var(--brand-ink); }
    .modal label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; margin-top: 14px; font-weight: 500; }
    .modal input, .modal select { width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; }
    .modal-actions { display: flex; gap: 8px; margin-top: 22px; justify-content: flex-end; }
    .btn-cancel { background: #eceeec; color: var(--ink); }
    .btn-danger { background: #e5544b; color: #fff; margin-right: auto; }
    .empty { text-align: center; color: var(--muted); padding: 48px; font-size: 15px; }
    .loading { text-align: center; color: var(--muted); padding: 60px; font-size: 15px; }
  </style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <h2>⛪ 服事表</h2>
    <p>請輸入 Dashboard 密碼</p>
    <input type="password" id="tokenInput" placeholder="DASHBOARD_TOKEN" onkeydown="if(event.key==='Enter')doLogin()" />
    <button onclick="doLogin()">進入</button>
  </div>
</div>

<!-- Edit entry modal -->
<div class="modal-bg" id="editModal">
  <div class="modal">
    <h3 id="modalTitle">編輯服事</h3>
    <label>人員名稱</label>
    <input type="text" id="editPerson" list="personList" />
    <datalist id="personList"></datalist>
    <div class="modal-actions">
      <button class="btn btn-danger" onclick="deleteEntry()">刪除</button>
      <button class="btn btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveEdit()">儲存</button>
    </div>
  </div>
</div>

<!-- Add entry modal -->
<div class="modal-bg" id="addModal">
  <div class="modal">
    <h3>新增服事</h3>
    <label>日期</label>
    <select id="addDate"></select>
    <label>職位</label>
    <select id="addRole"></select>
    <label>人員名稱</label>
    <input type="text" id="addPerson" list="personList" />
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="document.getElementById('addModal').classList.remove('open')">取消</button>
      <button class="btn btn-primary" onclick="submitAdd()">新增</button>
    </div>
  </div>
</div>

<!-- Bulk paste modal -->
<div class="modal-bg" id="pasteModal">
  <div class="modal wide">
    <h3>📋 批次貼上服事表</h3>
    <p style="font-size:13px;color:#6e6e73;line-height:1.6;margin-bottom:12px">
      直接從 Excel / Google 試算表複製整塊貼上即可。<br>
      第一列為日期標題（如 <code>6/22</code>），第一欄為職位名稱；一格多人用 <code>、</code> 或空白分隔。<br>
      匯入會以「日期＋職位」為單位覆蓋，可重複貼上修正。
    </p>
    <textarea class="paste-area" id="pasteArea" placeholder="職位&#9;6/22&#9;6/29&#10;主領&#9;小明&#9;小華&#10;和聲&#9;阿美、阿花&#9;小芳" oninput="renderPastePreview()"></textarea>
    <div class="paste-preview" id="pastePreview"></div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="document.getElementById('pasteModal').classList.remove('open')">取消</button>
      <button class="btn btn-primary" id="pasteImportBtn" onclick="importPaste()">匯入</button>
    </div>
  </div>
</div>

<div id="main">
  <header>
    <h1>⛪ 主日服事表</h1>
    <a href="#" onclick="navTo('index.html')">📋 Dashboard</a>
    <a href="#" onclick="navTo('songs.html')">🎼 詩歌庫</a>
    <a href="#" onclick="navTo('order.html')">🎵 敬拜順序</a>
    <a href="#" onclick="navTo('meetings.html')">📝 會議記錄</a>
    <a href="#" onclick="navTo('links.html')">🔗 收藏</a>
  </header>
  <div class="container">
    <div class="toolbar">
      <button class="btn btn-tab active" id="tabGrid" onclick="switchView('grid')">格狀表格</button>
      <button class="btn btn-tab" id="tabPerson" onclick="switchView('person')">人員查詢</button>
      <button class="btn btn-tab" id="tabManage" onclick="switchView('manage')">⚙ 管理</button>
      <button class="btn btn-manage" id="pasteBtn" onclick="openPasteModal()" style="margin-left:auto">📋 批次貼上</button>
      <button class="btn btn-primary" id="addEntryBtn" onclick="openAddModal()">＋ 新增服事</button>
    </div>

    <div id="gridView">
      <div class="loading" id="gridLoading">載入中…</div>
      <div class="grid-wrap" id="gridWrap" style="display:none"></div>
    </div>

    <div id="personView" style="display:none">
      <div class="toolbar" style="margin-bottom:16px">
        <select id="personSelect" onchange="renderPersonView()">
          <option value="">— 選擇人員 —</option>
        </select>
      </div>
      <div class="person-view" id="personTable"></div>
    </div>

    <div id="manageView" style="display:none">
      <div class="manage-panels">
        <!-- Dates panel -->
        <div class="manage-card">
          <h3>📅 主日日期管理</h3>
          <div class="manage-add-row">
            <input type="date" id="newDateInput" />
            <button class="btn btn-primary" onclick="addDate()">新增</button>
          </div>
          <div class="manage-list" id="datesList"></div>
          <p class="manage-tip">刪除日期不會刪除該日的服事記錄，僅移除格子顯示。</p>
        </div>
        <!-- Roles panel -->
        <div class="manage-card">
          <h3>🎼 職位管理</h3>
          <div class="manage-add-row">
            <input type="text" id="newRoleInput" placeholder="新職位名稱" onkeydown="if(event.key==='Enter')addRole()" />
            <button class="btn btn-primary" onclick="addRole()">新增</button>
          </div>
          <div class="manage-list" id="rolesList"></div>
          <p class="manage-tip">新增職位會排在最後，刪除不影響已存在的服事記錄。</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let token = '';
function navTo(page) { window.location.href = '/' + page; }
let allData = [];   // worship_schedule rows
let allDates = [];  // worship_dates rows [{id, service_date}]
let allRoles = [];  // worship_roles rows [{id, role_name, sort_order}]
let editingId = null;
let gridRoles = [];  // role names as rendered (row order)
let gridDates = [];  // service_date strings as rendered (column order)
let currentEdit = null; // { ri, di } cell currently being edited inline

function doLogin() {
  token = document.getElementById('tokenInput').value.trim();
  if (!token) return alert('請輸入密碼');
  localStorage.setItem('dashboardToken', token);
  loadAll();
}

async function tryStoredLogin() {
  const saved = new URLSearchParams(location.search).get('token') || localStorage.getItem('dashboardToken');
  if (!saved) return;
  document.getElementById('login').style.display = 'none';
  const res = await fetch(`/api/dashboard/notes?limit=1`, { headers: { 'x-dashboard-token': saved } });
  if (res.status === 401) {
    localStorage.removeItem('dashboardToken');
    document.getElementById('login').style.display = 'flex';
    return;
  }
  token = saved;
  localStorage.setItem('dashboardToken', token);
  loadAll();
}
tryStoredLogin();

async function apiFetch(path, method = 'GET', body) {
  const res = await fetch(path, {
    method,
    headers: { 'Content-Type': 'application/json', 'x-dashboard-token': token },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { alert('密碼錯誤'); return null; }
  return res.json();
}

function scheduleApi(method, body) { return apiFetch('/api/worship/schedule', method, body); }
function configApi(resource, method, body) { return apiFetch(`/api/worship/config?resource=${resource}`, method, body); }

async function loadAll() {
  const [scheduleData, datesData, rolesData] = await Promise.all([
    scheduleApi('GET'),
    configApi('dates', 'GET'),
    configApi('roles', 'GET'),
  ]);
  if (!scheduleData || !datesData || !rolesData) return;
  allData = scheduleData;
  allDates = datesData;
  allRoles = rolesData;

  document.getElementById('login').style.display = 'none';
  document.getElementById('main').style.display = 'block';

  buildPersonList();
  populateDateSelect();
  populateRoleSelect();
  renderGridView();
  renderManageView();
}

function buildPersonList() {
  const people = [...new Set(allData.map(d => d.person_name))].sort();
  const dl = document.getElementById('personList');
  dl.innerHTML = people.map(p => `<option value="${p}">`).join('');
  const sel = document.getElementById('personSelect');
  sel.innerHTML = '<option value="">— 選擇人員 —</option>' +
    people.map(p => `<option value="${p}">${p}</option>`).join('');
}

function populateDateSelect() {
  const sel = document.getElementById('addDate');
  sel.innerHTML = allDates.map(d => {
    const dt = new Date(d.service_date + 'T00:00:00+08:00');
    const label = dt.toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', weekday: 'short', timeZone: 'Asia/Taipei' });
    return `<option value="${d.service_date}">${label}</option>`;
  }).join('');
}

function populateRoleSelect() {
  const sel = document.getElementById('addRole');
  sel.innerHTML = allRoles.map(r => `<option value="${r.role_name}">${r.role_name}</option>`).join('');
}

function renderGridView() {
  document.getElementById('gridLoading').style.display = 'none';
  const gridWrap = document.getElementById('gridWrap');
  gridWrap.style.display = '';

  const dates = allDates.map(d => d.service_date);
  const roles = allRoles.map(r => r.role_name);
  const today = new Date().toISOString().split('T')[0];
  const todayIdx = dates.findIndex(d => d >= today);

  const lookup = {};
  allData.forEach(item => {
    if (!lookup[item.role]) lookup[item.role] = {};
    if (!lookup[item.role][item.service_date]) lookup[item.role][item.service_date] = [];
    lookup[item.role][item.service_date].push({ id: item.id, name: item.person_name });
  });

  // Any roles in data not yet in worship_roles
  Object.keys(lookup).forEach(r => { if (!roles.includes(r)) roles.push(r); });

  gridRoles = roles;
  gridDates = dates;

  let html = '<table class="grid"><thead><tr>';
  html += '<th class="role-col">職位 \\ 日期</th>';
  dates.forEach((d, i) => {
    const dt = new Date(d + 'T00:00:00+08:00');
    const label = dt.toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', timeZone: 'Asia/Taipei' });
    const wday = dt.toLocaleDateString('zh-TW', { weekday: 'short', timeZone: 'Asia/Taipei' });
    const cls = (i === todayIdx) ? 'today-col' : '';
    html += `<th class="${cls}">${label}<br><small>${wday}</small></th>`;
  });
  html += '</tr></thead><tbody>';

  roles.forEach((role, ri) => {
    html += '<tr>';
    html += `<td class="role-label">${esc(role)}</td>`;
    dates.forEach((d, di) => {
      const cls = (di === todayIdx) ? 'cell today-col' : 'cell';
      html += `<td id="c-${ri}-${di}" class="${cls}" onclick="startEdit(${ri},${di})">${cellInner(ri, di)}</td>`;
    });
    html += '</tr>';
  });

  html += '</tbody></table>';
  gridWrap.innerHTML = html;
}

// 取得某格目前的人員名單
function cellPersons(ri, di) {
  const role = gridRoles[ri], date = gridDates[di];
  return allData.filter(d => d.role === role && d.service_date === date).map(d => d.person_name);
}

// 一格的顯示內容（chips 或空白提示）
function cellInner(ri, di) {
  const persons = cellPersons(ri, di);
  if (persons.length === 0) return '<span class="cell-empty">＋</span>';
  return persons.map(n => `<span class="person-chip">${esc(n)}</span>`).join('');
}

function renderCell(ri, di) {
  const td = document.getElementById(`c-${ri}-${di}`);
  if (td) td.innerHTML = cellInner(ri, di);
}

// 點格子 → 變成輸入框直接打字
function startEdit(ri, di) {
  if (currentEdit) {
    if (currentEdit.ri === ri && currentEdit.di === di) return; // already editing this cell
    return; // let blur of the other cell settle first
  }
  const td = document.getElementById(`c-${ri}-${di}`);
  if (!td) return;
  const val = cellPersons(ri, di).join('、');
  currentEdit = { ri, di };
  td.innerHTML = `<input class="cell-input" id="ci-${ri}-${di}" value="${esc(val)}" />`;
  const inp = document.getElementById(`ci-${ri}-${di}`);
  inp.focus();
  inp.select();
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commitEdit(ri, di, inp.value, e.shiftKey ? 'up' : 'down'); }
    else if (e.key === 'Tab') { e.preventDefault(); commitEdit(ri, di, inp.value, e.shiftKey ? 'left' : 'right'); }
    else if (e.key === 'Escape') { currentEdit = null; renderCell(ri, di); }
  });
  inp.addEventListener('blur', () => {
    if (currentEdit && currentEdit.ri === ri && currentEdit.di === di) commitEdit(ri, di, inp.value, null);
  });
}

async function commitEdit(ri, di, value, move) {
  const role = gridRoles[ri], date = gridDates[di];
  const names = value.split(/[、,，\s]+/).map(s => s.trim()).filter(Boolean);
  const before = cellPersons(ri, di);
  currentEdit = null;

  if (names.join('、') !== before.join('、')) {
    const res = await scheduleApi('PUT', { service_date: date, role, names });
    if (res && res.ok) {
      allData = allData.filter(d => !(d.role === role && d.service_date === date));
      (res.rows || []).forEach(r => allData.push(r));
      buildPersonList();
    } else {
      alert((res && res.error) || '儲存失敗');
    }
  }
  renderCell(ri, di);
  if (move) moveEdit(ri, di, move);
}

function moveEdit(ri, di, dir) {
  let nr = ri, nd = di;
  if (dir === 'down') nr++;
  else if (dir === 'up') nr--;
  else if (dir === 'right') nd++;
  else if (dir === 'left') nd--;
  if (nr < 0 || nr >= gridRoles.length || nd < 0 || nd >= gridDates.length) return;
  startEdit(nr, nd);
}

function renderPersonView() {
  const person = document.getElementById('personSelect').value;
  const el = document.getElementById('personTable');
  if (!person) { el.innerHTML = '<div class="empty">請選擇一位人員</div>'; return; }

  const today = new Date().toISOString().split('T')[0];
  const items = allData.filter(d => d.person_name === person).sort((a, b) => a.service_date.localeCompare(b.service_date));
  if (items.length === 0) { el.innerHTML = '<div class="empty">找不到此人的服事記錄</div>'; return; }

  const byDate = {};
  items.forEach(item => {
    if (!byDate[item.service_date]) byDate[item.service_date] = [];
    byDate[item.service_date].push(item.role);
  });

  let html = '<table><thead><tr><th>日期</th><th>職位</th></tr></thead><tbody>';
  Object.entries(byDate).forEach(([date, roles]) => {
    const dt = new Date(date + 'T00:00:00+08:00');
    const label = dt.toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', weekday: 'short', timeZone: 'Asia/Taipei' });
    const isPast = date < today;
    const isSoon = !isPast && date <= new Date(Date.now() + 14*24*60*60*1000).toISOString().split('T')[0];
    const badgeCls = isSoon ? 'date-badge soon' : 'date-badge';
    html += `<tr${isPast ? ' style="opacity:.45"' : ''}>`;
    html += `<td><span class="${badgeCls}">${label}</span></td>`;
    html += `<td>${roles.map(r => `<span class="role-badge">${esc(r)}</span>`).join(' ')}</td>`;
    html += '</tr>';
  });
  html += '</tbody></table>';
  el.innerHTML = html;
}

function renderManageView() {
  // Dates list
  const dl = document.getElementById('datesList');
  dl.innerHTML = allDates.map(d => {
    const dt = new Date(d.service_date + 'T00:00:00+08:00');
    const label = dt.toLocaleDateString('zh-TW', { year: 'numeric', month: 'numeric', day: 'numeric', weekday: 'short', timeZone: 'Asia/Taipei' });
    return `<div class="manage-item">
      <span>${label}</span>
      <button class="del-btn" onclick="deleteDate('${d.id}','${d.service_date}')" title="刪除">✕</button>
    </div>`;
  }).join('') || '<div class="empty" style="padding:20px">尚無日期</div>';

  // Roles list
  const rl = document.getElementById('rolesList');
  rl.innerHTML = allRoles.map((r, idx) => `<div class="manage-item">
    <span>${idx + 1}. ${esc(r.role_name)}</span>
    <button class="del-btn" onclick="deleteRole('${r.id}','${esc(r.role_name)}')" title="刪除">✕</button>
  </div>`).join('') || '<div class="empty" style="padding:20px">尚無職位</div>';
}

function switchView(view) {
  ['grid','person','manage'].forEach(v => {
    document.getElementById(v + 'View').style.display = v === view ? '' : 'none';
    document.getElementById('tab' + v[0].toUpperCase() + v.slice(1)).classList.toggle('active', v === view);
  });
  document.getElementById('addEntryBtn').style.display = view === 'manage' ? 'none' : '';
  document.getElementById('pasteBtn').style.display = view === 'grid' ? '' : 'none';
}

function openEditModal(id, name, role, date) {
  editingId = id;
  const dt = new Date(date + 'T00:00:00+08:00');
  const label = dt.toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', timeZone: 'Asia/Taipei' });
  document.getElementById('modalTitle').textContent = `${label} ${role}`;
  document.getElementById('editPerson').value = name;
  document.getElementById('editModal').classList.add('open');
}

function closeModal() {
  document.getElementById('editModal').classList.remove('open');
  editingId = null;
}

async function saveEdit() {
  const person_name = document.getElementById('editPerson').value.trim();
  if (!person_name) return alert('請填寫人員名稱');
  const res = await scheduleApi('PATCH', { id: editingId, person_name });
  if (!res) return;
  const item = allData.find(d => d.id === editingId);
  if (item) item.person_name = person_name;
  closeModal();
  buildPersonList();
  renderGridView();
}

async function deleteEntry() {
  if (!confirm('確定刪除此服事？')) return;
  await scheduleApi('DELETE', { id: editingId });
  allData = allData.filter(d => d.id !== editingId);
  closeModal();
  buildPersonList();
  renderGridView();
}

function openAddModal() {
  document.getElementById('addPerson').value = '';
  document.getElementById('addModal').classList.add('open');
}

function openAddModalFor(date, role) {
  document.getElementById('addDate').value = date;
  document.getElementById('addRole').value = role;
  document.getElementById('addPerson').value = '';
  document.getElementById('addModal').classList.add('open');
}

async function submitAdd() {
  const service_date = document.getElementById('addDate').value;
  const role = document.getElementById('addRole').value;
  const person_name = document.getElementById('addPerson').value.trim();
  if (!person_name) return alert('請填寫人員名稱');
  const data = await scheduleApi('POST', { service_date, role, person_name });
  if (!data || data.error) return alert(data?.error || '新增失敗');
  allData.push(data);
  document.getElementById('addModal').classList.remove('open');
  buildPersonList();
  renderGridView();
}

// Management actions

async function addDate() {
  const val = document.getElementById('newDateInput').value;
  if (!val) return alert('請選擇日期');
  const data = await configApi('dates', 'POST', { service_date: val });
  if (!data || data.error) return alert(data?.error || '新增失敗');
  allDates.push(data);
  allDates.sort((a, b) => a.service_date.localeCompare(b.service_date));
  document.getElementById('newDateInput').value = '';
  populateDateSelect();
  renderManageView();
  renderGridView();
}

async function deleteDate(id, dateStr) {
  if (!confirm(`確定刪除 ${dateStr}？`)) return;
  const res = await configApi('dates', 'DELETE', { id });
  if (!res) return;
  allDates = allDates.filter(d => d.id !== id);
  populateDateSelect();
  renderManageView();
  renderGridView();
}

async function addRole() {
  const val = document.getElementById('newRoleInput').value.trim();
  if (!val) return alert('請填寫職位名稱');
  const data = await configApi('roles', 'POST', { role_name: val });
  if (!data || data.error) return alert(data?.error || '新增失敗');
  allRoles.push(data);
  document.getElementById('newRoleInput').value = '';
  populateRoleSelect();
  renderManageView();
  renderGridView();
}

async function deleteRole(id, roleName) {
  if (!confirm(`確定刪除職位「${roleName}」？`)) return;
  const res = await configApi('roles', 'DELETE', { id });
  if (!res) return;
  allRoles = allRoles.filter(r => r.id !== id);
  populateRoleSelect();
  renderManageView();
  renderGridView();

// ---- 批次貼上 ----

function openPasteModal() {
  document.getElementById('pasteArea').value = '';
  document.getElementById('pastePreview').innerHTML = '';
  document.getElementById('pasteModal').classList.add('open');
  document.getElementById('pasteArea').focus();
}

// 把標題的日期文字（如「6/22」「6/22 (日)」）對應到實際 service_date
function matchDate(label) {
  const m = String(label).match(/(\d{1,2})\D+(\d{1,2})/);
  if (!m) return null;
  const mo = parseInt(m[1], 10), dy = parseInt(m[2], 10);
  const found = allDates.find(d => {
    const [, mm, dd] = d.service_date.split('-').map(Number);
    return mm === mo && dd === dy;
  });
  return found ? found.service_date : null;
}

function splitNames(cell) {
  return String(cell || '').split(/[、,，/\s]+/).map(s => s.trim()).filter(Boolean);
}

// 解析貼上的表格 → { columns:[{label, date}], rows:[{role, cellsByCol:[names...]}] }
function parsePaste(text) {
  const lines = text.replace(/\r/g, '').split('\n').filter(l => l.trim() !== '');
  if (lines.length < 2) return null;
  const splitCols = l => l.includes('\t') ? l.split('\t') : l.split(/ {2,}|,/);
  const header = splitCols(lines[0]);
  const columns = header.slice(1).map(label => ({ label: label.trim(), date: matchDate(label) }));
  const rows = lines.slice(1).map(line => {
    const cells = splitCols(line);
    const role = (cells[0] || '').trim();
    const cellsByCol = columns.map((_, j) => splitNames(cells[j + 1]));
    return { role, cellsByCol };
  }).filter(r => r.role);
  return { columns, rows };
}

function renderPastePreview() {
  const parsed = parsePaste(document.getElementById('pasteArea').value);
  const el = document.getElementById('pastePreview');
  if (!parsed) { el.innerHTML = ''; return; }
  const { columns, rows } = parsed;
  const matched = columns.filter(c => c.date).length;
  let html = `<div style="padding:6px 10px;font-size:12px;color:#6e6e73">對應到 ${matched}/${columns.length} 個日期欄、${rows.length} 個職位。<span style="color:#ff9500">紅字</span>＝找不到對應日期（會略過）。</div>`;
  html += '<table><thead><tr><th>職位</th>';
  columns.forEach(c => {
    html += `<th${c.date ? '' : ' style="color:#ff9500"'}>${esc(c.label)}</th>`;
  });
  html += '</tr></thead><tbody>';
  rows.forEach(r => {
    html += `<tr><td><b>${esc(r.role)}</b></td>`;
    r.cellsByCol.forEach(names => { html += `<td>${esc(names.join('、'))}</td>`; });
    html += '</tr>';
  });
  html += '</tbody></table>';
  el.innerHTML = html;
}

async function importPaste() {
  const parsed = parsePaste(document.getElementById('pasteArea').value);
  if (!parsed) return alert('沒有可匯入的內容');
  const bulkSet = [];
  parsed.rows.forEach(r => {
    parsed.columns.forEach((c, j) => {
      if (!c.date) return; // skip unmatched date columns
      bulkSet.push({ service_date: c.date, role: r.role, names: r.cellsByCol[j] });
    });
  });
  if (bulkSet.length === 0) return alert('沒有對應到任何日期欄，請確認標題列的日期格式（如 6/22），或先到「⚙ 管理」新增日期。');

  const btn = document.getElementById('pasteImportBtn');
  btn.disabled = true; btn.textContent = '匯入中…';
  const res = await scheduleApi('POST', { bulkSet });
  btn.disabled = false; btn.textContent = '匯入';
  if (!res || res.error) return alert((res && res.error) || '匯入失敗');

  allData = res.all || allData;
  document.getElementById('pasteModal').classList.remove('open');
  buildPersonList();
  renderGridView();
  alert(`✅ 匯入完成（${bulkSet.length} 格）`);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
